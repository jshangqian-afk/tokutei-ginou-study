<style>
:root{
  --blue:#00A0E9; --blue-d:#0079B0; --blue-l:#E6F6FD;
  --green:#1FA97C; --green-l:#E4F6EF;
  --red:#E5484D; --red-l:#FDECEC;
  --amber:#F5A524; --amber-l:#FEF3E2;
  --ink:#1A2027; --ink-2:#5A6472; --ink-3:#8A94A2;
  --line:#E3E8EF; --bg:#F5F7FA; --card:#FFFFFF;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.75;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
ruby{ruby-align:center}
rt{font-size:.52em;color:var(--ink-3);font-weight:400;line-height:1.1;letter-spacing:0}
body.nofuri rt{display:none}
.en{display:none;color:var(--ink-2);font-size:.86em;line-height:1.55;margin-top:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.showen .en{display:block}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
header h1{font-size:15px;margin:0;font-weight:700;flex:1;line-height:1.35}
header h1 small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.tgl{
  border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap;
}
.tgl.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- layout ---------- */
main{padding:14px 14px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .ic{font-size:18px}
.muted{color:var(--ink-3);font-size:13px;line-height:1.6}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,var(--blue),#37BDF5);color:#fff;border:none;padding:20px}
.hero .lbl{font-size:12px;opacity:.9;font-weight:600}
.hero .big{font-size:36px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.hero .sub{font-size:13px;opacity:.92}
.ring-row{display:flex;align-items:center;gap:18px}
.ring{width:92px;height:92px;flex:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stat-grid div b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.stat-grid div span{font-size:11px;color:var(--ink-3)}
.btn{
  display:block;width:100%;text-align:center;background:var(--blue);color:#fff;
  border-radius:14px;padding:15px;font-weight:700;font-size:16px;margin-top:10px;
  box-shadow:0 2px 0 var(--blue-d);
}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--blue-d)}
.btn.sec{background:var(--card);color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
.btn.warn{background:var(--amber);box-shadow:0 2px 0 #C7841A}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1.5px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.info-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.info-tbl td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.info-tbl td:first-child{color:var(--ink-3);width:38%;white-space:nowrap}
.info-tbl tr:last-child td{border-bottom:none}
.info-tbl b{color:var(--blue-d)}

/* ---------- lists ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 4px;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px;font-weight:600}
.row .t span{font-size:11.5px;color:var(--ink-3)}
.row .n{font-size:11px;color:var(--ink-3);white-space:nowrap}
.row .chev{color:var(--ink-3);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar i.low{background:var(--red)}
.bar i.mid{background:var(--amber)}
.chip{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--blue-l);color:var(--blue-d);vertical-align:middle
}
.chip.j{background:var(--amber-l);color:#9A6206}
.chip.g{background:var(--blue-l);color:var(--blue-d)}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--ink-3);font-weight:600}
.qbar .prog{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--ink)}
.timer.hot{color:var(--red)}
.qtext{font-size:18px;font-weight:600;line-height:2.05;margin:6px 0 16px}
.opt{
  display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 14px 14px 46px;margin-bottom:10px;position:relative;line-height:1.9;
  font-size:15.5px;
}
.opt .num{
  position:absolute;left:12px;top:13px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);color:var(--ink-3);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.sel .num{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.ok .num{background:var(--green);color:#fff}
.opt.ng{border-color:var(--red);background:var(--red-l)}
.opt.ng .num{background:var(--red);color:#fff}
.fb{border-radius:14px;padding:14px;margin-top:4px;font-size:14.5px;line-height:1.95}
.fb.ok{background:var(--green-l);border:1.5px solid #A8E0CB}
.fb.ng{background:var(--red-l);border:1.5px solid #F5C2C3}
.fb .hd{font-weight:800;font-size:15px;margin-bottom:6px}
.fb.ok .hd{color:#137A57}
.fb.ng .hd{color:#B3272C}
.fb .src{font-size:11.5px;color:var(--ink-3);margin-top:8px}

/* ---------- result ---------- */
.score{text-align:center;padding:8px 0 4px}
.score .pt{font-size:52px;font-weight:800;line-height:1}
.score .pt small{font-size:18px;color:var(--ink-3);font-weight:600}
.score .verdict{display:inline-block;padding:6px 18px;border-radius:99px;font-weight:800;font-size:15px;margin-top:10px}
.verdict.pass{background:var(--green-l);color:#137A57}
.verdict.fail{background:var(--red-l);color:#B3272C}

/* ---------- flashcard ---------- */
.fcard{
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;
  min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px;text-align:center;
}
.fcard .term{font-size:26px;font-weight:700;line-height:2}
.fcard .rd{font-size:13px;color:var(--ink-3);margin-top:6px}
.fcard .def{font-size:15.5px;line-height:2;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.fcard .hint{font-size:12px;color:var(--ink-3);margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin-top:0}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--ink-3);font-weight:600;
}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--blue)}
.hide{display:none !important}
.sp{height:6px}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--ink-2);font-weight:700}
</style>
</head>

/* ▲▲▲ 設定ここまで ▲▲▲ */

const DATA = {"questions":[{"id":"E01","chapter":"第1章 必要な技能","topic":"飲食料品製造業","type":"gakka","q":"{飲食料品|いんしょくりょうひん}{製造業|せいぞうぎょう}の「{飲食料品|いんしょくりょうひん}」とは{何|なに}のことですか。","q_en":"What does 'inshokuryohin' (food and beverages) mean?","choices":["{飲料|いんりょう}と{食料品|しょくりょうひん}のこと","{食料品|しょくりょうひん}だけのこと","{飲料|いんりょう}だけのこと"],"choices_en":["Beverages and food products","Only food products","Only beverages"],"answer":0,"explain":"{飲食料品|いんしょくりょうひん}とは、{飲料|いんりょう}と{食料品|しょくりょうひん}のことです。","explain_en":"'Inshokuryohin' means both beverages and food products.","page":1},{"id":"E02","chapter":"第1章 必要な技能","topic":"必要な技能","type":"gakka","q":"{飲食料品|いんしょくりょうひん}{製造業|せいぞうぎょう}{特定|とくてい}{技能|ぎのう}1{号|ごう}で、どの{業種|ぎょうしゅ}でも{必要|ひつよう}な{知識|ちしき}と{技能|ぎのう}は{何|なに}ですか。","q_en":"What knowledge and skills are needed in every job type under Specified Skilled Worker (i) in food manufacturing?","choices":["{食品|しょくひん}{衛生|えいせい}と{労働|ろうどう}{安全|あんぜん}","{機械|きかい}{設計|せっけい}と{経営|けいえい}","{日本語|にほんご}{文法|ぶんぽう}と{会計|かいけい}"],"choices_en":["Food hygiene and occupational safety","Machine design and management","Japanese grammar and accounting"],"answer":0,"explain":"どの{業種|ぎょうしゅ}でも「{食品|しょくひん}{衛生|えいせい}」と「{労働|ろうどう}{安全|あんぜん}」の{知識|ちしき}と{技能|ぎのう}が{必要|ひつよう}です。","explain_en":"In every job type, knowledge and skills in 'food hygiene' and 'occupational safety' are required.","page":3},{"id":"E03","chapter":"第2章 食品衛生","topic":"食品衛生","type":"gakka","q":"「{食品|しょくひん}{衛生|えいせい}」の{意味|いみ}として{正|ただ}しいものはどれですか。","q_en":"Which is the correct meaning of 'food hygiene'?","choices":["{食品|しょくひん}を{食|た}べて、{人|ひと}が{病気|びょうき}にならないこと、ケガをしないこと","{食品|しょくひん}をきれいに{見|み}せること","{食品|しょくひん}を{安|やす}く{作|つく}ること"],"choices_en":["People do not get sick or injured from eating the food","Making food look beautiful","Making food cheaply"],"answer":0,"explain":"「{食品|しょくひん}{衛生|えいせい}」とは、{食品|しょくひん}を{食|た}べて{人|ひと}が{病気|びょうき}にならないこと、ケガをしないことです。「{衛生|えいせい}」はいのち（{生命|せいめい}）をまもる（{衛|まも}る）ことです。","explain_en":"'Food hygiene' means that people do not get sick or injured from eating the food.","page":3},{"id":"E04","chapter":"第2章 食品衛生","topic":"一般衛生管理","type":"gakka","q":"どんな{食品|しょくひん}を{作|つく}るときも、どこの{作業場|さぎょうじょう}でも{共通|きょうつう}しておこなわれる{基本的|きほんてき}な{衛生|えいせい}{管理|かんり}を{何|なん}と{言|い}いますか。","q_en":"What is the name for the basic hygiene management done for all foods at every workplace?","choices":["{一般|いっぱん}{衛生|えいせい}{管理|かんり}","{重要|じゅうよう}{管理|かんり}{点|てん}の{管理|かんり}","{品質|ひんしつ}{保証|ほしょう}"],"choices_en":["General hygiene management","Critical control point management","Quality assurance"],"answer":0,"explain":"どんな{食品|しょくひん}でも、どこの{作業場|さぎょうじょう}でも{共通|きょうつう}しておこなう{基本的|きほんてき}な{衛生|えいせい}{管理|かんり}を「{一般|いっぱん}{衛生|えいせい}{管理|かんり}」と{言|い}います。","explain_en":"Basic hygiene management common to all foods and all workplaces is called 'general hygiene management'.","page":5},{"id":"E05","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"HACCPを{日本語|にほんご}に{翻訳|ほんやく}すると{何|なん}になりますか。","q_en":"What is the Japanese translation of HACCP?","choices":["{危害|きがい}{要因|よういん}{分析|ぶんせき}{重要|じゅうよう}{管理|かんり}{点|てん}","{食品|しょくひん}{安全|あんぜん}{基本法|きほんほう}","{総合|そうごう}{品質|ひんしつ}{管理|かんり}"],"choices_en":["Hazard Analysis and Critical Control Point","Basic Food Safety Act","Total quality management"],"answer":0,"explain":"HACCPは Hazard Analysis and Critical Control Point のことで、{日本語|にほんご}では「{危害|きがい}{要因|よういん}{分析|ぶんせき}{重要|じゅうよう}{管理|かんり}{点|てん}」です。ふつうは「HACCP」のまま{使|つか}われます。","explain_en":"HACCP stands for Hazard Analysis and Critical Control Point. It is usually used as 'HACCP'.","page":6},{"id":"E06","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"「HACCPによる{衛生|えいせい}{管理|かんり}」は、{何|なに}と{何|なに}を{組|く}み{合|あ}わせたものですか。","q_en":"What two things are combined in 'hygiene management based on HACCP'?","choices":["{一般|いっぱん}{衛生|えいせい}{管理|かんり}と{重要|じゅうよう}{管理|かんり}{点|てん}の{管理|かんり}（HACCPプラン）","{清掃|せいそう}と{検品|けんぴん}","{手洗|てあら}いと{服装|ふくそう}{点検|てんけん}"],"choices_en":["General hygiene management and critical control point management (HACCP plan)","Cleaning and product inspection","Handwashing and uniform checks"],"answer":0,"explain":"{一般|いっぱん}{衛生|えいせい}{管理|かんり}と{重要|じゅうよう}{管理|かんり}{点|てん}の{管理|かんり}（HACCPプラン）を{組|く}み{合|あ}わせておこなう{衛生|えいせい}{管理|かんり}が「HACCPによる{衛生|えいせい}{管理|かんり}」です。","explain_en":"HACCP-based hygiene management combines general hygiene management with critical control point management (the HACCP plan).","page":6},{"id":"E07","chapter":"第2章 食品衛生","topic":"危害要因","type":"gakka","q":"{危害|きがい}{要因|よういん}（ハザード）は{大|おお}きく{何|いく}つに{分|わ}けられますか。","q_en":"Into how many groups are hazards divided?","choices":["3つ（{物理的|ぶつりてき}・{化学的|かがくてき}・{生物的|せいぶつてき}）","2つ（{物理的|ぶつりてき}・{化学的|かがくてき}）","4つ（{物理的|ぶつりてき}・{化学的|かがくてき}・{生物的|せいぶつてき}・{心理的|しんりてき}）"],"choices_en":["Three (physical, chemical, biological)","Two (physical, chemical)","Four (physical, chemical, biological, psychological)"],"answer":0,"explain":"{危害|きがい}{要因|よういん}には「{物理的|ぶつりてき}{危害|きがい}{要因|よういん}」「{化学的|かがくてき}{危害|きがい}{要因|よういん}」「{生物的|せいぶつてき}{危害|きがい}{要因|よういん}」の3つがあります。","explain_en":"There are three types of hazards: physical, chemical, and biological.","page":7},{"id":"E08","chapter":"第2章 食品衛生","topic":"物理的危害要因","type":"gakka","q":"「{硬質|こうしつ}{異物|いぶつ}」にあてはまるものはどれですか。","q_en":"Which of these is a 'hard foreign object'?","choices":["{金属|きんぞく}{片|へん}・ガラス{片|へん}・{石|いし}","{髪|かみ}の{毛|け}","{紙片|しへん}"],"choices_en":["Metal pieces, glass pieces, stones","Hair","Pieces of paper"],"answer":0,"explain":"{異物|いぶつ}の{中|なか}で、{金属|きんぞく}{片|へん}やガラス{片|へん}、{石|いし}のように{硬|かた}いものを「{硬質|こうしつ}{異物|いぶつ}」と{言|い}います。","explain_en":"Hard foreign objects such as metal, glass, and stones are called 'hard foreign objects'.","page":7},{"id":"E09","chapter":"第2章 食品衛生","topic":"物理的危害要因","type":"gakka","q":"{虫|むし}や{髪|かみ}の{毛|け}、{紙片|しへん}について{正|ただ}しい{説明|せつめい}はどれですか。","q_en":"Which statement about insects, hair, and paper pieces is correct?","choices":["{物理的|ぶつりてき}{危害|きがい}{要因|よういん}ではないが、{食品|しょくひん}に{入|はい}らないようにしなければいけない","{物理的|ぶつりてき}{危害|きがい}{要因|よういん}なので、{必|かなら}ず{金属|きんぞく}{探知機|たんちき}で{見|み}つける","{硬|かた}くないので、{食品|しょくひん}に{入|はい}っても{問題|もんだい}ない"],"choices_en":["They are not physical hazards, but must still be kept out of food","They are physical hazards, so a metal detector must find them","They are soft, so it is fine if they get into food"],"answer":0,"explain":"{硬|かた}くない{異物|いぶつ}は{口|くち}やのどに{傷|きず}ができないので{物理的|ぶつりてき}{危害|きがい}{要因|よういん}ではありませんが、{苦情|くじょう}や{返品|へんぴん}につながるため{食品|しょくひん}に{入|はい}らないようにしなければいけません。","explain_en":"Soft foreign objects are not physical hazards, but they cause complaints and returns, so they must still be kept out of food.","page":8},{"id":"E10","chapter":"第2章 食品衛生","topic":"物理的危害要因","type":"jitsugi","q":"{作業中|さぎょうちゅう}に{製品|せいひん}の{中|なか}にガラス{片|へん}を{見|み}つけました。まず{何|なに}をしますか。","q_en":"You find a piece of glass in a product during work. What do you do first?","choices":["すぐに{作業|さぎょう}を{止|と}めて{責任者|せきにんしゃ}に{報告|ほうこく}する","ガラス{片|へん}だけ{取|と}り{除|のぞ}いて{作業|さぎょう}を{続|つづ}ける","{休憩|きゅうけい}{時間|じかん}になってから{報告|ほうこく}する"],"choices_en":["Stop work immediately and report to the supervisor","Remove only the glass and keep working","Report it after the break time"],"answer":0,"explain":"{異物|いぶつ}が{入|はい}っていることを{発見|はっけん}したときは、すぐに{作業|さぎょう}を{止|と}めて{責任者|せきにんしゃ}に{報告|ほうこく}します。","explain_en":"When you find a foreign object, stop work immediately and report it to the supervisor.","page":8},{"id":"E11","chapter":"第2章 食品衛生","topic":"化学的危害要因","type":"gakka","q":"{化学的|かがくてき}{危害|きがい}{要因|よういん}にあてはまらないものはどれですか。","q_en":"Which is NOT a chemical hazard?","choices":["ノロウイルス","アレルギー{物質|ぶっしつ}","ソラニン"],"choices_en":["Norovirus","Allergens","Solanine"],"answer":0,"explain":"アレルギー{物質|ぶっしつ}、ヒスタミン、ソラニン、{殺菌剤|さっきんざい}などの{薬剤|やくざい}が{化学的|かがくてき}{危害|きがい}{要因|よういん}です。ノロウイルスは{生物的|せいぶつてき}{危害|きがい}{要因|よういん}です。","explain_en":"Allergens, histamine, solanine, and chemicals such as disinfectants are chemical hazards. Norovirus is a biological hazard.","page":8},{"id":"E12","chapter":"第2章 食品衛生","topic":"アレルギー物質","type":"gakka","q":"{表示|ひょうじ}の{義務|ぎむ}がある「{特定|とくてい}{原材料|げんざいりょう}」は{何|なん}{品目|ひんもく}ですか。","q_en":"How many items are 'specified raw materials' that must be labeled?","choices":["9{品目|ひんもく}","20{品目|ひんもく}","28{品目|ひんもく}"],"choices_en":["9 items","20 items","28 items"],"answer":0,"explain":"{表示|ひょうじ}の{義務|ぎむ}があるのは「{特定|とくてい}{原材料|げんざいりょう}」9{品目|ひんもく}、{表示|ひょうじ}が{推奨|すいしょう}されているのが「{特定|とくてい}{原材料|げんざいりょう}に{準|じゅん}ずるもの」20{品目|ひんもく}です。","explain_en":"There are 9 'specified raw materials' that must be labeled, and 20 'items equivalent to specified raw materials' that are recommended to be labeled.","page":9},{"id":"E13","chapter":"第2章 食品衛生","topic":"アレルギー物質","type":"gakka","q":"{次|つぎ}のうち、{特定|とくてい}{原材料|げんざいりょう}（{表示|ひょうじ}{義務|ぎむ}9{品目|ひんもく}）にふくまれるものはどれですか。","q_en":"Which of these is one of the 9 'specified raw materials' (labeling required)?","choices":["そば","バナナ","ごま"],"choices_en":["Buckwheat (soba)","Banana","Sesame"],"answer":0,"explain":"{特定|とくてい}{原材料|げんざいりょう}9{品目|ひんもく}は、えび・かに・くるみ・{小麦|こむぎ}・そば・{卵|たまご}・{乳|にゅう}・{落花生|らっかせい}（ピーナッツ）・カシューナッツです。バナナとごまは「{特定|とくてい}{原材料|げんざいりょう}に{準|じゅん}ずるもの」です。","explain_en":"The 9 specified raw materials are shrimp, crab, walnut, wheat, buckwheat, egg, milk, peanut, and cashew nut. Banana and sesame are in the recommended group.","page":9},{"id":"E14","chapter":"第2章 食品衛生","topic":"アレルギー物質","type":"gakka","q":"2026{年|ねん}4{月|がつ}から{特定|とくてい}{原材料|げんざいりょう}に{追加|ついか}されたものはどれですか。","q_en":"Which item was added to the specified raw materials in April 2026?","choices":["カシューナッツ","ピスタチオ","アーモンド"],"choices_en":["Cashew nut","Pistachio","Almond"],"answer":0,"explain":"2026{年|ねん}4{月|がつ}から、{特定|とくてい}{原材料|げんざいりょう}に「カシューナッツ」が{追加|ついか}され、{特定|とくてい}{原材料|げんざいりょう}に{準|じゅん}ずるものに「ピスタチオ」が{追加|ついか}されました。","explain_en":"From April 2026, cashew nut was added to the specified raw materials, and pistachio was added to the recommended group.","page":9},{"id":"E15","chapter":"第2章 食品衛生","topic":"アレルギー物質","type":"jitsugi","q":"アレルギー{物質|ぶっしつ}をふくむ{原材料|げんざいりょう}の{調理|ちょうり}に{使|つか}った{機械|きかい}や{器具|きぐ}は、そのあとどうしますか。","q_en":"What should you do with machines and tools used for ingredients containing allergens?","choices":["{必|かなら}ず{洗浄|せんじょう}してから{次|つぎ}に{使|つか}う","アレルギー{物質|ぶっしつ}は{熱|ねつ}で{消|き}えるのでそのまま{使|つか}う","{布|ぬの}でかるく{拭|ふ}いてすぐ{次|つぎ}の{原材料|げんざいりょう}に{使|つか}う"],"choices_en":["Always wash them before the next use","Use as is, because allergens disappear with heat","Wipe lightly with a cloth and use immediately for the next ingredient"],"answer":0,"explain":"アレルギー{物質|ぶっしつ}をふくむ{原材料|げんざいりょう}の{調理|ちょうり}に{使|つか}った{機械|きかい}や{器具|きぐ}は、そのまま{次|つぎ}の{原材料|げんざいりょう}に{使|つか}ってはいけません。{必|かなら}ず{洗浄|せんじょう}します。","explain_en":"Machines and tools used with allergen-containing ingredients must always be washed before being used for other ingredients.","page":9},{"id":"E16","chapter":"第2章 食品衛生","topic":"ヒスタミン","type":"gakka","q":"ヒスタミン{食中毒|しょくちゅうどく}の{原因|げんいん}になりやすい{食品|しょくひん}はどれですか。","q_en":"Which food most easily causes histamine food poisoning?","choices":["マグロ・アジ・イワシ・サバなどの{赤身魚|あかみざかな}","じゃがいも","{牡蠣|かき}などの{二枚貝|にまいがい}"],"choices_en":["Red-meat fish such as tuna, horse mackerel, sardine, mackerel","Potatoes","Bivalves such as oysters"],"answer":0,"explain":"{悪|わる}い{条件|じょうけん}で{保存|ほぞん}された{魚|さかな}、{特|とく}にマグロやアジ、イワシ、サバなどの{赤身魚|あかみざかな}にヒスタミンがふくまれることがあります。","explain_en":"Histamine can form in fish stored under poor conditions, especially red-meat fish such as tuna, horse mackerel, sardine, and mackerel.","page":10},{"id":"E17","chapter":"第2章 食品衛生","topic":"ヒスタミン","type":"jitsugi","q":"{原材料|げんざいりょう}として{魚|さかな}を{受入|うけい}れました。ヒスタミンを{増|ふ}やさないために{正|ただ}しい{行動|こうどう}はどれですか。","q_en":"You have received fish as a raw material. What is the correct action to prevent histamine from increasing?","choices":["すぐに{冷蔵|れいぞう}または{冷凍|れいとう}する","{作業|さぎょう}が{終|お}わってからまとめて{冷蔵|れいぞう}する","よく{加熱|かねつ}すればよいので{常温|じょうおん}に{置|お}く"],"choices_en":["Refrigerate or freeze it immediately","Refrigerate it all together after work finishes","Leave it at room temperature since heating will solve it"],"answer":0,"explain":"ヒスタミンは{保存|ほぞん}{状態|じょうたい}が{悪|わる}いと{増|ふ}えるので、{受入|うけい}れた{魚|さかな}はすぐに{冷蔵|れいぞう}または{冷凍|れいとう}することが{必要|ひつよう}です。","explain_en":"Histamine increases under poor storage, so received fish must be refrigerated or frozen immediately.","page":10},{"id":"E18","chapter":"第2章 食品衛生","topic":"ソラニン","type":"gakka","q":"ソラニンはじゃがいものどの{部分|ぶぶん}にふくま ureus","Vibrio parahaemolyticus","Clostridium botulinum"],"answer":0,"explain":"{黄色|おうしょく}ブドウ{球菌|きゅうきん}は{人|ひと}の{皮膚|ひふ}や{傷口|きずぐち}にいます。{食品|しょくひん}の{中|なか}で{増|ふ}えて{熱|ねつ}に{強|つよ}い{毒素|どくそ}を{作|つく}ります。","explain_en":"Staphylococcus aureus lives on human skin and wounds. It grows in food and makes a heat-resistant toxin.","page":11},{"id":"E22","chapter":"第2章 食品衛生","topic":"食中毒菌","type":"gakka","q":"{腸管|ちょうかん}{出血性|しゅっけつせい}{大腸菌|だいちょうきん}（O157、O111など）の{主|おも}な{症状|しょうじょう}に{血便|けつべん}がありますが、{原因|げんいん}になりやすい{食品|しょくひん}はどれですか。","q_en":"Which food often causes enterohemorrhagic E. coli (O157, O111)?","choices":["{食肉|しょくにく}（{特|とく}に{牛肉|ぎゅうにく}）、{野菜|やさい}、{井戸水|いどみず}","{魚介類|ぎょかいるい}だけ","{瓶詰|びんづ}め・レトルト{食品|しょくひん}"],"choices_en":["Meat (especially beef), vegetables, well water","Only seafood","Bottled and retort foods"],"answer":0,"explain":"{腸管|ちょうかん}{出血性|しゅっけつせい}{大腸菌|だいちょうきん}は{食肉|しょくにく}（{特|とく}に{牛肉|ぎゅうにく}）、{野菜|やさい}、{井戸水|いどみず}が{原因|げんいん}となりやすく、{腹痛|ふくつう}・{激|はげ}しい{下痢|げり}・{血便|けつべん}を{起|お}こします。","explain_en":"Enterohemorrhagic E. coli often comes from meat (especially beef), vegetables, and well water, causing stomach pain, severe diarrhea, and bloody stool.","page":11},{"id":"E23","chapter":"第2章 食品衛生","topic":"食中毒菌","type":"gakka","q":"カレーやシチューなど{加熱|かねつ}{調理|ちょうり}された{食品|しょくひん}で{注意|ちゅうい}が{必要|ひつよう}な、{土|つち}のついた{原材料|げんざいりょう}が{原因|げんいん}になりやすい{食中毒菌|しょくちゅうどくきん}はどれですか。","q_en":"Which bacterium, coming from soil-covered ingredients, is a risk in cooked foods such as curry and stew?","choices":["ウェルシュ{菌|きん}","サルモネラ{属菌|ぞくきん}","カンピロバクター{属菌|ぞくきん}"],"choices_en":["Clostridium perfringens","Salmonella","Campylobacter"],"answer":0,"explain":"ウェルシュ{菌|きん}は{熱|ねつ}に{強|つよ}い{芽胞|がほう}を{作|つく}り、{土|つち}のついた{原材料|げんざいりょう}や{水|みず}、カレー・シチューなど{加熱|かねつ}{調理|ちょうり}された{食品|しょくひん}が{原因|げんいん}になります。","explain_en":"Clostridium perfringens makes heat-resistant spores and is linked to soil-covered ingredients, water, and cooked foods such as curry and stew.","page":11},{"id":"E24","chapter":"第2章 食品衛生","topic":"芽胞","type":"gakka","q":"「{芽胞|がほう}」の{説明|せつめい}として{正|ただ}しいものはどれですか。","q_en":"Which is the correct description of a 'spore'?","choices":["{殻|から}を{被|かぶ}った{細菌|さいきん}の{種|たね}のようなもので、{熱|ねつ}や{乾燥|かんそう}に{強|つよ}い","{細菌|さいきん}が{作|つく}る{毒素|どくそ}のこと","{細菌|さいきん}が{死|し}んだあとに{残|のこ}るからだのこと"],"choices_en":["A seed-like shell form of bacteria that resists heat and drying","A toxin made by bacteria","The body left behind after bacteria die"],"answer":0,"explain":"{芽胞|がほう}は{殻|から}を{被|かぶ}った{細菌|さいきん}の{種|たね}のようなものです。{細菌|さいきん}が{育|そだ}ちにくい{環境|かんきょう}になると{芽胞|がほう}を{作|つく}って{生|い}き{残|のこ}り、{環境|かんきょう}が{戻|もど}ると{増|ふ}え{始|はじ}めます。","explain_en":"A spore is like a seed of bacteria with a shell. Bacteria form spores to survive bad conditions and start growing again when conditions improve.","page":11},{"id":"E25","chapter":"第2章 食品衛生","topic":"食中毒予防の3原則","type":"gakka","q":"{細菌|さいきん}が{原因|げんいん}の{食中毒|しょくちゅうどく}を{防|ふせ}ぐ「{食中毒|しょくちゅうどく}{予防|よぼう}の3{原則|げんそく}」はどれですか。","q_en":"What are the '3 principles of food poisoning prevention' for bacteria?","choices":["つけない・{増|ふ}やさない・やっつける","{洗|あら}う・{切|き}る・{焼|や}く","{持|も}ち{込|こ}まない・{拡|ひろ}げない・{記録|きろく}する"],"choices_en":["Do not attach, do not increase, kill","Wash, cut, grill","Do not bring in, do not spread, record"],"answer":0,"explain":"{食中毒|しょくちゅうどく}{予防|よぼう}の3{原則|げんそく}は、ア「つけない」、イ「{増|ふ}やさない」、ウ「やっつける（{殺|ころ}す）」です。","explain_en":"The 3 principles are: do not attach bacteria, do not let them increase, and kill them.","page":12},{"id":"E26","chapter":"第2章 食品衛生","topic":"食中毒予防の3原則","type":"gakka","q":"{細菌|さいきん}の{増|ふ}え{方|かた}について、{正|ただ}しいものはどれですか。","q_en":"Which statement about bacterial growth is correct?","choices":["30〜40℃で{増|ふ}え{方|かた}が{速|はや}くなる","10℃{以下|いか}で{増|ふ}え{方|かた}が{速|はや}くなる","-15℃{以下|いか}でよく{増|ふ}える"],"choices_en":["They grow fastest at 30–40°C","They grow fastest below 10°C","They grow well below -15°C"],"answer":0,"explain":"{細菌|さいきん}の{多|おお}くは20℃から50℃を{好|この}み、{特|とく}に30から40℃で{増|ふ}え{方|かた}が{速|はや}くなります。10℃{以下|いか}では{遅|おそ}く、4℃{以下|いか}ではほとんど{増|ふ}えず、-15℃{以下|いか}では{増|ふ}えなくなります。","explain_en":"Most bacteria prefer 20–50°C and grow fastest at 30–40°C. Below 10°C growth slows, below 4°C almost stops, and below -15°C they do not grow.","page":12},{"id":"E27","chapter":"第2章 食品衛生","topic":"食中毒予防の3原則","type":"gakka","q":"{多|おお}くの{食中毒菌|しょくちゅうどくきん}を{殺菌|さっきん}できる{加熱|かねつ}{条件|じょうけん}はどれですか。","q_en":"Which heating condition kills most food poisoning bacteria?","choices":["75℃で1{分間|ふんかん}{以上|いじょう}","50℃で1{分間|ふんかん}{以上|いじょう}","60℃で10{秒間|びょうかん}"],"choices_en":["75°C for 1 minute or more","50°C for 1 minute or more","60°C for 10 seconds"],"answer":0,"explain":"{多|おお}くの{食中毒菌|しょくちゅうどくきん}は75℃で1{分間|ふんかん}{以上|いじょう}{加熱|かねつ}することで{殺菌|さっきん}できます。ただし{芽胞|がほう}にはもっと{厳|きび}しい{条件|じょうけん}が{必要|ひつよう}な{場合|ばあい}があります。","explain_en":"Most food poisoning bacteria are killed by heating at 75°C for at least 1 minute. Spores may need stronger conditions.","page":13},{"id":"E28","chapter":"第2章 食品衛生","topic":"食中毒予防の3原則","type":"jitsugi","q":"{加熱|かねつ}{調理|ちょうり}が{終|お}わった{食品|しょくひん}について、セレウス{菌|きん}やウェルシュ{菌|きん}を{増|ふ}やさないために{正|ただ}しい{行動|こうどう}はどれですか。","q_en":"After cooking, what is the correct action to stop Bacillus cereus and Clostridium perfringens from growing?","choices":["すぐに{冷|ひ}やす","ゆっくり{時間|じかん}をかけて{冷|ひ}ます","そのまま{常温|じょうおん}で{一晩|ひとばん}{置|お}く"],"choices_en":["Cool it quickly","Let it cool slowly over time","Leave it at room temperature overnight"],"answer":0,"explain":"セレウス{菌|きん}やウェルシュ{菌|きん}は、{加熱|かねつ}{調理|ちょうり}のあとゆっくり{温度|おんど}が{下|さ}がる{間|あいだ}に{増|ふ}えてしまうことがあります。{加熱|かねつ}{調理|ちょうり}が{終|お}わった{食品|しょくひん}はすぐに{冷|ひ}やすことが{重要|じゅうよう}です。","explain_en":"Bacillus cereus and Clostridium perfringens can grow while food cools slowly, so cooked food must be cooled quickly.","page":13},{"id":"E29","chapter":"第2章 食品衛生","topic":"ノロウイルス","type":"gakka","q":"ノロウイルスについて{正|ただ}しい{説明|せつめい}はどれですか。","q_en":"Which statement about norovirus is correct?","choices":["{食品|しょくひん}の{中|なか}では{増|ふ}えないが、{感染|かんせん}した{人|ひと}の{腸|ちょう}で{増|ふ}える","{食品|しょくひん}の{中|なか}でどんどん{増|ふ}える","アルコール{消毒|しょうどく}で{簡単|かんたん}に{死|し}ぬ"],"choices_en":["It does not grow in food, but grows in the intestines of infected people","It multiplies quickly inside food","It is easily killed by alcohol disinfection"],"answer":0,"explain":"ノロウイルスは{食品|しょくひん}の{中|なか}では{増|ふ}えませんが、{感染|かんせん}した{人|ひと}の{腸|ちょう}で{増|ふ}えます。アルコール{消毒|しょうどく}では{死|し}にません。","explain_en":"Norovirus does not grow in food but grows in the intestines of infected people. Alcohol disinfection does not kill it.","page":13},{"id":"E30","chapter":"第2章 食品衛生","topic":"ノロウイルス","type":"gakka","q":"ノロウイルスを{加熱|かねつ}でやっつけるための{条件|じょうけん}はどれですか。","q_en":"What heating condition kills norovirus?","choices":["{中心|ちゅうしん}{温度|おんど}85℃から90℃で90{秒間|びょうかん}{以上|いじょう}","{中心|ちゅうしん}{温度|おんど}75℃で1{分間|ふんかん}","{中心|ちゅうしん}{温度|おんど}60℃で1{分間|ふんかん}"],"choices_en":["Core temperature 85–90°C for 90 seconds or more","Core temperature 75°C for 1 minute","Core temperature 60°C for 1 minute"],"answer":0,"explain":"ノロウイルスをやっつけるには、{原材料|げんざいりょう}や{食品|しょくひん}の{中心|ちゅうしん}{温度|おんど}が85℃から90℃で90{秒間|びょうかん}{以上|いじょう}{加熱|かねつ}する{必要|ひつよう}があります。","explain_en":"To kill norovirus, food must reach a core temperature of 85–90°C for at least 90 seconds.","page":13},{"id":"E31","chapter":"第2章 食品衛生","topic":"ノロウイルス","type":"jitsugi","q":"ノロウイルス{対策|たいさく}として、{調理|ちょうり}に{使|つか}った{機械|きかい}や{器具|きぐ}を{洗浄|せんじょう}したあと、どうしますか。","q_en":"As a norovirus measure, what do you do with machines and tools after washing them?","choices":["200ppmの{次亜塩素酸|じあえんそさん}ナトリウム{溶液|ようえき}につけるか、それをつけた{布巾|ふきん}で{拭|ふ}く","アルコール{消毒液|しょうどくえき}をスプレーする","{水|みず}でよく{流|なが}して{自然|しぜん}{乾燥|かんそう}させる"],"choices_en":["Soak them in 200 ppm sodium hypochlorite solution, or wipe with a cloth soaked in it","Spray them with alcohol disinfectant","Rinse with water and air dry"],"answer":0,"explain":"ノロウイルスはアルコール{消毒|しょうどく}では{死|し}にません。{洗浄|せんじょう}したあとに{濃度|のうど}200ppmの{次亜塩素酸|じあえんそさん}ナトリウム{溶液|ようえき}につけるか、それをつけた{布巾|ふきん}などで{拭|ふ}きます。","explain_en":"Alcohol does not kill norovirus. After washing, soak items in 200 ppm sodium hypochlorite solution or wipe them with a cloth soaked in it.","page":13},{"id":"E32","chapter":"第2章 食品衛生","topic":"ノロウイルス","type":"gakka","q":"ノロウイルスによる{食中毒|しょくちゅうどく}を{防|ふせ}ぐ4{原則|げんそく}にふくまれないものはどれですか。","q_en":"Which is NOT one of the 4 principles for preventing norovirus food poisoning?","choices":["{増|ふ}やさない","{持|も}ち{込|こ}まない","{拡|ひろ}げない"],"choices_en":["Do not increase","Do not bring in","Do not spread"],"answer":0,"explain":"ノロウイルスは{食品|しょくひん}の{中|なか}では{増|ふ}えないので「{増|ふ}やさない」は{有効|ゆうこう}ではありません。4{原則|げんそく}は1){持|も}ち{込|こ}まない、2)つけない、3)やっつける、4){拡|ひろ}げない、です。","explain_en":"Norovirus does not grow in food, so 'do not increase' is not effective. The 4 principles are: do not bring in, do not attach, kill, and do not spread.","page":14},{"id":"E33","chapter":"第2章 食品衛生","topic":"寄生虫","type":"gakka","q":"アニサキスを{殺|ころ}す{条件|じょうけん}として{正|ただ}しいものはどれですか。","q_en":"Which condition kills Anisakis?","choices":["-20℃で24{時間|じかん}{以上|いじょう}{冷凍|れいとう}する","-5℃で3{時間|じかん}{冷凍|れいとう}する","{冷蔵庫|れいぞうこ}で{一晩|ひとばん}{保管|ほかん}する"],"choices_en":["Freeze at -20°C for 24 hours or more","Freeze at -5°C for 3 hours","Keep in a refrigerator overnight"],"answer":0,"explain":"アニサキスは70℃{以上|いじょう}で{加熱|かねつ}するか、60℃なら1{分間|ふんかん}{加熱|かねつ}すると{殺|ころ}せます。また、-20℃で24{時間|じかん}{以上|いじょう}{冷凍|れいとう}しても{殺|ころ}せます。","explain_en":"Anisakis is killed by heating above 70°C, or 60°C for 1 minute, or freezing at -20°C for 24 hours or more.","page":14},{"id":"E34","chapter":"第2章 食品衛生","topic":"カビ","type":"gakka","q":"カビについて{正|ただ}しい{説明|せつめい}はどれですか。","q_en":"Which statement about mold is correct?","choices":["{胞子|ほうし}はどこにでも{存在|そんざい}し、{完全|かんぜん}になくすことはできない","{胞子|ほうし}は{工場|こうじょう}の{清掃|せいそう}で{完全|かんぜん}になくせる","カビが{生|は}えた{食品|しょくひん}も、その{部分|ぶぶん}を{取|と}れば{使|つか}える"],"choices_en":["Mold spores exist everywhere and cannot be completely removed","Spores can be completely removed by cleaning the factory","Moldy food can be used if the moldy part is removed"],"answer":0,"explain":"カビの{胞子|ほうし}はどこにでも{存在|そんざい}していて{完全|かんぜん}になくすことはできません。カビが{生|は}えた{食品|しょくひん}は{使|つか}いません。","explain_en":"Mold spores exist everywhere and cannot be fully removed. Moldy food must not be used.","page":14},{"id":"A01","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓの「{整理|せいり}（Seiri）」とは{何|なん}ですか。","q_en":"What does 'Seiri' (sorting) of the 5S mean?","choices":["{使|つか}わないものをなくして、{使|つか}うものだけにすること","{器具|きぐ}や{道具|どうぐ}を、{必要|ひつよう}なときにすぐ{取|と}り{出|だ}せるようにすること","{設備|せつび}や{器具|きぐ}を{洗|あら}ったり{拭|ふ}いたりして、きれいな{状態|じょうたい}にすること"],"choices_en":["Removing things you do not use, and keeping only what you use","Arranging tools so you can take them out quickly when needed","Washing and wiping equipment and utensils to make them clean"],"answer":0,"explain":"{整理|せいり}は、いらない{器具|きぐ}や{道具|どうぐ}をなくして、{必要|ひつよう}な{器具|きぐ}や{道具|どうぐ}だけにすることです。","explain_en":"Seiri means getting rid of unnecessary tools and keeping only the ones you need.","page":15},{"id":"A02","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓの「{整頓|せいとん}（Seiton）」の{説明|せつめい}として{正|ただ}しいものはどれですか。","q_en":"Which is the correct explanation of 'Seiton' (setting in order)?","choices":["{器具|きぐ}や{道具|どうぐ}を、{必要|ひつよう}なときにすぐ{取|と}り{出|だ}せるようにすること","{使|つか}わないものをなくして、{使|つか}うものだけにすること","{決|き}められたことを{決|き}められたとおりにできるようになること"],"choices_en":["Making tools easy to take out immediately when they are needed","Removing what you do not use and keeping only what you use","Being able to do decided things exactly as they were decided"],"answer":0,"explain":"{整頓|せいとん}では、{場所|ばしょ}を{決|き}めて{置|お}いたり、{使|つか}いやすい{順序|じゅんじょ}に{並|なら}べたり、{名前|なまえ}や{数量|すうりょう}を{表示|ひょうじ}したりします。","explain_en":"For Seiton you decide fixed places, line items up in an easy-to-use order, and label names and quantities.","page":15},{"id":"A03","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓの「{清掃|せいそう}（Seisou）」とは{何|なん}ですか。","q_en":"What does 'Seisou' (cleaning) mean?","choices":["{設備|せつび}や{器具|きぐ}、{道具|どうぐ}を{洗|あら}ったり、{磨|みが}いたり、{拭|ふ}いたりして{汚|よご}れを{取|と}り{除|のぞ}くこと","{見|み}た{目|め}がきれいで、{食品衛生|しょくひんえいせい}にも{問題|もんだい}がないこと","{使|つか}いやすい{順序|じゅんじょ}に{並|なら}べて、{名前|なまえ}や{数量|すうりょう}を{表示|ひょうじ}すること"],"choices_en":["Washing, polishing and wiping equipment and tools to remove dirt","Looking clean and also having no food hygiene problem","Lining things up in an easy order and labelling names and quantities"],"answer":0,"explain":"{清掃|せいそう}は、{設備|せつび}や{器具|きぐ}、{道具|どうぐ}をきれいな{状態|じょうたい}にして、{汚|よご}れを{取|と}り{除|のぞ}くことです。","explain_en":"Seisou means making equipment and tools clean and removing dirt.","page":15},{"id":"A04","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓの「{清潔|せいけつ}（Seiketsu）」の{説明|せつめい}として{正|ただ}しいものはどれですか。","q_en":"Which is the correct explanation of 'Seiketsu' (cleanliness)?","choices":["{見|み}た{目|め}がきれいで、{設備|せつび}や{器具|きぐ}が{病原性微生物|びょうげんせいびせいぶつ}に{汚染|おせん}されていないこと","{使|つか}わない{器具|きぐ}や{道具|どうぐ}をなくすこと","{決|き}められたルールをそのとおりに{実行|じっこう}できること"],"choices_en":["Looking clean, and equipment and utensils are not contaminated with pathogenic microorganisms","Getting rid of tools you do not use","Being able to follow the decided rules exactly"],"answer":0,"explain":"{清潔|せいけつ}は、{整理|せいり}・{整頓|せいとん}・{清掃|せいそう}をして{見|み}た{目|め}がきれいで、{食品衛生|しょくひんえいせい}にも{問題|もんだい}がない{状態|じょうたい}です。","explain_en":"Seiketsu means that after sorting, ordering and cleaning, things look clean and there is no food hygiene problem.","page":15},{"id":"A05","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓの「{習慣付|しゅうかんづ}け（しつけ）」とは{何|なん}ですか。","q_en":"What does 'Shukanzuke / Shitsuke' (habit, discipline) mean?","choices":["{決|き}められたことを{決|き}められたとおりにできること","{汚|よご}れを{取|と}り{除|のぞ}いて、きれいな{状態|じょうたい}にすること","{必要|ひつよう}な{器具|きぐ}だけを{残|のこ}して、いらないものをなくすこと"],"choices_en":["Being able to do decided things exactly as decided","Removing dirt and making things clean","Keeping only necessary tools and removing unneeded ones"],"answer":0,"explain":"{習慣付|しゅうかんづ}け（しつけ）は、{整理|せいり}・{整頓|せいとん}・{清掃|せいそう}・{清潔|せいけつ}のルールを、そのとおりに{実行|じっこう}できるようになることです。","explain_en":"It means becoming able to carry out the rules of sorting, ordering, cleaning and cleanliness exactly as they are.","page":15},{"id":"A06","chapter":"第2章 食品衛生","topic":"5S","type":"gakka","q":"５Ｓは{食品衛生|しょくひんえいせい}のためだけでなく、{何|なに}のためにも{役立|やくだ}ちますか。","q_en":"Besides food hygiene, what else is 5S useful for?","choices":["{労働安全|ろうどうあんぜん}（{作業場|さぎょうば}で{病気|びょうき}になったりケガをしないこと）","{製品|せいひん}の{値段|ねだん}を{安|やす}くすること","{原材料|げんざいりょう}を{長|なが}く{保管|ほかん}できるようにすること"],"choices_en":["Occupational safety (not getting sick or injured in the workplace)","Making the product price cheaper","Making it possible to store raw materials for a long time"],"answer":0,"explain":"５Ｓは{労働安全|ろうどうあんぜん}にも{役立|やくだ}つので、{日本|にほん}や{世界|せかい}のさまざまな{工場|こうじょう}や{作業場|さぎょうば}でおこなわれています。","explain_en":"5S also helps occupational safety, so it is used in many factories and workplaces in Japan and around the world.","page":16},{"id":"A07","chapter":"第2章 食品衛生","topic":"施設・設備・器具などの衛生管理","type":"gakka","q":"「{交差汚染|こうさおせん}」とは{何|なん}ですか。","q_en":"What is 'cross contamination'?","choices":["{清潔|せいけつ}な{人|ひと}や{物|もの}が、{清潔|せいけつ}ではない{人|ひと}や{物|もの}に{触|ふ}れて、{危害要因|きがいよういん}に{汚染|おせん}されること","{食品|しょくひん}を{長|なが}い{時間|じかん}{保管|ほかん}して、{品質|ひんしつ}が{悪|わる}くなること","{食品|しょくひん}の{温度|おんど}が{上|あ}がって、{微生物|びせいぶつ}が{増|ふ}えること"],"choices_en":["Clean people or things touch unclean people or things and become contaminated with a hazard","Food is stored for a long time and its quality gets worse","The temperature of food rises and microorganisms increase"],"answer":0,"explain":"{交差汚染|こうさおせん}を{防止|ぼうし}するには、{施設|しせつ}、{設備|せつび}、{器具|きぐ}などを{正|ただ}しく{使|つか}い{分|わ}けることと、{清潔|せいけつ}に{保|たも}つことが{重要|じゅうよう}です。","explain_en":"To prevent cross contamination it is important to use facilities, equipment and utensils separately in the right way, and to keep them clean.","page":16},{"id":"A08","chapter":"第2章 食品衛生","topic":"区分衛生管理（ゾーニング）","type":"gakka","q":"「{区分衛生管理|くぶんえいせいかんり}（ゾーニング）」とは{何|なん}ですか。","q_en":"What is 'zoning' (area-based hygiene management)?","choices":["{作業場|さぎょうば}を{区域|くいき}に{分|わ}けて{衛生管理|えいせいかんり}をすること","{作業者|さぎょうしゃ}を{年齢|ねんれい}で{分|わ}けて{管理|かんり}すること","{原材料|げんざいりょう}を{種類|しゅるい}ごとに{注文|ちゅうもん}すること"],"choices_en":["Dividing the workplace into areas and managing hygiene for each area","Managing workers by dividing them by age","Ordering raw materials separately by type"],"answer":0,"explain":"{食品製造工場|しょくひんせいぞうこうじょう}の{中|なか}は、{通常|つうじょう}、{清潔作業区域|せいけつさぎょうくいき}、{準清潔作業区域|じゅんせいけつさぎょうくいき}、{汚染作業区域|おせんさぎょうくいき}などに{区分|くぶん}されています。","explain_en":"A food factory is usually divided into a clean area, a semi-clean area and a contaminated (dirty) area.","page":16},{"id":"A09","chapter":"第2章 食品衛生","topic":"区分衛生管理（ゾーニング）","type":"gakka","q":"「{清潔作業区域|せいけつさぎょうくいき}」では、どのような{食品|しょくひん}を{取|と}り{扱|あつか}いますか。","q_en":"What kind of food is handled in the 'clean working area'?","choices":["{加熱|かねつ}や{薬剤|やくざい}による{殺菌|さっきん}が{終|お}わった{食品|しょくひん}","{殺菌|さっきん}する{前|まえ}の{原材料|げんざいりょう}","{受|う}け{入|い}れたばかりの{原材料|げんざいりょう}"],"choices_en":["Food for which heating or chemical sterilization has finished","Raw materials before sterilization","Raw materials that have just been received"],"answer":0,"explain":"{惣菜製造業|そうざいせいぞうぎょう}では、トッピング、{盛|も}り{付|つ}け、{包装|ほうそう}などの{作業|さぎょう}をおこなう{区域|くいき}です。","explain_en":"In prepared-food manufacturing it is the area for topping, plating and packaging.","page":16},{"id":"A10","chapter":"第2章 食品衛生","topic":"区分衛生管理（ゾーニング）","type":"gakka","q":"{下処理|したしょり}や{加熱調理|かねつちょうり}をおこなう{区域|くいき}はどれですか。","q_en":"Which area is used for preparation and heat cooking?","choices":["{準清潔作業区域|じゅんせいけつさぎょうくいき}","{清潔作業区域|せいけつさぎょうくいき}","{汚染作業区域|おせんさぎょうくいき}"],"choices_en":["Semi-clean working area","Clean working area","Contaminated working area"],"answer":0,"explain":"{準清潔作業区域|じゅんせいけつさぎょうくいき}では{殺菌|さっきん}する{前|まえ}の{原材料|げんざいりょう}を{扱|あつか}います。{作業中|さぎょうちゅう}の{食品|しょくひん}が{作業前|さぎょうまえ}の{原材料|げんざいりょう}と{触|ふ}れないようにします。","explain_en":"The semi-clean area handles raw materials before sterilization. Food being processed must not touch raw materials that have not been processed yet.","page":16},{"id":"A11","chapter":"第2章 食品衛生","topic":"区分衛生管理（ゾーニング）","type":"gakka","q":"{出荷|しゅっか}するために{段|だん}ボール{箱|ばこ}に{詰|つ}めた{製品|せいひん}を{取|と}り{扱|あつか}う{区域|くいき}は、どの{区域|くいき}ですか。","q_en":"Which area is used for handling products packed in cardboard boxes for shipping?","choices":["{汚染作業区域|おせんさぎょうくいき}","{清潔作業区域|せいけつさぎょうくいき}","{準清潔作業区域|じゅんせいけつさぎょうくいき}"],"choices_en":["Contaminated working area","Clean working area","Semi-clean working area"],"answer":0,"explain":"{原材料|げんざいりょう}の{受入|うけい}れなど、{作業場|さぎょうば}の{外|そと}から{持|も}ち{込|こ}まれた{原材料|げんざいりょう}を{扱|あつか}う{区域|くいき}も{汚染作業区域|おせんさぎょうくいき}です。","explain_en":"The area where raw materials brought in from outside are received is also a contaminated working area.","page":16},{"id":"A12","chapter":"第2章 食品衛生","topic":"区分衛生管理（ゾーニング）","type":"gakka","q":"{原材料|げんざいりょう}を{段|だん}ボール{箱|ばこ}やコンテナのまま{準清潔作業区域|じゅんせいけつさぎょうくいき}や{清潔作業区域|せいけつさぎょうくいき}に{持|も}ち{込|こ}んではいけないのは、なぜですか。","q_en":"Why must raw materials not be brought into the semi-clean or clean areas still in their cardboard boxes or containers?","choices":["{段|だん}ボール{箱|ばこ}やコンテナが、{土|つち}やほこり、{虫|むし}や{微生物|びせいぶつ}などで{汚染|おせん}している{場合|ばあい}があるから","{段|だん}ボール{箱|ばこ}が{重|おも}くて、ケガをすることがあるから","{段|だん}ボール{箱|ばこ}の{中|なか}の{原材料|げんざいりょう}の{温度|おんど}が{上|あ}がるから"],"choices_en":["The boxes or containers may be contaminated with soil, dust, insects or microorganisms","Cardboard boxes are heavy and can cause injury","The temperature of the raw materials inside the box rises"],"answer":0,"explain":"{外|そと}から{持|も}ち{込|こ}まれた{段|だん}ボール{箱|ばこ}やコンテナは{汚|よご}れているおそれがあるため、{中身|なかみ}だけを{移|うつ}して{入|い}れます。","explain_en":"Boxes and containers brought from outside may be dirty, so only the contents are moved in.","page":17},{"id":"A13","chapter":"第2章 食品衛生","topic":"清掃・洗浄・消毒","type":"gakka","q":"{排水溝|はいすいこう}や{大|おお}きな{機械|きかい}の{下|した}に{特|とく}に{注意|ちゅうい}が{必要|ひつよう}なのは、なぜですか。","q_en":"Why do drains and the space under large machines need special attention?","choices":["{虫|むし}の{発生源|はっせいげん}になりやすいから","{機械|きかい}が{壊|こわ}れやすいから","{床|ゆか}がすべりやすくなるから"],"choices_en":["They easily become a source of insects","Machines break easily there","The floor becomes slippery"],"answer":0,"explain":"{排水溝|はいすいこう}は{蓋|ふた}を{外|はず}して{洗|あら}います。また、{微生物|びせいぶつ}が{増|ふ}えやすいので、{作業場|さぎょうば}の{床|ゆか}は{濡|ぬ}れたままにしてはいけません。","explain_en":"Take off the drain cover and wash inside. Also, do not leave the workplace floor wet, because microorganisms grow easily.","page":17},{"id":"A14","chapter":"第2章 食品衛生","topic":"清掃・洗浄・消毒","type":"gakka","q":"ミキサーやスライサーなどの{機械|きかい}の{洗浄|せんじょう}について、{正|ただ}しいものはどれですか。","q_en":"Which is correct about washing machines such as mixers and slicers?","choices":["{汚|よご}れが{目立|めだ}たなくても{毎日|まいにち}{洗浄|せんじょう}する","{汚|よご}れが{目立|めだ}ったときだけ{洗浄|せんじょう}する","{原材料|げんざいりょう}をかえるときは{洗浄|せんじょう}しなくてよい"],"choices_en":["Wash every day, even if dirt is not visible","Wash only when dirt is clearly visible","No washing is needed when changing raw materials"],"answer":0,"explain":"{機械|きかい}は、{原材料|げんざいりょう}をかえたときと{作業|さぎょう}が{終|お}わったときに{必|かなら}ず{洗浄|せんじょう}します。{分解|ぶんかい}できる{部分|ぶぶん}は{分解|ぶんかい}して{洗浄|せんじょう}し、{刃|は}など{食品|しょくひん}に{直接触|ちょくせつふ}れる{部分|ぶぶん}は{洗浄|せんじょう}の{後|あと}に{消毒|しょうどく}します。","explain_en":"Machines must be washed when raw materials are changed and when work finishes. Parts that can be taken apart are washed separately, and parts that touch food directly, such as blades, are disinfected after washing.","page":17},{"id":"A15","chapter":"第2章 食品衛生","topic":"清掃・洗浄・消毒","type":"gakka","q":"{包丁|ほうちょう}やまな{板|いた}などの{器具|きぐ}を{使|つか}ったあと、{正|ただ}しい{保管|ほかん}の{方法|ほうほう}はどれですか。","q_en":"After using utensils such as knives and cutting boards, what is the correct way to store them?","choices":["{決|き}められた{方法|ほうほう}で{洗|あら}い、{水分|すいぶん}が{残|のこ}らないように{乾燥|かんそう}させてから{保管|ほかん}する","{洗|あら}ったあと、{濡|ぬ}れたまますぐに{保管|ほかん}する","{汚|よご}れが{見|み}えないときは、{洗|あら}わずに{保管|ほかん}する"],"choices_en":["Wash by the decided method and dry so no water is left, then store","After washing, store immediately while still wet","If no dirt is visible, store without washing"],"answer":0,"explain":"{器具|きぐ}に{汚|よご}れが{残|のこ}っていたり{水分|すいぶん}がついていたりすると、{微生物|びせいぶつ}が{増|ふ}える{原因|げんいん}になります。たわしやスポンジなどの{清掃用具|せいそうようぐ}も、{汚|よご}れたまま・{濡|ぬ}れたままにしてはいけません。","explain_en":"Leftover dirt or water on utensils makes microorganisms grow. Cleaning tools such as brushes and sponges must also not be left dirty or wet.","page":17},{"id":"A16","chapter":"第2章 食品衛生","topic":"薬剤の管理","type":"gakka","q":"{殺菌剤|さっきんざい}や{洗浄剤|せんじょうざい}などの{薬剤|やくざい}の{保管|ほかん}について、{正|ただ}しいものはどれですか。","q_en":"Which is correct about storing chemicals such as sanitizers and detergents?","choices":["{決|き}められた{場所|ばしょ}に{保管|ほかん}し、{原材料|げんざいりょう}と{同|おな}じ{保管庫|ほかんこ}には{入|い}れない","{使|つか}いやすいように{原材料|げんざいりょう}と{同|おな}じ{保管庫|ほかんこ}に{入|い}れる","{名称|めいしょう}の{表示|ひょうじ}はしなくてもよい"],"choices_en":["Store in the decided place, never in the same store as raw materials","Store together with raw materials so they are easy to use","There is no need to label the name"],"answer":0,"explain":"{薬剤|やくざい}が{食品|しょくひん}に{混入|こんにゅう}すると{病気|びょうき}の{原因|げんいん}になり、{目|め}や{皮膚|ひふ}につくと{危険|きけん}です。{薬剤|やくざい}は{名称|めいしょう}が{分|わ}かるように{表示|ひょうじ}しなければいけません。","explain_en":"If chemicals get into food they can cause illness, and they are dangerous for eyes and skin. Chemicals must be labelled with their name.","page":18},{"id":"A17","chapter":"第2章 食品衛生","topic":"作業者の衛生管理","type":"gakka","q":"{作業|さぎょう}を{始|はじ}める{前|まえ}の「{健康|けんこう}チェック」では、{何|なに}を{確認|かくにん}しますか。","q_en":"What is checked in the 'health check' before starting work?","choices":["{下痢|げり}、{発熱|はつねつ}、{吐|は}き{気|け}などの{症状|しょうじょう}や{手指|てゆび}の{傷|きず}がないこと","{前|まえ}の{日|ひ}の{睡眠時間|すいみんじかん}と{体重|たいじゅう}","{作業服|さぎょうふく}のサイズと{洗濯|せんたく}した{日|ひ}"],"choices_en":["That there is no diarrhea, fever, nausea, or cuts on the hands and fingers","Sleeping hours of the previous day and body weight","The size of the uniform and the day it was washed"],"answer":0,"explain":"これらの{症状|しょうじょう}などがある{人|ひと}は、{必|かなら}ず{責任者|せきにんしゃ}へ{報告|ほうこく}しなければいけません。","explain_en":"Anyone with these symptoms must report to the supervisor.","page":18},{"id":"A23","chapter":"第2章 食品衛生","topic":"作業者の衛生管理","type":"jitsugi","q":"{作業中|さぎょうちゅう}に{手指|てゆび}を{切|き}ってケガをしました。まず{何|なに}をしますか。","q_en":"You cut your finger during work. What do you do first?","choices":["すぐに{作業|さぎょう}を{止|と}めて、{責任者|せきにんしゃ}へ{報告|ほうこく}する","ばんそうこうを{貼|は}って、そのまま{作業|さぎょう}を{続|つづ}ける","{作業|さぎょう}が{終|お}わってから{責任者|せきにんしゃ}へ{報告|ほうこく}する"],"choices_en":["Stop work immediately and report to the supervisor","Put on a plaster and continue working","Report to the supervisor after work is finished"],"answer":0,"explain":"{作業中|さぎょうちゅう}にお{腹|なか}が{痛|いた}くなったり、ケガをしたりしたときは、{作業|さぎょう}を{続|つづ}けてはいけません。すぐに{作業|さぎょう}を{止|と}めて{責任者|せきにんしゃ}へ{報告|ほうこく}します。","explain_en":"If you get a stomachache or an injury during work, do not continue. Stop at once and report to the supervisor.","page":18},{"id":"A24","chapter":"第2章 食品衛生","topic":"薬剤の管理","type":"jitsugi","q":"{名称|めいしょう}の{表示|ひょうじ}がない{薬剤|やくざい}の{容器|ようき}を{見|み}つけました。どうしますか。","q_en":"You find a chemical container with no name label. What do you do?","choices":["すぐに{責任者|せきにんしゃ}へ{報告|ほうこく}する","{中身|なかみ}の{臭|にお}いをかいで、{自分|じぶん}で{名前|なまえ}を{書|か}く","{使|つか}わないので、そのままにしておく"],"choices_en":["Report to the supervisor at once","Smell the contents and write the name yourself","Leave it as it is because you will not use it"],"answer":0,"explain":"{薬剤|やくざい}は{名称|めいしょう}が{分|わ}かるように{表示|ひょうじ}しなければいけません。{表示|ひょうじ}のないものを{見|み}つけたら、すぐに{責任者|せきにんしゃ}へ{報告|ほうこく}します。","explain_en":"Chemicals must be labelled with their name. If you find an unlabelled one, report it to the supervisor immediately.","page":18},{"id":"A18","chapter":"第2章 食品衛生","topic":"作業者の衛生管理","type":"gakka","q":"{作業者|さぎょうしゃ}は、{職場|しょくば}で{決|き}まっている{何|なに}を{受|う}けなければいけませんか。","q_en":"What must workers receive as decided by their workplace?","choices":["{定期的|ていきてき}な{健康診断|けんこうしんだん}や{検便|けんべん}","{毎日|まいにち}の{体力|たいりょく}テスト","{年|ねん}に１{回|かい}の{視力検査|しりょくけんさ}だけ"],"choices_en":["Regular health checkups and stool (feces) tests","A daily physical fitness test","Only an eyesight test once a year"],"answer":0,"explain":"{作業者|さぎょうしゃ}は、{職場|しょくば}で{決|き}まっている{定期的|ていきてき}な{健康診断|けんこうしんだん}や{検便|けんべん}を{受|う}けなければいけません。","explain_en":"Workers must take the regular health checkups and stool tests decided by the workplace.","page":19},{"id":"A19","chapter":"第2章 食品衛生","topic":"作業服","type":"gakka","q":"{作業場|さぎょうば}に{入|はい}るときの{身|み}だしなみについて、{正|ただ}しいものはどれですか。","q_en":"Which is correct about personal appearance when entering the workplace?","choices":["{爪|つめ}は{短|みじか}く{切|き}り、つけ{爪|づめ}やマニキュア、{指輪|ゆびわ}や{腕時計|うでどけい}はしない","{指輪|ゆびわ}は{手袋|てぶくろ}の{下|した}にすれば{入|はい}ってもよい","ヘアピンやつけまつげは{小|ちい}さいので{入|はい}ってもよい"],"choices_en":["Keep nails short; no false nails, nail polish, rings or watches","Rings are OK if you wear them under gloves","Hairpins and false eyelashes are OK because they are small"],"answer":0,"explain":"{指輪|ゆびわ}、{腕輪|うでわ}、{腕時計|うでどけい}、アクセサリー（イヤリング、ネックレス、ピアス）、ヘアピン、つけまつげなどをして{作業場|さぎょうば}に{入|はい}ってはいけません。","explain_en":"Rings, bracelets, watches, accessories (earrings, necklaces, piercings), hairpins and false eyelashes must not be worn into the workplace.","page":19},{"id":"A20","chapter":"第2章 食品衛生","topic":"作業服","type":"gakka","q":"{作業服|さぎょうふく}の{一般的|いっぱんてき}な{着用|ちゃくよう}の{順序|じゅんじょ}として{正|ただ}しいものはどれですか。","q_en":"Which is the correct general order for putting on the work clothes?","choices":["ブラッシング → ヘアーネット → {帽子|ぼうし} → {作業服|さぎょうふく} → {確認|かくにん}","{作業服|さぎょうふく} → {帽子|ぼうし} → ヘアーネット → ブラッシング → {確認|かくにん}","ヘアーネット → ブラッシング → {作業服|さぎょうふく} → {帽子|ぼうし} → {確認|かくにん}"],"choices_en":["Brushing hair, hair net, cap, work clothes, then check","Work clothes, cap, hair net, brushing, then check","Hair net, brushing, work clothes, cap, then check"],"answer":0,"explain":"{最後|さいご}に{鏡|かがみ}で、マスクから{鼻|はな}が{出|で}ていないこと、{帽子|ぼうし}やヘアーネットから{耳|みみ}や{髪|かみ}の{毛|け}が{出|で}ていないことなどを{確認|かくにん}します。","explain_en":"At the end, use a mirror to check that the nose is not out of the mask and that ears and hair are not out of the cap or hair net.","page":20},{"id":"A25","chapter":"第2章 食品衛生","topic":"作業服","type":"jitsugi","q":"{作業場|さぎょうば}が{暑|あつ}くて{汗|あせ}をかいています。{正|ただ}しい{行動|こうどう}はどれですか。","q_en":"The workplace is hot and you are sweating. What is the correct action?","choices":["{帽子|ぼうし}やマスクは{外|はず}さず、{袖|そで}もまくらないで{作業|さぎょう}を{続|つづ}ける","{暑|あつ}いので{帽子|ぼうし}を{脱|ぬ}いで{作業|さぎょう}する","{作業服|さぎょうふく}の{袖|そで}をまくって{作業|さぎょう}する"],"choices_en":["Keep the cap and mask on, do not roll up sleeves, and continue working","Take off the cap because it is hot","Roll up the sleeves of the work clothes"],"answer":0,"explain":"{作業服|さぎょうふく}は{作業中|さぎょうちゅう}もいつも{正|ただ}しく{着用|ちゃくよう}していなければいけません。{暑|あつ}くても{帽子|ぼうし}を{脱|ぬ}いだり、{袖|そで}をまくったり、マスクを{外|はず}したりしてはいけません。","explain_en":"Work clothes must always be worn correctly during work. Even if it is hot, do not remove the cap, roll up sleeves, or take off the mask.","page":20},{"id":"A27","chapter":"第2章 食品衛生","topic":"区分衛生管理と作業服","type":"jitsugi","q":"{作業中|さぎょうちゅう}にトイレに{行|い}きます。{正|ただ}しい{行動|こうどう}はどれですか。","q_en":"You are going to the toilet during work. What is the correct action?","choices":["トイレ{用|よう}の{履物|はきもの}に{履|は}き{替|か}え、{戻|もど}るときは{手洗|てあら}いをする","{作業場|さぎょうば}で{使|つか}っている{靴|くつ}のままトイレに{入|はい}る","{作業服|さぎょうふく}や{帽子|ぼうし}のまま{作業場|さぎょうば}の{外|そと}に{出|で}てもよい"],"choices_en":["Change into toilet footwear, and wash your hands before returning","Enter the toilet wearing the shoes used in the workplace","It is fine to go outside the workplace in your work clothes and cap"],"answer":0,"explain":"トイレでは、トイレ{用|よう}の{履物|はきもの}に{履|は}き{替|か}えなければいけません。また、{作業場|さぎょうば}で{使|つか}っている{作業服|さぎょうふく}、{帽子|ぼうし}や{靴|くつ}のまま{作業場|さぎょうば}の{外|そと}に{出|で}てはいけません。{外|そと}の{土|つち}やほこり、{虫|むし}や{微生物|びせいぶつ}を{持|も}ち{込|こ}んでしまうからです。トイレのあとは{手洗|てあら}いをします。","explain_en":"You must change into toilet footwear. Also, do not go outside the workplace in work clothes, cap or shoes, because you would bring soil, dust, insects and microorganisms back in. Wash hands after using the toilet.","page":21},{"id":"A21","chapter":"第2章 食品衛生","topic":"作業服","type":"gakka","q":"マスクの{正|ただ}しい{着|つ}け{方|かた}はどれですか。","q_en":"Which is the correct way to wear a mask?","choices":["{鼻|はな}からあごまでかかるようにして、{針金|はりがね}を{折|お}り{鼻|はな}との{間|あいだ}に{隙間|すきま}をつくらない","{息|いき}が{苦|くる}しいので{鼻|はな}は{出|だ}してもよい","あごの{下|した}にかけておき、{話|はな}すときだけ{上|あ}げる"],"choices_en":["Cover from nose to chin, bend the wire so there is no gap at the nose","The nose may be left out because breathing is hard","Keep it under the chin and pull it up only when speaking"],"answer":0,"explain":"マスクは{鼻|はな}からあごまでかかり、ほほとの{間|あいだ}にも{隙間|すきま}をつくらないようにします。{作業中|さぎょうちゅう}にマスクを{外|はず}してはいけません。","explain_en":"The mask must cover from nose to chin with no gap at the cheeks. Do not take the mask off during work.","page":23},{"id":"A22","chapter":"第2章 食品衛生","topic":"手洗い","type":"gakka","q":"{正|ただ}しい{手洗|てあら}いで、せっけんをつけて{洗|あら}う{時間|じかん}の{目安|めやす}はどれですか。","q_en":"In correct handwashing, about how long should you wash with soap?","choices":["３０{秒間程度|びょうかんていど}","１０{秒間程度|びょうかんていど}","６０{秒間程度|びょうかんていど}"],"choices_en":["About 30 seconds","About 10 seconds","About 60 seconds"],"answer":0,"explain":"せっけんで{手|て}や{指|ゆび}、{手首|てくび}まで３０{秒間程度|びょうかんていど}{洗|あら}い、{流水|りゅうすい}で２０{秒間程度|びょうかんていど}{洗|あら}い{流|なが}します。そのあと{使|つか}い{捨|す}てのペーパータオルかエアータオルで{手|て}を{乾|かわ}かし、{消毒用|しょうどくよう}アルコールを{両手|りょうて}にすりこみます。","explain_en":"Wash hands, fingers and wrists with soap for about 30 seconds, rinse with running water for about 20 seconds, dry with a disposable paper towel or air towel, then rub alcohol sanitizer into both hands.","page":25},{"id":"A26","chapter":"第2章 食品衛生","topic":"手袋・エプロン","type":"jitsugi","q":"{生|なま}の{肉|にく}を{調理|ちょうり}したあとに、{野菜|やさい}を{調理|ちょうり}します。{正|ただ}しい{行動|こうどう}はどれですか。","q_en":"After preparing raw meat you will prepare vegetables. What is the correct action?","choices":["{手袋|てぶくろ}を{交換|こうかん}してから{野菜|やさい}を{調理|ちょうり}する","{同|おな}じ{手袋|てぶくろ}を{水|みず}で{洗|あら}って、そのまま{使|つか}う","{手袋|てぶくろ}は{破|やぶ}れていないので、そのまま{野菜|やさい}を{調理|ちょうり}する"],"choices_en":["Change gloves before handling the vegetables","Rinse the same gloves with water and keep using them","Keep the same gloves because they are not torn"],"answer":0,"explain":"{取|と}り{扱|あつか}う{原材料|げんざいりょう}をかえるときは{手袋|てぶくろ}を{交換|こうかん}します。{先|さき}に{取|と}り{扱|あつか}った{原材料|げんざいりょう}の{危害要因|きがいよういん}（{病原性微生物|びょうげんせいびせいぶつ}やアレルギー{物質|ぶっしつ}）を{次|つぎ}の{原材料|げんざいりょう}につけないためです。","explain_en":"Change gloves when you change the raw material you handle, so that hazards from the first material (pathogens or allergens) do not move to the next one.","page":26},{"id":"A28","chapter":"第2章 食品衛生","topic":"作業者が守らなければならないこと","type":"jitsugi","q":"{作業中|さぎょうちゅう}に、つい{髪|かみ}の{毛|け}や{鼻|はな}を{触|さわ}ってしまいました。どうしますか。","q_en":"During work you accidentally touched your hair or nose. What do you do?","choices":["もう{一度|いちど}{手洗|てあら}いをするか、{手袋|てぶくろ}を{交換|こうかん}する","{作業服|さぎょうふく}で{手|て}を{拭|ふ}いてから{作業|さぎょう}を{続|つづ}ける","{何|なに}もつけていないので、そのまま{作業|さぎょう}を{続|つづ}ける"],"choices_en":["Wash your hands again, or change your gloves","Wipe your hands on your work clothes and continue","Continue as usual because nothing is stuck on your hands"],"answer":0,"explain":"{髪|かみ}の{毛|け}や{目|め}、{鼻|はな}、{口|くち}の{周|まわ}りを{触|さわ}った{手|て}で{作業|さぎょう}をしてはいけません。また、{作業服|さぎょうふく}で{手|て}を{拭|ふ}いてはいけません。","explain_en":"Do not work with hands that have touched hair, eyes, nose or mouth. Also, never wipe your hands on your work clothes.","page":26},{"id":"A29","chapter":"第2章 食品衛生","topic":"作業者が守らなければならないこと","type":"jitsugi","q":"{作業|さぎょう}を{始|はじ}める{前|まえ}に、{作業者|さぎょうしゃ}がしなければならないことはどれですか。","q_en":"What must a worker do before starting work?","choices":["{作業手順書|さぎょうてじゅんしょ}を{見|み}て{作業|さぎょう}を{確認|かくにん}し、{機械|きかい}・{装置|そうち}・{器具|きぐ}に{汚|よご}れや{不備|ふび}がないか{確認|かくにん}する","{機械|きかい}を{動|うご}かしてから、{作業手順書|さぎょうてじゅんしょ}を{読|よ}む","{前|まえ}の{日|ひ}と{同|おな}じ{作業|さぎょう}なので、{確認|かくにん}しないで{始|はじ}める"],"choices_en":["Read the work procedure manual and check machines, devices and utensils for dirt or defects","Start the machine first, then read the procedure manual","Start without checking because the work is the same as yesterday"],"answer":0,"explain":"{作業|さぎょう}の{前|まえ}に{作業手順書|さぎょうてじゅんしょ}を{見|み}て、どこでどんな{作業|さぎょう}をするのか{確認|かくにん}します。{使|つか}う{機械|きかい}・{装置|そうち}・{器具|きぐ}などに{汚|よご}れや{不備|ふび}がないかも{確認|かくにん}します。","explain_en":"Before work, read the procedure manual to check where and what work you will do, and check the machines, devices and utensils for dirt or problems.","page":26},{"id":"A30","chapter":"第2章 食品衛生","topic":"作業者が守らなければならないこと","type":"jitsugi","q":"{作業場|さぎょうば}に{持|も}ち{込|こ}んでよいものはどれですか。","q_en":"Which of these may be brought into the workplace?","choices":["どれも{持|も}ち{込|こ}んではいけない","ポケットに{入|い}れたスマートフォンや{財布|さいふ}","ホチキスの{針|はり}やクリップがついた{書類|しょるい}、シャープペン"],"choices_en":["None of them may be brought in","A smartphone or wallet kept in your pocket","Documents with staples or clips, and a mechanical pencil"],"answer":0,"explain":"{作業|さぎょう}に{関係|かんけい}のない{持|も}ち{物|もの}（{時計|とけい}、スマートフォン、{財布|さいふ}、{写真|しゃしん}、たばこなど）を{持|も}ち{込|こ}んではいけません。ホチキスの{針|はり}やクリップ、{鉛筆|えんぴつ}やシャープペンの{折|お}れた{芯|しん}は{異物混入|いぶつこんにゅう}の{原因|げんいん}になります。{香水|こうすい}など{強|つよ}い{臭|にお}いがするものも{持|も}ち{込|こ}んではいけません。","explain_en":"Personal items not related to work (watch, smartphone, wallet, photos, cigarettes) must not be brought in. Staples, clips and broken pencil leads cause foreign-object contamination. Strongly scented items such as perfume are also not allowed.","page":26},{"id":"B01","chapter":"第2章 食品衛生","topic":"原材料の保管","type":"gakka","q":"{生鮮魚介類|せいせんぎょかいるい}の{保管|ほかん}{温度|おんど}は{何|なん}{度|ど}{以下|いか}ですか。","q_en":"At what temperature or below should fresh fish and shellfish be stored?","choices":["5℃{以下|いか}","10℃{以下|いか}","15℃{以下|いか}"],"choices_en":["5 degrees C or below","10 degrees C or below","15 degrees C or below"],"answer":0,"explain":"テキストの{保管|ほかん}{温度|おんど}{表|ひょう}では、{生鮮魚介類|せいせんぎょかいるい}は5℃{以下|いか}です。{食肉|しょくにく}やゆでだこは10℃{以下|いか}、{米穀類|べいこくるい}は15℃{以下|いか}です。","explain_en":"In the storage temperature table, fresh fish and shellfish are 5 degrees C or below. Meat and boiled octopus are 10 degrees C or below; rice and grains are 15 degrees C or below.","page":29},{"id":"B02","chapter":"第2章 食品衛生","topic":"原材料の保管","type":"gakka","q":"{冷凍|れいとう}{食品|しょくひん}や{冷凍|れいとう}{水産物|すいさんぶつ}の{保管|ほかん}{温度|おんど}は{何|なん}{度|ど}{以下|いか}ですか。","q_en":"At what temperature or below should frozen foods and frozen seafood be stored?","choices":["－10℃{以下|いか}","－15℃{以下|いか}","－18℃{以下|いか}"],"choices_en":["-10 degrees C or below","-15 degrees C or below","-18 degrees C or below"],"answer":2,"explain":"{冷凍|れいとう}{水産物|すいさんぶつ}・{冷凍|れいとう}{食品|しょくひん}・{凍結卵|とうけつらん}は－18℃{以下|いか}です。{冷凍|れいとう}{食肉|しょくにく}と{冷凍|れいとう}{食肉|しょくにく}{製品|せいひん}は－15℃{以下|いか}なので{注意|ちゅうい}します。","explain_en":"Frozen seafood, frozen foods and frozen eggs are -18 degrees C or below. Note that frozen meat and frozen meat products are -15 degrees C or below.","page":29},{"id":"B03","chapter":"第2章 食品衛生","topic":"冷蔵庫・冷凍庫の管理","type":"gakka","q":"{冷蔵庫|れいぞうこ}に{原材料|げんざいりょう}を{隙間|すきま}なく{詰|つ}め{込|こ}んではいけないのはなぜですか。","q_en":"Why should you not pack materials into a refrigerator with no gaps?","choices":["{冷気|れいき}が{冷蔵庫|れいぞうこ}{内|ない}{全体|ぜんたい}に{回|まわ}らなくなるから","{電気代|でんきだい}が{高|たか}くなるから","{原材料|げんざいりょう}の{形|かたち}がくずれるから"],"choices_en":["Cold air cannot circulate through the whole refrigerator","The electricity bill goes up","The shape of the materials is damaged"],"answer":0,"explain":"{隙間|すきま}がないと{冷気|れいき}が{全体|ぜんたい}に{回|まわ}らず、{原材料|げんざいりょう}を{十分|じゅうぶん}に{冷|ひ}やすことができません。","explain_en":"Without gaps, cold air cannot circulate, so the materials cannot be cooled enough.","page":30},{"id":"B04","chapter":"第2章 食品衛生","topic":"冷蔵庫・冷凍庫の管理","type":"gakka","q":"{冷凍庫|れいとうこ}に{冷凍|れいとう}{食品|しょくひん}を8〜9{割|わり}{詰|つ}めた{方|ほう}がよいのはなぜですか。","q_en":"Why is it better to fill a freezer to 80-90 percent?","choices":["{在庫|ざいこ}が{多|おお}く{置|お}けるから","{互|たが}いに{冷|ひ}やし{合|あ}って{節電|せつでん}につながるから","{扉|とびら}が{開|あ}きにくくなるから"],"choices_en":["More stock can be kept","The foods cool each other, which saves electricity","The door becomes harder to open"],"answer":1,"explain":"{冷凍庫|れいとうこ}の{場合|ばあい}は8〜9{割|わり}{詰|つ}めた{方|ほう}が{互|たが}いに{冷|ひ}やし{合|あ}って、{節電|せつでん}につながります。{冷蔵庫|れいぞうこ}とは{考|かんが}え{方|かた}が{違|ちが}います。","explain_en":"In a freezer, filling it to 80-90 percent lets the items cool each other and saves electricity. This is different from a refrigerator.","page":30},{"id":"B05","chapter":"第2章 食品衛生","topic":"冷蔵庫・冷凍庫の管理","type":"gakka","q":"{食品|しょくひん}{衛生法|えいせいほう}で{決|き}められている{冷凍庫|れいとうこ}と{冷蔵庫|れいぞうこ}の{温度|おんど}はどれですか。","q_en":"What freezer and refrigerator temperatures are set by the Food Sanitation Act?","choices":["{冷凍庫|れいとうこ}－18℃{以下|いか}、{冷蔵庫|れいぞうこ}5℃{以下|いか}","{冷凍庫|れいとうこ}－15℃{以下|いか}、{冷蔵庫|れいぞうこ}10℃{以下|いか}","{冷凍庫|れいとうこ}－10℃{以下|いか}、{冷蔵庫|れいぞうこ}15℃{以下|いか}"],"choices_en":["Freezer -18 or below, refrigerator 5 or below","Freezer -15 or below, refrigerator 10 or below","Freezer -10 or below, refrigerator 15 or below"],"answer":1,"explain":"{食品|しょくひん}{衛生法|えいせいほう}では、{冷凍庫|れいとうこ}が－15℃{以下|いか}、{冷蔵庫|れいぞうこ}が10℃{以下|いか}と{決|き}められています。{温度|おんど}は{毎日|まいにち}{測定|そくてい}して{記録|きろく}します。","explain_en":"The Food Sanitation Act sets freezers at -15 degrees C or below and refrigerators at 10 degrees C or below. Temperatures must be measured and recorded every day.","page":30},{"id":"B06","chapter":"第2章 食品衛生","topic":"期限表示","type":"gakka","q":"{原材料|げんざいりょう}の「{使用|しよう}{期限|きげん}」を{決|き}めるのは{誰|だれ}ですか。","q_en":"Who decides the 'use-by period' of a raw material?","choices":["その{原材料|げんざいりょう}を{使|つか}う{食品|しょくひん}{製造|せいぞう}{工場|こうじょう}","その{原材料|げんざいりょう}を{運|はこ}んだ{運送|うんそう}{会社|がいしゃ}","{国|くに}や{都道府県|とどうふけん}の{役所|やくしょ}"],"choices_en":["The food factory that uses the material","The transport company that delivered it","The national or local government office"],"answer":0,"explain":"{使用|しよう}{期限|きげん}はそれぞれの{原材料|げんざいりょう}で{決|き}められ、{決|き}めるのはその{原材料|げんざいりょう}を{使|つか}う{食品|しょくひん}{製造|せいぞう}{工場|こうじょう}です。{一方|いっぽう}、{賞味|しょうみ}{期限|きげん}・{消費|しょうひ}{期限|きげん}は、その{加工|かこう}{食品|しょくひん}を{製造|せいぞう}した{企業|きぎょう}が{表示|ひょうじ}します。","explain_en":"The use-by period is set for each material by the food factory that uses it. The best-before date and the expiry date are shown by the company that made that processed food.","page":30},{"id":"B07","chapter":"第2章 食品衛生","topic":"期限表示","type":"gakka","q":"「{賞味|しょうみ}{期限|きげん}」の{説明|せつめい}として{正|ただ}しいのはどれですか。","q_en":"Which is the correct explanation of the 'best-before date'?","choices":["{未|み}{開封|かいふう}の{加工|かこう}{食品|しょくひん}を{決|き}められた{条件|じょうけん}で{保存|ほぞん}した{場合|ばあい}に、{美味|おい}しく{食|た}べられる{期間|きかん}の{最後|さいご}の{日|ひ}","{開封|かいふう}した{後|あと}に{食|た}べられる{期間|きかん}の{最後|さいご}の{日|ひ}","{工場|こうじょう}が{原材料|げんざいりょう}を{使|つか}ってもよい{最後|さいご}の{日|ひ}"],"choices_en":["The last day the unopened food, kept in the set conditions, still tastes good","The last day you can eat it after opening","The last day a factory may use the raw material"],"answer":0,"explain":"{賞味|しょうみ}{期限|きげん}は{未|み}{開封|かいふう}・{決|き}められた{条件|じょうけん}での{保存|ほぞん}が{前提|ぜんてい}です。{過|す}ぎても{食|た}べることはできますが、{食品|しょくひん}{製造|せいぞう}{工場|こうじょう}では{一般的|いっぱんてき}に{使|つか}いません。","explain_en":"The best-before date assumes the food is unopened and kept in the set conditions. Food past this date can still be eaten, but factories generally do not use it.","page":30},{"id":"B30","chapter":"第2章 食品衛生","topic":"原材料の受入れ・保管","type":"jitsugi","q":"{冷蔵庫|れいぞうこ}に{原材料|げんざいりょう}を{保管|ほかん}する{計画|けいかく}を{立|た}てます。{適切|てきせつ}なのはどれですか。","q_en":"You are planning how to store raw materials in the refrigerator. Which is appropriate?","choices":["{隙間|すきま}をつくって{詰|つ}め、{温度|おんど}を{毎日|まいにち}{測定|そくてい}して{結果|けっか}を{記録|きろく}する","{隙間|すきま}なく{詰|つ}めて、{温度|おんど}は{週|しゅう}に1{回|かい}{測定|そくてい}する","ドアを{開|あ}けたままにして{作業|さぎょう}し、{温度|おんど}は{異常|いじょう}があったときだけ{記録|きろく}する"],"choices_en":["Leave gaps when stacking, and measure and record the temperature every day","Pack it with no gaps, and measure the temperature once a week","Work with the door left open, and record the temperature only when something is wrong"],"answer":0,"explain":"{冷蔵庫|れいぞうこ}は{隙間|すきま}なく{詰|つ}め{込|こ}まず、ドアを{開|あ}けたままにしません。{温度|おんど}は{毎日|まいにち}{正|ただ}しい{温度|おんど}に{保|たも}たれているか{定期的|ていきてき}に{測定|そくてい}して、その{結果|けっか}を{記録|きろく}します。","explain_en":"Do not pack a refrigerator with no gaps and do not leave the door open. Measure the temperature regularly every day and record the result.","page":30},{"id":"B08","chapter":"第2章 食品衛生","topic":"期限表示","type":"gakka","q":"「{消費|しょうひ}{期限|きげん}」を{過|す}ぎた{食品|しょくひん}（{原材料|げんざいりょう}）はどうしますか。","q_en":"What should you do with food (raw material) past its expiry date?","choices":["{加熱|かねつ}すれば{使|つか}ってよい","{責任者|せきにんしゃ}が{許可|きょか}すれば{使|つか}ってよい","{絶対|ぜったい}に{使|つか}わない"],"choices_en":["It can be used if heated","It can be used if the supervisor allows it","It must never be used"],"answer":2,"explain":"{消費|しょうひ}{期限|きげん}を{過|す}ぎた{食品|しょくひん}は{食中毒|しょくちゅうどく}の{原因|げんいん}になる{可能性|かのうせい}が{高|たか}くなるので、{絶対|ぜったい}に{使|つか}いません。","explain_en":"Food past its expiry date is much more likely to cause food poisoning, so it must never be used.","page":31},{"id":"B09","chapter":"第2章 食品衛生","topic":"先入れ先出し","type":"gakka","q":"「{先入|さきい}れ、{先出|さきだ}し」とはどのような{方法|ほうほう}ですか。","q_en":"What does 'first in, first out' mean?","choices":["{先|さき}に{納品|のうひん}されたものから{先|さき}に{使|つか}う","{後|あと}から{納品|のうひん}されたものから{先|さき}に{使|つか}う","{量|りょう}の{多|おお}いものから{先|さき}に{使|つか}う"],"choices_en":["Use the items delivered earliest first","Use the newest deliveries first","Use the item with the largest quantity first"],"answer":0,"explain":"{先|さき}に{納品|のうひん}（{受入|うけい}れ）されたものの{方|ほう}が、{賞味|しょうみ}{期限|きげん}や{消費|しょうひ}{期限|きげん}の「{最後|さいご}の{日|ひ}」が{先|さき}に{来|く}るからです。{出荷|しゅっか}・{配送|はいそう}でも{同|おな}じ{考|かんが}え{方|かた}です。","explain_en":"Items received earlier usually reach their last date earlier. The same idea applies to shipping and delivery.","page":31},{"id":"B23","chapter":"第2章 食品衛生","topic":"解凍","type":"jitsugi","q":"{流水|りゅうすい}{解凍|かいとう}をしようとしたら、{原材料|げんざいりょう}を{密閉|みっぺい}している{袋|ふくろ}に{小|ちい}さな{穴|あな}が{開|あ}いていました。どうしますか。","q_en":"Before running-water thawing you find a small hole in the bag sealing the raw material. What do you do?","choices":["そのまま{水|みず}をあてて{早|はや}く{解凍|かいとう}する","{別|べつ}の{袋|ふくろ}に{移|うつ}し{替|か}えて、{密閉|みっぺい}してから{解凍|かいとう}する","{穴|あな}をテープでふさいで{冷蔵庫|れいぞうこ}で{解凍|かいとう}する"],"choices_en":["Thaw it in the water as it is, to be quick","Move it to another bag, seal it, then thaw","Cover the hole with tape and thaw in the refrigerator"],"answer":1,"explain":"{袋|ふくろ}に{穴|あな}や{破|やぶ}れがあると{原材料|げんざいりょう}の{一部|いちぶ}が{流水|りゅうすい}に{流|なが}れ{出|だ}してしまいます。テキストどおり、{別|べつ}の{袋|ふくろ}に{移|うつ}し{替|か}えて{密閉|みっぺい}してから{解凍|かいとう}します。","explain_en":"If the bag has a hole or tear, part of the material washes away. The text says to move it into another bag, seal it, and then thaw.","page":32},{"id":"B10","chapter":"第2章 食品衛生","topic":"加熱殺菌","type":"gakka","q":"{一般的|いっぱんてき}な{食中毒菌|しょくちゅうどくきん}をやっつける{加熱|かねつ}{条件|じょうけん}はどれですか。","q_en":"Which heating condition kills common food poisoning bacteria?","choices":["{中心|ちゅうしん}{温度|おんど}75℃で1{分間|ふんかん}{以上|いじょう}","{中心|ちゅうしん}{温度|おんど}85℃で90{秒間|びょうかん}{以上|いじょう}","{中心|ちゅうしん}{温度|おんど}120℃で4{分間|ふんかん}{以上|いじょう}"],"choices_en":["Core temperature 75 C for 1 minute or more","Core temperature 85 C for 90 seconds or more","Core temperature 120 C for 4 minutes or more"],"answer":0,"explain":"テキストの{例|れい}では、{一般的|いっぱんてき}な{食中毒菌|しょくちゅうどくきん}は{中心|ちゅうしん}{温度|おんど}75℃で1{分間|ふんかん}{以上|いじょう}、ノロウイルスは85℃〜90℃で90{秒間|びょうかん}{以上|いじょう}、{芽胞菌|がほうきん}は120℃で4{分間|ふんかん}{以上|いじょう}です。","explain_en":"The text gives: common food poisoning bacteria 75 C for 1 minute or more; norovirus 85-90 C for 90 seconds or more; spore-forming bacteria 120 C for 4 minutes or more.","page":33},{"id":"B11","chapter":"第2章 食品衛生","topic":"加熱殺菌","type":"gakka","q":"{芽胞|がほう}をつくる{細菌|さいきん}の{組|く}み{合|あ}わせとして{正|ただ}しいのはどれですか。","q_en":"Which group are all spore-forming bacteria?","choices":["セレウス{菌|きん}・ウェルシュ{菌|きん}・ボツリヌス{菌|きん}","サルモネラ{属菌|ぞくきん}・カンピロバクター{属菌|ぞくきん}・{大腸菌|だいちょうきん}","{黄色|おうしょく}ブドウ{球菌|きゅうきん}・ノロウイルス・{大腸菌群|だいちょうきんぐん}"],"choices_en":["Bacillus cereus, Clostridium perfringens, Clostridium botulinum","Salmonella, Campylobacter, E. coli","Staphylococcus aureus, norovirus, coliforms"],"answer":0,"explain":"セレウス{菌|きん}、ウェルシュ{菌|きん}、ボツリヌス{菌|きん}は{芽胞|がほう}をつくる{細菌|さいきん}で、100℃{以上|いじょう}でも{死|し}なない{熱|ねつ}に{強|つよ}い{微生物|びせいぶつ}です。","explain_en":"Bacillus cereus, Clostridium perfringens and Clostridium botulinum form spores and survive even at 100 C or higher.","page":33},{"id":"B29","chapter":"第2章 食品衛生","topic":"製造設備の洗浄","type":"jitsugi","q":"アレルギー{物質|ぶっしつ}を{含|ふく}む{食品|しょくひん}を{製造|せいぞう}したあと、{設備|せつび}についてどうしますか。","q_en":"After making a food containing an allergen, what do you do with the equipment?","choices":["アレルギー{物質|ぶっしつ}が{残|のこ}らないよう、{製造|せいぞう}に{使|つか}った{設備|せつび}の{洗浄|せんじょう}をていねいにおこなう","アレルギー{物質|ぶっしつ}は{加熱|かねつ}で{分解|ぶんかい}するので{洗浄|せんじょう}はいつもどおりでよい","{次|つぎ}の{製造|せいぞう}が{同|おな}じ{商品|しょうひん}なら{洗浄|せんじょう}しなくてよい"],"choices_en":["Wash the equipment carefully so no allergen remains","Normal washing is enough because heat breaks down allergens","No washing is needed if the next product is the same"],"answer":0,"explain":"アレルギー{物質|ぶっしつ}が{設備|せつび}に{残|のこ}らないよう、ていねいに{洗浄|せんじょう}します。{一日|いちにち}の{終|お}わりに{製造|せいぞう}して、その{後|あと}でていねいに{洗浄|せんじょう}することもあります。","explain_en":"Wash carefully so no allergen stays on the equipment. Sometimes such products are made at the end of the day and the equipment is then washed carefully.","page":33},{"id":"B12","chapter":"第2章 食品衛生","topic":"冷却","type":"gakka","q":"{加熱|かねつ}{調理|ちょうり}が{終|お}わった{食品|しょくひん}の{冷却|れいきゃく}の{基準|きじゅん}として{正|ただ}しいのはどれですか。","q_en":"Which is the correct cooling standard for food after heating?","choices":["30{分間|ふんかん}{以内|いない}に{中心|ちゅうしん}{温度|おんど}を20℃、または60{分間|ふんかん}{以内|いない}に10℃まで{下|さ}げる","60{分間|ふんかん}{以内|いない}に{中心|ちゅうしん}{温度|おんど}を20℃、または90{分間|ふんかん}{以内|いない}に10℃まで{下|さ}げる","30{分間|ふんかん}{以内|いない}に{中心|ちゅうしん}{温度|おんど}を10℃、または60{分間|ふんかん}{以内|いない}に5℃まで{下|さ}げる"],"choices_en":["Core temp to 20 C within 30 min, or to 10 C within 60 min","Core temp to 20 C within 60 min, or to 10 C within 90 min","Core temp to 10 C within 30 min, or to 5 C within 60 min"],"answer":0,"explain":"{加熱|かねつ}が{終|お}わってから30{分間|ふんかん}{以内|いない}に{中心|ちゅうしん}{温度|おんど}を20℃まで{下|さ}げるか、60{分間|ふんかん}{以内|いない}に10℃まで{下|さ}げることが{必要|ひつよう}です。ゆっくり{冷|ひ}えると{生|い}き{残|のこ}った{病原性|びょうげんせい}{微生物|びせいぶつ}が{増|ふ}えるからです。","explain_en":"After heating, the core temperature must reach 20 C within 30 minutes, or 10 C within 60 minutes, because surviving pathogens grow while food cools slowly.","page":34},{"id":"B13","chapter":"第2章 食品衛生","topic":"薬剤による殺菌","type":"gakka","q":"{次亜塩素酸|じあえんそさん}ナトリウム{溶液|ようえき}での{殺菌|さっきん}{条件|じょうけん}として{正|ただ}しいのはどれですか。","q_en":"Which is a correct sanitizing condition using sodium hypochlorite solution?","choices":["200ppmで5{分間|ふんかん}、または100ppmで10{分間|ふんかん}","200ppmで10{分間|ふんかん}、または100ppmで5{分間|ふんかん}","100ppmで1{分間|ふんかん}、または50ppmで5{分間|ふんかん}"],"choices_en":["200 ppm for 5 minutes, or 100 ppm for 10 minutes","200 ppm for 10 minutes, or 100 ppm for 5 minutes","100 ppm for 1 minute, or 50 ppm for 5 minutes"],"answer":0,"explain":"{薬剤|やくざい}による{殺菌|さっきん}では{濃度|のうど}と{処理|しょり}{時間|じかん}が{重要|じゅうよう}です。{次亜塩素酸|じあえんそさん}ナトリウム{溶液|ようえき}は{濃度|のうど}200ppmで5{分間|ふんかん}、100ppmの{場合|ばあい}は10{分間|ふんかん}{処理|しょり}します。","explain_en":"For chemical sanitizing, concentration and time both matter: 200 ppm for 5 minutes, or 100 ppm for 10 minutes.","page":34},{"id":"B14","chapter":"第2章 食品衛生","topic":"検査","type":"gakka","q":"{金属|きんぞく}{探知機|たんちき}の{管理|かんり}で{重要|じゅうよう}なことは{何|なん}ですか。","q_en":"What is important in managing a metal detector?","choices":["{毎日|まいにち}{同|おな}じ{時間|じかん}に{電源|でんげん}を{入|い}れること","テストピースで{正|ただ}しく{探知|たんち}できることを{確認|かくにん}してから{検査|けんさ}を{始|はじ}めること","{製品|せいひん}を1{個|こ}ずつ{手|て}で{持|も}って{通|とお}すこと"],"choices_en":["Turning it on at the same time every day","Checking with a test piece that it detects correctly before starting inspection","Passing products through one by one by hand"],"answer":1,"explain":"テストピースを{使|つか}って{金属|きんぞく}を{正|ただ}しく{探知|たんち}できていることを{確認|かくにん}してから{検査|けんさ}を{始|はじ}め、{製造|せいぞう}が{終|お}わったときにも{最後|さいご}まで{正常|せいじょう}に{機能|きのう}していたことを{確認|かくにん}します。","explain_en":"Check with a test piece that the detector works before starting, and check again at the end of production that it worked the whole time.","page":35},{"id":"B15","chapter":"第2章 食品衛生","topic":"検査","type":"gakka","q":"X{線|せん}{異物|いぶつ}{検出機|けんしゅつき}について{正|ただ}しいのはどれですか。","q_en":"Which is correct about the X-ray foreign object detector?","choices":["プラスチックはX{線|せん}では{見|み}つけにくい","プラスチックはX{線|せん}で{一番|いちばん}よく{見|み}つかる","{石|いし}やガラスはX{線|せん}では{見|み}つけられない"],"choices_en":["Plastic is hard to find with X-rays","Plastic is the easiest thing to find with X-rays","Stones and glass cannot be found with X-rays"],"answer":0,"explain":"X{線|せん}{異物|いぶつ}{検出機|けんしゅつき}は{石|いし}やガラスなど{金属|きんぞく}{探知機|たんちき}で{見|み}つけられない{硬質|こうしつ}{異物|いぶつ}を{検出|けんしゅつ}できますが、プラスチックは{見|み}つけにくいので、{機械|きかい}や{設備|せつび}からプラスチックが{混入|こんにゅう}しないようにすることが{大切|たいせつ}です。","explain_en":"The X-ray detector finds hard objects such as stones and glass that a metal detector cannot, but plastic is hard to see, so plastic must be kept out of the food in the first place.","page":36},{"id":"B16","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"HACCPの7{原則|げんそく}のうち、{最初|さいしょ}におこなう{原則|げんそく}1はどれですか。","q_en":"Which is Principle 1, the first of the 7 HACCP principles?","choices":["{危害|きがい}{要因|よういん}{分析|ぶんせき}（ハザード{分析|ぶんせき}）","{重要|じゅうよう}{管理点|かんりてん}の{決定|けってい}","{管理|かんり}{基準|きじゅん}の{設定|せってい}"],"choices_en":["Hazard analysis","Deciding critical control points","Setting critical limits"],"answer":0,"explain":"{原則|げんそく}1は{危害|きがい}{要因|よういん}{分析|ぶんせき}（ハザード{分析|ぶんせき}）で、{危害|きがい}{要因|よういん}を{分析|ぶんせき}し、どのような{管理|かんり}が{必要|ひつよう}かを{判断|はんだん}します。","explain_en":"Principle 1 is hazard analysis: analyse hazards and decide what control is needed.","page":38},{"id":"B17","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"HACCPの7{原則|げんそく}で、{原則|げんそく}5にあたるのはどれですか。","q_en":"Which is Principle 5 of the 7 HACCP principles?","choices":["{監視|かんし}（モニタリング）の{方法|ほうほう}の{設定|せってい}","{改善|かいぜん}{措置|そち}の{設定|せってい}","{検証|けんしょう}{方法|ほうほう}の{設定|せってい}"],"choices_en":["Setting the monitoring method","Setting corrective actions","Setting the verification method"],"answer":1,"explain":"{原則|げんそく}4が{監視|かんし}（モニタリング）の{方法|ほうほう}の{設定|せってい}、{原則|げんそく}5が{改善|かいぜん}{措置|そち}の{設定|せってい}、{原則|げんそく}6が{検証|けんしょう}{方法|ほうほう}の{設定|せってい}、{原則|げんそく}7が{記録|きろく}です。","explain_en":"Principle 4 is monitoring, Principle 5 is corrective actions, Principle 6 is verification, and Principle 7 is records.","page":38},{"id":"B18","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"{食品|しょくひん}を{製造|せいぞう}する{場合|ばあい}に{重要|じゅうよう}{管理点|かんりてん}となる{代表的|だいひょうてき}な{工程|こうてい}に{含|ふく}まれないのはどれですか。","q_en":"Which is NOT one of the typical processes that become critical control points?","choices":["{加熱|かねつ}{殺菌|さっきん}したあとの{冷却|れいきゃく}","{金属|きんぞく}{探知機|たんちき}","{原材料|げんざいりょう}の{開封|かいふう}"],"choices_en":["Cooling after heat sterilization","Metal detector","Opening raw material packages"],"answer":2,"explain":"{代表的|だいひょうてき}な5つは、{加熱|かねつ}{殺菌|さっきん}、{加熱|かねつ}{殺菌|さっきん}したあとの{冷却|れいきゃく}、{薬剤|やくざい}による{殺菌|さっきん}、{金属|きんぞく}{探知機|たんちき}、X{線|せん}{異物|いぶつ}{検出機|けんしゅつき}です。","explain_en":"The five typical CCPs are heat sterilization, cooling after heat sterilization, chemical sanitizing, metal detector and X-ray foreign object detector.","page":39},{"id":"B19","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"「{管理|かんり}{基準|きじゅん}からの{逸脱|いつだつ}」とはどのようなことですか。","q_en":"What does 'deviation from the critical limit' mean?","choices":["{決|き}めた{管理|かんり}{基準|きじゅん}が{実際|じっさい}には{守|まも}られていないこと","{管理|かんり}{基準|きじゅん}を{新|あたら}しく{決|き}め{直|なお}すこと","{管理|かんり}{基準|きじゅん}より{厳|きび}しく{管理|かんり}すること"],"choices_en":["The set critical limit was not actually kept","Setting a new critical limit","Managing more strictly than the limit"],"answer":0,"explain":"{例|れい}えば「75℃で1{分間|ふんかん}{以上|いじょう}」と{決|き}めたのに{実際|じっさい}は「70℃で1{分間|ふんかん}」しか{加熱|かねつ}していなかった{場合|ばあい}などが{逸脱|いつだつ}です。","explain_en":"For example, if the rule is 75 C for 1 minute or more but the food was only heated to 70 C for 1 minute, that is a deviation.","page":39},{"id":"B24","chapter":"第2章 食品衛生","topic":"HACCP","type":"jitsugi","q":"「{中心|ちゅうしん}{温度|おんど}75℃で1{分間|ふんかん}{以上|いじょう}」と{決|き}めていたのに、{実際|じっさい}は「70℃で1{分間|ふんかん}」しか{加熱|かねつ}していなかったことが{分|わ}かりました。まず{何|なに}をしますか。","q_en":"The rule was core 75 C for 1 minute or more, but the food was only heated to 70 C for 1 minute. What do you do first?","choices":["すぐに{責任者|せきにんしゃ}へ{報告|ほうこく}する","{自分|じぶん}の{判断|はんだん}でもう{一度|いちど}{加熱|かねつ}してから{記録|きろく}する","{次|つぎ}の{製造|せいぞう}のときに{気|き}をつければよいので{何|なに}もしない"],"choices_en":["Report to the supervisor immediately","Reheat it on your own judgement and then record it","Do nothing, just be careful next time"],"answer":0,"explain":"{重要|じゅうよう}{管理点|かんりてん}が{管理|かんり}{基準|きじゅん}から{逸脱|いつだつ}したことを{知|し}ったときは、すぐに{責任者|せきにんしゃ}へ{報告|ほうこく}しなければいけません。{改善|かいぜん}{措置|そち}は{必|かなら}ず{責任者|せきにんしゃ}の{指示|しじ}に{従|したが}います。","explain_en":"When you learn a CCP has deviated from its critical limit, report to the supervisor at once. Corrective action must follow the supervisor's instructions.","page":39},{"id":"B20","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"「{改善|かいぜん}{措置|そち}」に{必要|ひつよう}な2つの{措置|そち}は{何|なん}ですか。","q_en":"What are the two actions needed as 'corrective action'?","choices":["また{同|おな}じ{逸脱|いつだつ}をしないようにすることと、それまでに{作|つく}った{食品|しょくひん}をどうするか{決|き}めること","{責任者|せきにんしゃ}を{交代|こうたい}させることと、{作業|さぎょう}を{中止|ちゅうし}すること","{記録|きろく}を{書|か}き{直|なお}すことと、{管理|かんり}{基準|きじゅん}を{下|さ}げること"],"choices_en":["Stop the same deviation happening again, and decide what to do with the food already made","Change the supervisor, and stop the work","Rewrite the records, and lower the critical limit"],"answer":0,"explain":"{改善|かいぜん}{措置|そち}は、{同|おな}じような{逸脱|いつだつ}をしないようにすることと、それまでに{作|つく}った{食品|しょくひん}を{捨|す}てるのか{作|つく}り{直|なお}すのかを{決|き}めることの2つです。","explain_en":"Corrective action means (1) preventing the same deviation again and (2) deciding whether to discard or remake the food already produced.","page":40},{"id":"B21","chapter":"第2章 食品衛生","topic":"HACCP","type":"gakka","q":"HACCPの{記録|きろく}についてあらかじめ{決|き}めておかなければならない{手順|てじゅん}はどれですか。","q_en":"What must be decided in advance about HACCP records?","choices":["「いつ」「{誰|だれ}が」「どのように{記録|きろく}するのか」","「どこに{保管|ほかん}するか」だけ","「{何年間|なんねんかん}{保存|ほぞん}するか」だけ"],"choices_en":["When, who, and how to record","Only where to store them","Only how many years to keep them"],"answer":0,"explain":"{一般|いっぱん}{衛生|えいせい}{管理|かんり}でも{重要|じゅうよう}{管理点|かんりてん}でも、「いつ」「{誰|だれ}が」「どのように{記録|きろく}するのか」の{手順|てじゅん}をあらかじめ{決|き}めなければいけません。","explain_en":"For both general hygiene control and CCPs, the procedure of when, who and how to record must be decided in advance.","page":40},{"id":"B25","chapter":"第2章 食品衛生","topic":"HACCP","type":"jitsugi","q":"{製造|せいぞう}{終了時|しゅうりょうじ}のテストピース{確認|かくにん}で、{金属|きんぞく}{探知機|たんちき}が{正常|せいじょう}に{機能|きのう}していなかったことが{分|わ}かりました。{改善|かいぜん}{措置|そち}として{適切|てきせつ}なのはどれですか。","q_en":"At the end of production, the test piece shows the metal detector was not working properly. What is the right corrective action?","choices":["{機械|きかい}を{調整|ちょうせい}し、{調整|ちょうせい}した{金属|きんぞく}{探知機|たんちき}でもう{一度|いちど}{検査|けんさ}する","{機械|きかい}を{調整|ちょうせい}して、{次|つぎ}の{日|ひ}から{正|ただ}しく{使|つか}えばよい","X{線|せん}{異物|いぶつ}{検出機|けんしゅつき}を{通|とお}していれば{検査|けんさ}は{不要|ふよう}"],"choices_en":["Adjust the machine and re-inspect the products with the adjusted detector","Adjust the machine and just use it correctly from the next day","No re-inspection is needed if the products passed the X-ray detector"],"answer":0,"explain":"{金属|きんぞく}{探知機|たんちき}が{正常|せいじょう}に{機能|きのう}していなかった{場合|ばあい}は、{機械|きかい}を{調整|ちょうせい}することと、{調整|ちょうせい}した{金属|きんぞく}{探知機|たんちき}でもう{一度|いちど}{検査|けんさ}することが{改善|かいぜん}{措置|そち}です。{正常|せいじょう}{確認|かくにん}の{時点|じてん}から{異常|いじょう}が{分|わ}かった{時点|じてん}までの{製品|せいひん}には{金属|きんぞく}が{入|はい}っているかもしれません。","explain_en":"If the detector was not working, adjust it and re-inspect with the adjusted detector. Products made between the last good check and the failure may contain metal.","page":40},{"id":"B26","chapter":"第2章 食品衛生","topic":"HACCP","type":"jitsugi","q":"コンベアの{加熱|かねつ}ゾーンを{通|とお}る{速度|そくど}が{速|はや}すぎて{中心|ちゅうしん}{温度|おんど}が{十分|じゅうぶん}に{高|たか}くなっていませんでした。{改善|かいぜん}{措置|そち}の{組|く}み{合|あ}わせとして{適切|てきせつ}なのはどれですか。","q_en":"The conveyor moved too fast through the heating zone, so the core temperature was too low. Which pair of corrective actions is right?","choices":["コンベアの{速度|そくど}を{遅|おそ}く{調整|ちょうせい}し、{加熱|かねつ}{不足|ぶそく}のものを{廃棄|はいき}する","コンベアの{速度|そくど}を{速|はや}くし、{加熱|かねつ}{温度|おんど}の{記録|きろく}を{直|なお}す","{管理|かんり}{基準|きじゅん}の{温度|おんど}を{下|さ}げ、{製品|せいひん}はそのまま{出荷|しゅっか}する"],"choices_en":["Slow the conveyor down and discard the under-heated products","Speed the conveyor up and correct the temperature records","Lower the critical limit and ship the products as they are"],"answer":0,"explain":"テキストの{例|れい}のとおり、コンベアの{速度|そくど}を{遅|おそ}くする{調整|ちょうせい}（{同|おな}じ{逸脱|いつだつ}をしないための{措置|そち}）と、{加熱|かねつ}{不足|ぶそく}のものの{廃棄|はいき}（{作|つく}った{食品|しょくひん}の{処置|しょち}）の2つが{改善|かいぜん}{措置|そち}です。","explain_en":"As in the text, the two corrective actions are slowing the conveyor (to prevent the same deviation) and discarding the under-heated products (dealing with food already made).","page":40},{"id":"B27","chapter":"第2章 食品衛生","topic":"記録","type":"jitsugi","q":"{冷蔵庫|れいぞうこ}の{温度|おんど}をはかりましたが、{作業|さぎょう}が{忙|いそが}しくて{記録用紙|きろくようし}が{手元|てもと}にありません。どうするのが{正|ただ}しいですか。","q_en":"You measured the refrigerator temperature but you are busy and the record sheet is not at hand. What is correct?","choices":["はかったときにすぐ{記録|きろく}する","{仕事|しごと}が{終|お}わってから{一日分|いちにちぶん}をまとめて{記録|きろく}する","いつもと{同|おな}じ{数字|すうじ}なので{先|さき}に{記録|きろく}しておく"],"choices_en":["Record it immediately when you measure it","Record the whole day at the end of
