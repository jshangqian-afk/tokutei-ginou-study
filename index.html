in":"{対策|たいさく}は「{鉄板|てっぱん}、{鍋|なべ}、{釜|かま}などを{持|も}って{運|はこ}ぶときは{保護|ほご}{手袋|てぶくろ}を{着用|ちゃくよう}する」「{運|はこ}ぶ{前|まえ}に{温度|おんど}を{確認|かくにん}して、{高温|こうおん}の{場合|ばあい}はまわりの{人|ひと}にも{気|き}をつけるように{声|こえ}をかける」ことです。","explain_en":"The countermeasures are: wear protective gloves when carrying trays, pots or kettles, and check the temperature before carrying. If it is hot, call out to warn the people nearby.","page":60},{"id":"D21","chapter":"第3章 労働安全","topic":"腰痛災害","type":"gakka","q":"{重|おも}い{物|もの}を{持|も}ち{上|あ}げるときの{正|ただ}しい{姿勢|しせい}として、テキストが{示|しめ}しているのはどれですか。","q_en":"According to the text, what is the correct posture for lifting a heavy object?","choices":["{体|からだ}から{離|はな}して{腕|うで}を{伸|の}ばし、{反動|はんどう}をつけて{持|も}ち{上|あ}げる","{膝|ひざ}を{伸|の}ばしたまま{腰|こし}だけを{曲|ま}げて、{勢|いきお}いよく{持|も}ち{上|あ}げる","{体|からだ}を{重|おも}い{物|もの}に{近|ちか}づけ、{膝|ひざ}を{曲|ま}げて{腰|こし}を{下|お}ろして{抱|かか}え、{膝|ひざ}を{伸|の}ばしながらゆっくり{立|た}ち{上|あ}がる"],"choices_en":["Hold it away from your body with straight arms and lift using momentum","Keep your knees straight, bend only at the waist, and lift with force","Bring your body close to the object, bend your knees and lower your hips, hold it, then stand up slowly while straightening your knees"],"answer":2,"explain":"{対策|たいさく}は「{重|おも}い{物|もの}を{持|も}ち{上|あ}げるときは、{体|からだ}を{重|おも}い{物|もの}に{近|ちか}づけて、{膝|ひざ}を{曲|ま}げて、{腰|こし}を{下|お}ろして{重|おも}い{物|もの}を{抱|かか}えて、{膝|ひざ}を{伸|の}ばしながらゆっくり{立|た}ち{上|あ}がる」ことです。","explain_en":"The countermeasure is: bring your body close to the object, bend your knees, lower your hips, hold the object, and stand up slowly while straightening your knees.","page":61},{"id":"D22","chapter":"第3章 労働安全","topic":"腰痛災害","type":"jitsugi","q":"{重|おも}い{釜|かま}を{床|ゆか}から{持|も}ち{上|あ}げる{必要|ひつよう}があります。{腰|こし}を{痛|いた}めないためにどうしますか。","q_en":"You must lift a heavy kettle from the floor. What should you do to avoid hurting your back?","choices":["{釜|かま}に{体|からだ}を{近|ちか}づけ、{膝|ひざ}を{曲|ま}げて{腰|こし}を{下|お}ろしてから、ゆっくり{立|た}ち{上|あ}がる","{不安定|ふあんてい}でも、{立|た}ったまま{腰|こし}を{曲|ま}げて{一気|いっき}に{持|も}ち{上|あ}げる","{釜|かま}を{床|ゆか}の{上|うえ}で{引|ひ}きずって{移動|いどう}させる"],"choices_en":["Bring your body close to the kettle, bend your knees and lower your hips, then stand up slowly","Even if unstable, stay standing, bend at the waist and lift it in one go","Drag the kettle along the floor to move it"],"answer":0,"explain":"{事例|じれい}の{原因|げんいん}は「{不安定|ふあんてい}な{姿勢|しせい}のまま、{重|おも}い{物|もの}を{持|も}ち{上|あ}げようとした」ことです。{体|からだ}を{近|ちか}づけ{膝|ひざ}を{曲|ま}げて{腰|こし}を{下|お}ろす{姿勢|しせい}が{正|ただ}しい{方法|ほうほう}です。","explain_en":"The cause was trying to lift a heavy object from an unstable posture. The correct way is to come close, bend the knees and lower the hips.","page":61},{"id":"D23","chapter":"第3章 労働安全","topic":"腰痛災害","type":"jitsugi","q":"{重|おも}い{物|もの}を{遠|とお}くまで{運|はこ}ぶ{作業|さぎょう}の{計画|けいかく}を{立|た}てます。テキストの{対策|たいさく}に{合|あ}うのはどれですか。","q_en":"You are planning work that involves carrying heavy items a long distance. Which plan matches the text?","choices":["{一度|いちど}にたくさん{持|も}って{往復|おうふく}の{回数|かいすう}を{減|へ}らす","できるだけ{台車|だいしゃ}を{使用|しよう}する","{腰|こし}を{曲|ま}げた{姿勢|しせい}で{持|も}つと{楽|らく}なのでその{姿勢|しせい}で{運|はこ}ぶ"],"choices_en":["Carry a lot at once to reduce the number of trips","Use a hand cart as much as possible","Carry with the back bent because it feels easier"],"answer":1,"explain":"テキストには「{重|おも}い{物|もの}を{運|はこ}ぶときは、できるだけ{台車|だいしゃ}を{使用|しよう}する」と{示|しめ}されています。","explain_en":"The text says to use a hand cart as much as possible when carrying heavy items.","page":61},{"id":"D24","chapter":"第3章 労働安全","topic":"熱中症災害","type":"gakka","q":"{生|なま}あん{工程|こうてい}で{熱中症|ねっちゅうしょう}と{診断|しんだん}された{事例|じれい}の{原因|げんいん}として、テキストに{書|か}かれているものはどれですか。","q_en":"In the case where a worker was diagnosed with heat illness in the bean paste process, which cause is given in the text?","choices":["{厚|あつ}い{防寒|ぼうかん}{着|ぎ}を{着|き}たまま{冷凍庫|れいとうこ}に{入|はい}った","{冷|つめ}たい{水|みず}を{飲|の}み{過|す}ぎて{体|からだ}が{冷|ひ}えた","{気温|きおん}と{湿度|しつど}が{高|たか}い{場所|ばしょ}で{休憩|きゅうけい}を{取|と}らないで{作業|さぎょう}を{続|つづ}け、{水分|すいぶん}や{塩分|えんぶん}をとらなかった"],"choices_en":["He entered a freezer wearing thick winter clothing","He drank too much cold water and his body got cold","He kept working without breaks in a hot, humid place and did not take water or salt"],"answer":2,"explain":"{原因|げんいん}は「{気温|きおん}と{湿度|しつど}が{高|たか}い{場所|ばしょ}で、{休憩|きゅうけい}を{取|と}らないで{作業|さぎょう}を{続|つづ}けた」「{汗|あせ}をたくさんかいていたが、{水分|すいぶん}や{塩分|えんぶん}をとらなかった」ことです。","explain_en":"The causes were continuing work without breaks in a place with high temperature and humidity, and sweating a lot without taking water or salt.","page":61},{"id":"D25","chapter":"第3章 労働安全","topic":"熱中症災害","type":"jitsugi","q":"{気温|きおん}と{湿度|しつど}が{高|たか}い{場所|ばしょ}で、ホッパーに{豆|まめ}を{入|い}れる{作業|さぎょう}を{何度|なんど}もくりかえします。{熱中症|ねっちゅうしょう}を{防|ふせ}ぐために{最|もっと}も{適切|てきせつ}な{計画|けいかく}はどれですか。","q_en":"You will repeat the job of putting beans into a hopper in a hot and humid place. What is the best plan to prevent heat illness?","choices":["{休憩|きゅうけい}を{取|と}らずに{早|はや}く{終|お}わらせて、{終|お}わってからまとめて{水|みず}を{飲|の}む","トイレに{行|い}く{回数|かいすう}が{増|ふ}えないように{水分|すいぶん}は{我慢|がまん}する","よく{休憩|きゅうけい}を{取|と}って{水分|すいぶん}や{塩分|えんぶん}をとり、{汗|あせ}や{水分|すいぶん}を{吸|す}って{乾|かわ}きやすい{衣服|いふく}を{着用|ちゃくよう}する"],"choices_en":["Skip breaks to finish fast, then drink a lot of water afterwards","Avoid drinking so you do not need the toilet so often","Take good breaks, drink water and take salt, and wear clothing that absorbs sweat and dries easily"],"answer":2,"explain":"{対策|たいさく}は「{気温|きおん}と{湿度|しつど}が{高|たか}い{場所|ばしょ}で{作業|さぎょう}するときは、よく{休憩|きゅうけい}を{取|と}って、{水分|すいぶん}や{塩分|えんぶん}をとる」「{空気|くうき}を{通|とお}して、{汗|あせ}や{水分|すいぶん}を{吸|す}って、{乾|かわ}きやすい{衣服|いふく}を{着用|ちゃくよう}する」ことです。","explain_en":"The countermeasures are: take frequent breaks and take water and salt when working in hot, humid places, and wear breathable clothing that absorbs sweat and dries quickly.","page":61},{"id":"D26","chapter":"第3章 労働安全","topic":"熱中症災害","type":"jitsugi","q":"{作業場|さぎょうじょう}で{同僚|どうりょう}に{熱中症|ねっちゅうしょう}のような{症状|しょうじょう}が{出|で}ました。テキストが{示|しめ}す{対応|たいおう}の{最初|さいしょ}にすることはどれですか。","q_en":"A colleague shows symptoms like heat illness in the workplace. According to the text, what is the first thing to do?","choices":["すぐに{仕事|しごと}に{戻|もど}らせる","{責任者|せきにんしゃ}に{知|し}らせる","{熱|あつ}いお{茶|ちゃ}を{飲|の}ませる"],"choices_en":["Send the person straight back to work","Tell the supervisor","Give the person hot tea to drink"],"answer":1,"explain":"テキストの{対応|たいおう}は、①{責任者|せきにんしゃ}に{知|し}らせる、②{涼|すず}しいところに{移動|いどう}する、③{安静|あんせい}にする、④{作業服|さぎょうふく}をゆるめ{体|からだ}を{冷|ひ}やす、⑤{塩分|えんぶん}を{含|ふく}む{水|みず}やスポーツドリンクを{飲|の}む、の{順|じゅん}です。","explain_en":"The steps in the text are: 1) tell the supervisor, 2) move to a cool place, 3) rest quietly, 4) loosen the work clothes and cool the body, 5) drink water containing salt or a sports drink.","page":62},{"id":"D27","chapter":"第3章 労働安全","topic":"熱中症災害","type":"gakka","q":"{熱中症|ねっちゅうしょう}のような{症状|しょうじょう}が{出|で}た{人|ひと}の{体|からだ}を{冷|ひ}やすとき、テキストが「{特|とく}に」と{示|しめ}している{場所|ばしょ}はどこですか。","q_en":"When cooling the body of a person with heat illness symptoms, which places does the text say to cool especially?","choices":["{首|くび}、{脇|わき}の{下|した}、{足|あし}のつけ{根|ね}","{手|て}のひらと{足|あし}の{裏|うら}","{背中|せなか}とお{腹|なか}"],"choices_en":["The neck, the armpits and the groin","The palms and the soles of the feet","The back and the stomach"],"answer":0,"explain":"テキストには「{作業服|さぎょうふく}をゆるめ、{体|からだ}（{特|とく}に{首|くび}、{脇|わき}の{下|した}、{足|あし}のつけ{根|ね}）を{冷|ひ}やします」と{書|か}かれています。","explain_en":"The text says to loosen the work clothes and cool the body, especially the neck, armpits and groin.","page":62},{"id":"D28","chapter":"第3章 労働安全","topic":"熱中症災害","type":"gakka","q":"{暑|あつ}い{職場|しょくば}で{熱中症|ねっちゅうしょう}を{防|ふせ}ぐために{着用|ちゃくよう}するとよい{衣服|いふく}はどれですか。","q_en":"Which clothing is recommended to prevent heat illness in a hot workplace?","choices":["{体|からだ}に{強|つよ}く{密着|みっちゃく}して{汗|あせ}を{外|そと}に{出|だ}さない{衣服|いふく}","{水|みず}を{通|とお}さない{厚|あつ}いビニールの{衣服|いふく}","{空気|くうき}を{通|とお}して、{汗|あせ}や{水分|すいぶん}を{吸|す}って、{乾|かわ}きやすい{衣服|いふく}"],"choices_en":["Very tight clothing that keeps sweat inside","Thick waterproof vinyl clothing","Clothing that lets air through, absorbs sweat and moisture, and dries easily"],"answer":2,"explain":"テキストの{対策|たいさく}には「{空気|くうき}を{通|とお}して、{汗|あせ}や{水分|すいぶん}を{吸|す}って、{乾|かわ}きやすい{衣服|いふく}を{着用|ちゃくよう}する」と{書|か}かれています。","explain_en":"The text's countermeasure is to wear clothing that is breathable, absorbs sweat and moisture, and dries easily.","page":62},{"id":"D29","chapter":"第3章 労働安全","topic":"激突災害","type":"jitsugi","q":"フォークリフトで{空箱|からばこ}を{運|はこ}び、{倉庫|そうこ}の{入|い}り{口|ぐち}を{通|とお}ります。{運転者|うんてんしゃ}がとるべき{行動|こうどう}はどれですか。","q_en":"You are driving a forklift with empty boxes and are about to pass through a warehouse entrance. What should the driver do?","choices":["{倉庫|そうこ}の{入|い}り{口|ぐち}の{前|まえ}で{一時|いちじ}{停止|ていし}し、{指差|しさ}{呼称|こしょう}をして{安全|あんぜん}{確認|かくにん}を{必|かなら}ずおこなう","{荷|に}が{軽|かる}いので、{止|と}まらずにゆっくり{通過|つうか}する","クラクションを{鳴|な}らし{続|つづ}けながらそのまま{通過|つうか}する"],"choices_en":["Stop in front of the warehouse entrance and always check safety using point-and-call","The load is light, so pass through slowly without stopping","Keep sounding the horn and drive straight through"],"answer":0,"explain":"{事例|じれい}の{原因|げんいん}は「フォークリフトが、{倉庫|そうこ}の{入|い}り{口|ぐち}の{前|まえ}で{一時|いちじ}{停止|ていし}をしなかった」ことです。{対策|たいさく}は{一時|いちじ}{停止|ていし}し、{指差|しさ}{呼称|こしょう}をして{安全|あんぜん}{確認|かくにん}を{必|かなら}ずおこなうことです。","explain_en":"The cause was that the forklift did not stop in front of the warehouse entrance. The countermeasure is to stop and always confirm safety with point-and-call.","page":62},{"id":"D30","chapter":"第3章 労働安全","topic":"激突災害","type":"jitsugi","q":"{倉庫|そうこ}の{入|い}り{口|ぐち}の{横|よこ}を{歩|ある}いているとき、フォークリフトが{近|ちか}づいてきました。{歩行者|ほこうしゃ}として{最|もっと}も{安全|あんぜん}な{行動|こうどう}はどれですか。","q_en":"You are walking beside a warehouse entrance when a forklift approaches. What is the safest action for a pedestrian?","choices":["{運転者|うんてんしゃ}が{気|き}づいているはずなので、そのまま{歩|ある}き{続|つづ}ける","{立|た}ち{止|ど}まってフォークリフトと{運転者|うんてんしゃ}を{見|み}て、{安全|あんぜん}を{確認|かくにん}してから{通|とお}る","フォークリフトの{前|まえ}を{走|はし}って{早|はや}く{通|とお}り{抜|ぬ}ける"],"choices_en":["The driver must have seen you, so keep walking","Stop, look at the forklift and driver, confirm it is safe, then go","Run across in front of the forklift to get past quickly"],"answer":1,"explain":"{事例|じれい}では、{一時|いちじ}{停止|ていし}しないで{通過|つうか}したフォークリフトと{横|よこ}から{来|き}た{人|ひと}がぶつかりそうになりました。{運転者|うんてんしゃ}も{歩行者|ほこうしゃ}も{立|た}ち{止|ど}まって{安全|あんぜん}{確認|かくにん}をすることが{激突|げきとつ}{災害|さいがい}の{防止|ぼうし}になります。{作業場|さぎょうじょう}では「{走|はし}ることを{禁止|きんし}する{標識|ひょうしき}」も{使|つか}われています。","explain_en":"In the case study a forklift passed through without stopping and nearly hit a person coming from the side. Both drivers and pedestrians should stop and check safety. Workplaces also use signs prohibiting running.","page":62},{"id":"D20","chapter":"第3章 労働安全","topic":"やけど災害・安全標識","type":"jitsugi","q":"{高温|こうおん}の{鉄板|てっぱん}を{置|お}く{作業台|さぎょうだい}のそばに{掲示|けいじ}する{標識|ひょうしき}として、{最|もっと}も{適|てき}しているのはどれですか。","q_en":"Which sign is most suitable to display near a work table where hot trays are placed?","choices":["「{高温|こうおん}{注意|ちゅうい}」「やけど{注意|ちゅうい}」の{標識|ひょうしき}","「{頭上|ずじょう}{注意|ちゅうい}」の{標識|ひょうしき}","「{非常口|ひじょうぐち}」の{標識|ひょうしき}"],"choices_en":["A HOT SURFACE / burn warning sign","A WATCH YOUR HEAD sign","An EMERGENCY EXIT sign"],"answer":0,"explain":"{補足|ほそく}{資料|しりょう}の{安全標識|あんぜんひょうしき}の{例|れい}には、やけどをする{危険|きけん}を{知|し}らせる{標識|ひょうしき}として「やけど{注意|ちゅうい}」「{火傷|やけど}{注意|ちゅうい}」「{高温|こうおん}{注意|ちゅうい}（HOT SURFACE）」が{挙|あ}げられています。","explain_en":"The reference section lists burn-hazard signs such as \"Caution: burns\" and \"HOT SURFACE\" as the signs that warn of burn risk.","page":63}],"terms":[{"term":"{衛生|えいせい}","reading":"えいせい","en":"Hygiene","def":"いのち（{生命|せいめい}）をまもる（{衛|まも}る）こと。","def_en":"To protect life.","page":3,"ch":"第1章 必要な技能"},{"term":"{食品|しょくひん}{衛生|えいせい}","reading":"しょくひんえいせい","en":"Food hygiene","def":"{食品|しょくひん}を{食|た}べて、{人|ひと}が{病気|びょうき}にならないこと、ケガをしないこと。","def_en":"People do not get sick or injured from eating food.","page":3,"ch":"第1章 必要な技能"},{"term":"HACCP","reading":"はさっぷ","en":"HACCP (Hazard Analysis and Critical Control Point)","def":"{一般|いっぱん}{衛生|えいせい}{管理|かんり}と{重要|じゅうよう}{管理|かんり}{点|てん}の{管理|かんり}を{組|く}み{合|あ}わせた{衛生|えいせい}{管理|かんり}。","def_en":"Hygiene management combining general hygiene management and critical control point management.","page":6,"ch":"第2章 食品衛生"},{"term":"{危害|きがい}{要因|よういん}（ハザード）","reading":"きがいよういん","en":"Hazard","def":"{人|ひと}が{病気|びょうき}になったりケガをしたりする{原因|げんいん}のこと。","def_en":"A cause that makes people sick or injured.","page":6,"ch":"第2章 食品衛生"},{"term":"{物理的|ぶつりてき}{危害|きがい}{要因|よういん}","reading":"ぶつりてききがいよういん","en":"Physical hazard","def":"{硬|かた}くて{歯|は}が{欠|か}ける、{尖|とが}っていて{口|くち}の{中|なか}に{傷|きず}ができるなど、{物理的|ぶつりてき}な{原因|げんいん}でケガをさせるおそれがあるもの。","def_en":"Something hard or sharp that can chip teeth or cut the mouth.","page":7,"ch":"第2章 食品衛生"},{"term":"{異物|いぶつ}","reading":"いぶつ","en":"Foreign object","def":"{取|と}り{除|のぞ}けずに{食品|しょくひん}に{入|はい}ったもの、または{製造中|せいぞうちゅう}に{入|はい}ってはいけないものが{入|はい}ってしまったもの。","def_en":"Something that should not be in the food but got in.","page":7,"ch":"第2章 食品衛生"},{"term":"{硬質|こうしつ}{異物|いぶつ}","reading":"こうしついぶつ","en":"Hard foreign object","def":"{異物|いぶつ}のうち、{金属|きんぞく}{片|へん}やガラス{片|へん}、{石|いし}のように{硬|かた}いもの。","def_en":"Hard foreign objects such as metal, glass, and stones.","page":7,"ch":"第2章 食品衛生"},{"term":"{化学的|かがくてき}{危害|きがい}{要因|よういん}","reading":"かがくてききがいよういん","en":"Chemical hazard","def":"アレルギー{物質|ぶっしつ}、ヒスタミン、ソラニン、{殺菌剤|さっきんざい}などの{化学|かがく}{物質|ぶっしつ}。","def_en":"Chemicals such as allergens, histamine, solanine, and disinfectants.","page":8,"ch":"第2章 食品衛生"},{"term":"{特定|とくてい}{原材料|げんざいりょう}","reading":"とくていげんざいりょう","en":"Specified raw materials (mandatory allergen labeling)","def":"{表示|ひょうじ}の{義務|ぎむ}がある9{品目|ひんもく}。えび・かに・くるみ・{小麦|こむぎ}・そば・{卵|たまご}・{乳|にゅう}・{落花生|らっかせい}・カシューナッツ。","def_en":"The 9 allergens that must be labeled: shrimp, crab, walnut, wheat, buckwheat, egg, milk, peanut, cashew nut.","page":9,"ch":"第2章 食品衛生"},{"term":"{特定|とくてい}{原材料|げんざいりょう}に{準|じゅん}ずるもの","reading":"とくていげんざいりょうにじゅんずるもの","en":"Items equivalent to specified raw materials (recommended labeling)","def":"{表示|ひょうじ}が{推奨|すいしょう}されている20{品目|ひんもく}。","def_en":"The 20 allergens for which labeling is recommended.","page":9,"ch":"第2章 食品衛生"},{"term":"ヒスタミン","reading":"ひすたみん","en":"Histamine","def":"{保存|ほぞん}{状態|じょうたい}の{悪|わる}い{赤身魚|あかみざかな}などにできる{物質|ぶっしつ}。アレルギー{反応|はんのう}に{似|に}た{症状|しょうじょう}を{起|お}こす。","def_en":"A substance formed in poorly stored red-meat fish; causes allergy-like symptoms.","page":10,"ch":"第2章 食品衛生"},{"term":"ソラニン","reading":"そらにん","en":"Solanine","def":"じゃがいもの{芽|め}や{緑色|みどりいろ}の{皮|かわ}にふくまれる{物質|ぶっしつ}。","def_en":"A substance in potato sprouts and green skin.","page":10,"ch":"第2章 食品衛生"},{"term":"{生物的|せいぶつてき}{危害|きがい}{要因|よういん}","reading":"せいぶつてききがいよういん","en":"Biological hazard","def":"{食中毒|しょくちゅうどく}の{原因|げんいん}になる{細菌|さいきん}やウイルス、{寄生虫|きせいちゅう}、カビなど。","def_en":"Bacteria, viruses, parasites, and mold that cause food poisoning.","page":10,"ch":"第2章 食品衛生"},{"term":"{病原性|びょうげんせい}{微生物|びせいぶつ}","reading":"びょうげんせいびせいぶつ","en":"Pathogenic microorganism","def":"{生物的|せいぶつてき}{危害|きがい}{要因|よういん}のうち、{病気|びょうき}の{原因|げんいん}となる{細菌|さいきん}やウイルスなど。","def_en":"Bacteria and viruses that cause disease.","page":10,"ch":"第2章 食品衛生"},{"term":"{芽胞|がほう}","reading":"がほう","en":"Spore","def":"{殻|から}を{被|かぶ}った{細菌|さいきん}の{種|たね}のようなもの。{熱|ねつ}や{乾燥|かんそう}に{強|つよ}い。","def_en":"A seed-like shell form of bacteria, resistant to heat and drying.","page":11,"ch":"第2章 食品衛生"},{"term":"{黄色|おうしょく}ブドウ{球菌|きゅうきん}","reading":"おうしょくぶどうきゅうきん","en":"Staphylococcus aureus","def":"{人|ひと}の{皮膚|ひふ}や{傷口|きずぐち}にいる{食中毒菌|しょくちゅうどくきん}。{熱|ねつ}に{強|つよ}い{毒素|どくそ}を{作|つく}る。おにぎり・サンドイッチなど。","def_en":"Found on skin and wounds; makes a heat-resistant toxin. Linked to rice balls and sandwiches.","page":11,"ch":"第2章 食品衛生"},{"term":"ウェルシュ{菌|きん}","reading":"うぇるしゅきん","en":"Clostridium perfringens","def":"{熱|ねつ}に{強|つよ}い{芽胞|がほう}を{作|つく}る。{土|つち}のついた{原材料|げんざいりょう}、カレー・シチューなど。","def_en":"Makes heat-resistant spores. Linked to soil-covered ingredients, curry, and stew.","page":11,"ch":"第2章 食品衛生"},{"term":"ボツリヌス{菌|きん}","reading":"ぼつりぬすきん","en":"Clostridium botulinum","def":"{熱|ねつ}に{強|つよ}い{芽胞|がほう}を{作|つく}る。{瓶詰|びんづ}め{食品|しょくひん}、レトルト{食品|しょくひん}など。{呼吸|こきゅう}{困難|こんなん}を{起|お}こす。","def_en":"Makes heat-resistant spores. Linked to bottled and retort foods. Causes breathing difficulty.","page":11,"ch":"第2章 食品衛生"},{"term":"{食中毒|しょくちゅうどく}{予防|よぼう}の3{原則|げんそく}","reading":"しょくちゅうどくよぼうのさんげんそく","en":"3 principles of food poisoning prevention","def":"つけない・{増|ふ}やさない・やっつける（{殺|ころ}す）。","def_en":"Do not attach, do not increase, kill.","page":12,"ch":"第2章 食品衛生"},{"term":"ノロウイルス","reading":"のろういるす","en":"Norovirus","def":"{牡蠣|かき}などの{二枚貝|にまいがい}が{汚染|おせん}されていることがある。{食品|しょくひん}の{中|なか}では{増|ふ}えず、{人|ひと}の{腸|ちょう}で{増|ふ}える。","def_en":"Can contaminate bivalves such as oysters. Does not grow in food but grows in human intestines.","page":13,"ch":"第2章 食品衛生"},{"term":"{次亜塩素酸|じあえんそさん}ナトリウム","reading":"じあえんそさんなとりうむ","en":"Sodium hypochlorite","def":"ノロウイルス{対策|たいさく}で{使|つか}う{消毒剤|しょうどくざい}。{濃度|のうど}200ppmの{溶液|ようえき}を{使|つか}う。","def_en":"A disinfectant used against norovirus, at 200 ppm.","page":13,"ch":"第2章 食品衛生"},{"term":"アニサキス","reading":"あにさきす","en":"Anisakis","def":"サバ・イワシ・サケ・アジ・イカなどに{寄生|きせい}する{寄生虫|きせいちゅう}。70℃{以上|いじょう}の{加熱|かねつ}、60℃なら1{分間|ふんかん}、-20℃で24{時間|じかん}{以上|いじょう}の{冷凍|れいとう}で{殺|ころ}せる。","def_en":"A parasite in mackerel, sardine, salmon, horse mackerel, and squid. Killed by heating above 70°C, 60°C for 1 minute, or freezing at -20°C for 24+ hours.","page":14,"ch":"第2章 食品衛生"},{"term":"５Ｓ","reading":"ごえす","en":"5S","def":"「Ｓ」で{始|はじ}まる５つの{活動|かつどう}（{整理|せいり}・{整頓|せいとん}・{清掃|せいそう}・{清潔|せいけつ}・{習慣付|しゅうかんづ}け／しつけ）のこと。{一般衛生管理|いっぱんえいせいかんり}の{基本|きほん}となる{考|かんが}え{方|かた}。","def_en":"Five activities starting with 'S' (sorting, order, cleaning, cleanliness, habit/discipline). The basic idea of general hygiene management.","page":15,"ch":"第2章 食品衛生"},{"term":"{整理|せいり}","reading":"せいり","en":"Seiri / Sorting","def":"{使|つか}わないものをなくして、{使|つか}うものだけにすること。","def_en":"Removing unnecessary items and keeping only what is used.","page":15,"ch":"第2章 食品衛生"},{"term":"{整頓|せいとん}","reading":"せいとん","en":"Seiton / Setting in order","def":"{器具|きぐ}や{道具|どうぐ}を、{必要|ひつよう}なときにすぐ{取|と}り{出|だ}せるようにすること。{場所|ばしょ}を{決|き}め、{名前|なまえ}や{数量|すうりょう}を{表示|ひょうじ}する。","def_en":"Making tools easy to take out when needed: fixed places, labels for names and quantities.","page":15,"ch":"第2章 食品衛生"},{"term":"{清掃|せいそう}","reading":"せいそう","en":"Seisou / Cleaning","def":"{設備|せつび}や{器具|きぐ}、{道具|どうぐ}を{洗|あら}ったり{磨|みが}いたり{拭|ふ}いたりして、{汚|よご}れを{取|と}り{除|のぞ}くこと。","def_en":"Washing, polishing and wiping equipment and tools to remove dirt.","page":15,"ch":"第2章 食品衛生"},{"term":"{清潔|せいけつ}","reading":"せいけつ","en":"Seiketsu / Cleanliness","def":"{整理|せいり}・{整頓|せいとん}・{清掃|せいそう}をして{見|み}た{目|め}がきれいで、{設備|せつび}や{器具|きぐ}が{病原性微生物|びょうげんせいびせいぶつ}に{汚染|おせん}されていないこと。","def_en":"After sorting, ordering and cleaning, things look clean and equipment is not contaminated with pathogenic microorganisms.","page":15,"ch":"第2章 食品衛生"},{"term":"{習慣付|しゅうかんづ}け（しつけ）","reading":"しゅうかんづけ（しつけ）","en":"Shukanzuke / Shitsuke (habit, discipline)","def":"{決|き}められたことを{決|き}められたとおりにできること。５Ｓのルールをそのとおりに{実行|じっこう}できるようになること。","def_en":"Being able to do decided things exactly as decided, and to follow the 5S rules every time.","page":15,"ch":"第2章 食品衛生"},{"term":"{一般衛生管理|いっぱんえいせいかんり}","reading":"いっぱんえいせいかんり","en":"General hygiene management","def":"「{施設|しせつ}、{設備|せつび}、{器具|きぐ}などの{衛生管理|えいせいかんり}」「{作業者|さぎょうしゃ}の{衛生管理|えいせいかんり}」「{原材料|げんざいりょう}・{食品|しょくひん}の{衛生管理|えいせいかんり}」の３つに{分|わ}けられる{衛生管理|えいせいかんり}。","def_en":"Hygiene management divided into three parts: facilities/equipment/utensils, workers, and raw materials/food.","page":15,"ch":"第2章 食品衛生"},{"term":"{労働安全|ろうどうあんぜん}","reading":"ろうどうあんぜん","en":"Occupational safety","def":"{作業場|さぎょうば}で{病気|びょうき}になったりケガをしないこと。５Ｓは{労働安全|ろうどうあんぜん}にも{役立|やくだ}つ。","def_en":"Not getting sick or injured at the workplace. 5S also helps occupational safety.","page":16,"ch":"第2章 食品衛生"},{"term":"{交差汚染|こうさおせん}","reading":"こうさおせん","en":"Cross contamination","def":"{清潔|せいけつ}な{人|ひと}や{物|もの}が、{清潔|せいけつ}ではない{人|ひと}や{物|もの}に{触|ふ}れて、{危害要因|きがいよういん}に{汚染|おせん}されること。","def_en":"Clean people or things becoming contaminated with hazards by touching unclean people or things.","page":16,"ch":"第2章 食品衛生"},{"term":"{区分衛生管理|くぶんえいせいかんり}（ゾーニング）","reading":"くぶんえいせいかんり","en":"Zoning (area-based hygiene management)","def":"{作業場|さぎょうば}を{区域|くいき}に{分|わ}けて{衛生管理|えいせいかんり}をすること。{交差汚染|こうさおせん}を{防止|ぼうし}するためにおこなう。","def_en":"Dividing the workplace into areas and managing hygiene in each, to prevent cross contamination.","page":16,"ch":"第2章 食品衛生"},{"term":"{清潔作業区域|せいけつさぎょうくいき}","reading":"せいけつさぎょうくいき","en":"Clean working area","def":"{加熱|かねつ}や{薬剤|やくざい}による{殺菌|さっきん}が{終|お}わった{食品|しょくひん}を{取|と}り{扱|あつか}う{区域|くいき}。トッピング、{盛|も}り{付|つ}け、{包装|ほうそう}など。","def_en":"Area for food after heat or chemical sterilization: topping, plating, packaging.","page":16,"ch":"第2章 食品衛生"},{"term":"{準清潔作業区域|じゅんせいけつさぎょうくいき}","reading":"じゅんせいけつさぎょうくいき","en":"Semi-clean working area","def":"{殺菌|さっきん}する{前|まえ}の{原材料|げんざいりょう}を{取|と}り{扱|あつか}う{区域|くいき}。{下処理|したしょり}、{加熱調理|かねつちょうり}など。","def_en":"Area for raw materials before sterilization: preparation and heat cooking.","page":16,"ch":"第2章 食品衛生"},{"term":"{汚染作業区域|おせんさぎょうくいき}","reading":"おせんさぎょうくいき","en":"Contaminated (dirty) working area","def":"{原材料|げんざいりょう}の{受入|うけい}れなど、{作業場|さぎょうば}の{外|そと}から{持|も}ち{込|こ}まれた{原材料|げんざいりょう}を{扱|あつか}う{区域|くいき}。{段|だん}ボール{箱|ばこ}に{詰|つ}めた{製品|せいひん}を{扱|あつか}う{区域|くいき}も{含|ふく}む。","def_en":"Area for raw materials brought in from outside (receiving), and for products packed in cardboard boxes.","page":16,"ch":"第2章 食品衛生"},{"term":"{洗浄|せんじょう}","reading":"せんじょう","en":"Washing","def":"{機械|きかい}や{器具|きぐ}の{汚|よご}れを{洗|あら}って{落|お}とすこと。{原材料|げんざいりょう}をかえたときや{作業|さぎょう}が{終|お}わったときは{必|かなら}ずおこなう。","def_en":"Washing off dirt from machines and utensils. Always done when raw materials change and when work ends.","page":17,"ch":"第2章 食品衛生"},{"term":"{消毒|しょうどく}","reading":"しょうどく","en":"Disinfection","def":"{微生物|びせいぶつ}を{減|へ}らすためにおこなう{処理|しょり}。{刃|は}など{食品|しょくひん}に{直接触|ちょくせつふ}れる{部分|ぶぶん}は、{洗浄|せんじょう}の{後|あと}に{消毒|しょうどく}する。","def_en":"Treatment to reduce microorganisms. Parts touching food directly, such as blades, are disinfected after washing.","page":17,"ch":"第2章 食品衛生"},{"term":"{薬剤|やくざい}の{管理|かんり}","reading":"やくざいのかんり","en":"Chemical management","def":"{殺菌剤|さっきんざい}・{洗浄剤|せんじょうざい}などを{決|き}められた{場所|ばしょ}に{保管|ほかん}し、{原材料|げんざいりょう}と{同|おな}じ{保管庫|ほかんこ}に{入|い}れず、{名称|めいしょう}を{表示|ひょうじ}すること。","def_en":"Storing sanitizers and detergents in the decided place, never with raw materials, and labelling their names.","page":18,"ch":"第2章 食品衛生"},{"term":"{健康|けんこう}チェック","reading":"けんこうチェック","en":"Health check","def":"{作業|さぎょう}を{始|はじ}める{前|まえ}に、{下痢|げり}、{発熱|はつねつ}、{吐|は}き{気|け}などの{症状|しょうじょう}や{手指|てゆび}の{傷|きず}がないことを{確認|かくにん}すること。","def_en":"Checking before work that there is no diarrhea, fever, nausea, or cuts on hands and fingers.","page":18,"ch":"第2章 食品衛生"},{"term":"{検便|けんべん}","reading":"けんべん","en":"Stool (feces) test","def":"{作業者|さぎょうしゃ}が{職場|しょくば}の{決|き}まりにしたがって{定期的|ていきてき}に{受|う}ける{検査|けんさ}。{健康診断|けんこうしんだん}とあわせて{受|う}ける。","def_en":"A test workers take regularly as decided by the workplace, together with health checkups.","page":19,"ch":"第2章 食品衛生"},{"term":"ヘアーネット","reading":"へあーねっと","en":"Hair net","def":"{頭髪|とうはつ}が{外|そと}に{出|で}ないようにかぶるもの。{帽子|ぼうし}の{内側|うちがわ}に{着用|ちゃくよう}する。","def_en":"Worn so that hair does not come out; put on inside the cap.","page":20,"ch":"第2章 食品衛生"},{"term":"{粘着|ねんちゃく}ローラー","reading":"ねんちゃくろーらー","en":"Sticky roller (lint roller)","def":"{作業場|さぎょうば}に{入|はい}る{前|まえ}に、{作業服|さぎょうふく}についている{髪|かみ}の{毛|け}やほこりを{取|と}るための{道具|どうぐ}。","def_en":"A tool used before entering the workplace to remove hair and dust from work clothes.","page":21,"ch":"第2章 食品衛生"},{"term":"エアーシャワー","reading":"えあーしゃわー","en":"Air shower","def":"{作業場|さぎょうば}に{入|はい}る{前|まえ}に、{風|かぜ}で{作業服|さぎょうふく}の{髪|かみ}の{毛|け}やほこりを{取|と}る{設備|せつび}。","def_en":"Equipment that blows air to remove hair and dust from work clothes before entering the workplace.","page":21,"ch":"第2章 食品衛生"},{"term":"{手洗|てあら}い","reading":"てあらい","en":"Handwashing","def":"{流水|りゅうすい}で{汚|よご}れを{落|お}とし、せっけんで{手首|てくび}まで３０{秒間程度|びょうかんていど}{洗|あら}い、{流水|りゅうすい}で２０{秒間程度|びょうかんていど}{流|なが}し、{手|て}を{乾|かわ}かして{消毒用|しょうどくよう}アルコールをすりこむこと。","def_en":"Rinse off dirt, wash with soap up to the wrists for about 30 seconds, rinse for about 20 seconds, dry hands, then rub in alcohol sanitizer.","page":25,"ch":"第2章 食品衛生"},{"term":"{手袋|てぶくろ}の{交換|こうかん}","reading":"てぶくろのこうかん","en":"Changing gloves","def":"{原材料|げんざいりょう}をかえるとき、トイレや{休憩|きゅうけい}の{後|あと}、{手袋|てぶくろ}が{破|やぶ}れたときなどに{手袋|てぶくろ}を{新|あたら}しくすること。","def_en":"Putting on new gloves when changing raw materials, after the toilet or a break, or when gloves are torn.","page":26,"ch":"第2章 食品衛生"},{"term":"{作業手順書|さぎょうてじゅんしょ}","reading":"さぎょうてじゅんしょ","en":"Work procedure manual","def":"どこでどんな{作業|さぎょう}をするのかが{書|か}かれた{書類|しょるい}。{作業|さぎょう}の{前|まえ}に{見|み}て{確認|かくにん}する。","def_en":"A document showing where and what work to do. Check it before starting work.","page":26,"ch":"第2章 食品衛生"},{"term":"{異物混入|いぶつこんにゅう}","reading":"いぶつこんにゅう","en":"Foreign object contamination","def":"{食品|しょくひん}に{入|はい}ってはいけないものが{混|ま}じること。ホチキスの{針|はり}やクリップ、{鉛筆|えんぴつ}の{折|お}れた{芯|しん}などが{原因|げんいん}になる。","def_en":"Something that must not be in food getting mixed in, e.g. staples, clips or broken pencil lead.","page":27,"ch":"第2章 食品衛生"},{"term":"{使用|しよう}{期限|きげん}","reading":"しようきげん","en":"Use-by period (set by the factory)","def":"{原材料|げんざいりょう}を{使|つか}っても{良|よ}い{期間|きかん}の{最後|さいご}の{日|ひ}。それぞれの{原材料|げんざいりょう}について、その{原材料|げんざいりょう}を{使|つか}う{食品|しょくひん}{製造|せいぞう}{工場|こうじょう}が{決|き}める。","def_en":"The last day a raw material may be used. It is set for each material by the food factory that uses it.","page":30,"ch":"第2章 食品衛生"},{"term":"{賞味|しょうみ}{期限|きげん}","reading":"しょうみきげん","en":"Best-before date","def":"{未|み}{開封|かいふう}の{加工|かこう}{食品|しょくひん}を{決|き}められた{条件|じょうけん}で{保存|ほぞん}した{場合|ばあい}に、{美味|おい}しく{食|た}べられる{期間|きかん}の{最後|さいご}の{日|ひ}。{過|す}ぎても{食|た}べられるが、{工場|こうじょう}では{一般的|いっぱんてき}に{使|つか}わない。","def_en":"The last day an unopened processed food kept in the set conditions still tastes good. It can still be eaten after that, but factories generally do not use it.","page":30,"ch":"第2章 食品衛生"},{"term":"{消費|しょうひ}{期限|きげん}","reading":"しょうひきげん","en":"Expiry (use-by) date","def":"{未|み}{開封|かいふう}の{加工|かこう}{食品|しょくひん}を{決|き}められた{条件|じょうけん}で{保存|ほぞん}した{場合|ばあい}に、{食|た}べたり{使|つか}ったりできる{期間|きかん}の{最後|さいご}の{日|ひ}。{過|す}ぎた{食品|しょくひん}は{絶対|ぜったい}に{使|つか}わない。","def_en":"The last day an unopened processed food kept in the set conditions can be eaten or used. Never use food past this date.","page":31,"ch":"第2章 食品衛生"},{"term":"{先入|さきい}れ、{先出|さきだ}し","reading":"さきいれさきだし","en":"First in, first out","def":"{先|さき}に{納品|のうひん}（{受入|うけい}れ）されたものから{先|さき}に{使|つか}うこと。{製品|せいひん}{倉庫|そうこ}からの{出荷|しゅっか}でも{同|おな}じ{考|かんが}え{方|かた}を{使|つか}う。","def_en":"Using the items received earliest first. The same idea is used when shipping from the product warehouse.","page":31,"ch":"第2章 食品衛生"},{"term":"{流水|りゅうすい}{解凍|かいとう}","reading":"りゅうすいかいとう","en":"Running-water thawing","def":"{水道|すいどう}などから{流|なが}れる{水|みず}をあてて{解凍|かいとう}する{方法|ほうほう}。{解凍|かいとう}{前|まえ}に{袋|ふくろ}に{穴|あな}や{破|やぶ}れがないことを{確認|かくにん}する。","def_en":"Thawing by running water over the item. Before thawing, check that the bag has no holes or tears.","page":31,"ch":"第2章 食品衛生"},{"term":"ドリップ","reading":"どりっぷ","en":"Drip","def":"{解凍|かいとう}するときに{肉|にく}や{魚|さかな}から{出|で}てくる{汁|しる}。{他|ほか}の{食品|しょくひん}や{原材料|げんざいりょう}につかないよう、トレーなどに{入|い}れて{解凍|かいとう}する。","def_en":"The liquid that comes out of meat or fish while thawing. Thaw in a tray so it does not touch other foods or materials.","page":32,"ch":"第2章 食品衛生"},{"term":"{加熱|かねつ}{殺菌|さっきん}","reading":"かねつさっきん","en":"Heat sterilization","def":"{適切|てきせつ}に{加熱|かねつ}することで、{原材料|げんざいりょう}に{含|ふく}まれる{生物的|せいぶつてき}{危害|きがい}{要因|よういん}（{病原性|びょうげんせい}{微生物|びせいぶつ}など）を{取|と}り{除|のぞ}くこと。{中心|ちゅうしん}{温度|おんど}で{管理|かんり}する。","def_en":"Removing biological hazards such as pathogens by heating properly. It is controlled by core temperature.","page":33,"ch":"第2章 食品衛生"},{"term":"{中心|ちゅうしん}{温度|おんど}","reading":"ちゅうしんおんど","en":"Core temperature","def":"{食品|しょくひん}の{一番|いちばん}{内側|うちがわ}の{温度|おんど}。{加熱|かねつ}{殺菌|さっきん}はこの{温度|おんど}で{管理|かんり}し、{肉|にく}のかたまりなど{大|おお}きな{原材料|げんざいりょう}では{必|かなら}ず{確|たし}かめる。","def_en":"The temperature at the centre of the food. Heat sterilization is controlled by this, and it must always be checked for large items such as blocks of meat.","page":33,"ch":"第2章 食品衛生"},{"term":"{芽胞菌|がほうきん}","reading":"がほうきん","en":"Spore-forming bacteria","def":"{芽胞|がほう}をつくる{細菌|さいきん}。セレウス{菌|きん}、ウェルシュ{菌|きん}、ボツリヌス{菌|きん}など。100℃{以上|いじょう}でも{死|し}なない{熱|ねつ}に{強|つよ}い{微生物|びせいぶつ}。","def_en":"Bacteria that form spores, such as Bacillus cereus, Clostridium perfringens and Clostridium botulinum. They survive even above 100 C.","page":33,"ch":"第2章 食品衛生"},{"term":"{薬剤|やくざい}による{殺菌|さっきん}","reading":"やくざいによるさっきん","en":"Chemical sanitizing","def":"{加熱|かねつ}しない{食品|しょくひん}で、{薬剤|やくざい}を{使|つか}って{病原性|びょうげんせい}{微生物|びせいぶつ}をやっつけること。{次亜塩素酸|じあえんそさん}ナトリウム{溶液|ようえき}200ppmで5{分間|ふんかん}、または100ppmで10{分間|ふんかん}{処理|しょり}する。","def_en":"Killing pathogens with a chemical when food is not heated. Sodium hypochlorite solution at 200 ppm for 5 minutes, or 100 ppm for 10 minutes.","page":34,"ch":"第2章 食品衛生"},{"term":"{風冷|ふうれい}・{水冷|すいれい}","reading":"ふうれい・すいれい","en":"Air cooling / water cooling","def":"{加熱|かねつ}{殺菌|さっきん}した{後|あと}の{冷却|れいきゃく}{方法|ほうほう}。{風|かぜ}をあてて{冷|ひ}やすのが{風冷|ふうれい}、{冷水|れいすい}で{冷|ひ}やすのが{水冷|すいれい}。","def_en":"Cooling methods after heat sterilization: air cooling uses a fan, water cooling uses cold water.","page":34,"ch":"第2章 食品衛生"},{"term":"{金属|きんぞく}{探知機|たんちき}","reading":"きんぞくたんちき","en":"Metal detector","def":"{硬質|こうしつ}{異物|いぶつ}のうち{金属|きんぞく}を{見|み}つける{機械|きかい}。テストピースで{正|ただ}しく{探知|たんち}できることを{確認|かくにん}してから{検査|けんさ}を{始|はじ}める。","def_en":"A machine that finds metal among hard foreign objects. Check with a test piece that it detects correctly before starting inspection.","page":35,"ch":"第2章 食品衛生"},{"term":"X{線|せん}{異物|いぶつ}{検出機|けんしゅつき}","reading":"えっくすせんいぶつけんしゅつき","en":"X-ray foreign object detector","def":"{石|いし}やガラスなど、{金属|きんぞく}{探知機|たんちき}では{見|み}つけられない{硬質|こうしつ}{異物|いぶつ}を{検出|けんしゅつ}する{機械|きかい}。プラスチックは{見|み}つけにくい。","def_en":"A machine that detects hard foreign objects such as stones and glass that a metal detector cannot find. Plastic is hard to see.","page":36,"ch":"第2章 食品衛生"},{"term":"{微生物|びせいぶつ}{検査|けんさ}","reading":"びせいぶつけんさ","en":"Microbiological testing","def":"{食品|しょくひん}{製造|せいぞう}{業者|ぎょうしゃ}が{自主的|じしゅてき}におこなう{場合|ばあい}、{一般的|いっぱんてき}に{一般|いっぱん}{生菌数|せいきんすう}、{大腸菌|だいちょうきん}、{大腸菌群|だいちょうきんぐん}を{検査|けんさ}する。{黄色|おうしょく}ブドウ{球菌|きゅうきん}、サルモネラ{属菌|ぞくきん}、カンピロバクター{属菌|ぞくきん}を{検査|けんさ}することもある。","def_en":"When a maker tests voluntarily, usual items are total viable count, E. coli and coliforms. Staphylococcus aureus, Salmonella and Campylobacter may also be tested.","page":36,"ch":"第2章 食品衛生"},{"term":"{製品|せいひん}サンプルの{保管|ほかん}","reading":"せいひんさんぷるのほかん","en":"Keeping product samples","def":"{出荷|しゅっか}した{製品|せいひん}にクレームが{来|き}たとき、{同|おな}じ{時期|じき}に{製造|せいぞう}した{製品|せいひん}に{同|おな}じ{問題|もんだい}がないか{調|しら}べるため、{一定|いってい}の{割合|わりあい}でサンプルを{抜|ぬ}き{出|だ}して{保管|ほかん}すること。","def_en":"Taking and keeping a set proportion of products as samples, so that if a complaint arrives you can check products made at the same time.","page":36,"ch":"第2章 食品衛生"},{"term":"{危害|きがい}{要因|よういん}{分析|ぶんせき}（ハザード{分析|ぶんせき}）","reading":"きがいよういんぶんせき","en":"Hazard analysis","def":"{食品|しょくひん}の{原材料|げんざいりょう}や{製造|せいぞう}{工程|こうてい}を{調|しら}べて、どのような{危害|きがい}{要因|よういん}があり、どう{管理|かんり}すれば{含|ふく}まないように{製造|せいぞう}できるかを{分析|ぶんせき}すること。HACCPの{原則|げんそく}1。","def_en":"Studying the raw materials and processes to find what hazards exist and what control is needed to keep them out of the food. HACCP Principle 1.","page":37,"ch":"第2章 食品衛生"},{"term":"{重要|じゅうよう}{管理点|かんりてん}（CCP）","reading":"じゅうようかんりてん","en":"Critical Control Point (CCP)","def":"{危害|きがい}{要因|よういん}を{取|と}り{除|のぞ}くために{最|もっと}も{重要|じゅうよう}な{工程|こうてい}。{一|ひと}つではなく{二|ふた}つ{以上|いじょう}になる{食品|しょくひん}もある。HACCPの{原則|げんそく}2で{決定|けってい}する。","def_en":"The most important process for removing a hazard. Some foods have two or more. Decided in HACCP Principle 2.","page":37,"ch":"第2章 食品衛生"},{"term":"{管理|かんり}{基準|きじゅん}","reading":"かんりきじゅん","en":"Critical limit","def":"{重要|じゅうよう}{管理点|かんりてん}の{工程|こうてい}を{管理|かんり}する{基準|きじゅん}。HACCPの{原則|げんそく}3で{設定|せってい}し、{重要|じゅうよう}{管理点|かんりてん}では{必|かなら}ず{守|まも}らなければならない。","def_en":"The standard used to control a CCP process. Set in HACCP Principle 3, and it must always be kept at a CCP.","page":37,"ch":"第2章 食品衛生"},{"term":"{監視|かんし}（モニタリング）","reading":"かんし","en":"Monitoring","def":"{一般|いっぱん}{衛生|えいせい}{管理|かんり}と{重要|じゅうよう}{管理点|かんりてん}の{管理|かんり}が{正|ただ}しく{実行|じっこう}されているかを{見|み}て{確|たし}かめること。HACCPの{原則|げんそく}4でその{方法|ほうほう}を{決|き}める。","def_en":"Watching and checking that general hygiene control and CCP control are carried out correctly. The method is set in HACCP Principle 4.","page":38,"ch":"第2章 食品衛生"},{"term":"{検証|けんしょう}{方法|ほうほう}","reading":"けんしょうほうほう","en":"Verification method","def":"{原則|げんそく}5までに{決|き}めたやり{方|かた}が{危害|きがい}{要因|よういん}の{除去|じょきょ}や{低減|ていげん}に{有効|ゆうこう}であること、{計画|けいかく}どおり{実行|じっこう}されていることを{確認|かくにん}する{方法|ほうほう}。HACCPの{原則|げんそく}6。","def_en":"The way to confirm that the methods set up to Principle 5 really remove or reduce hazards and are carried out as planned. HACCP Principle 6.","page":38,"ch":"第2章 食品衛生"},{"term":"{記録|きろく}","reading":"きろく","en":"Records","def":"{原則|げんそく}1から{原則|げんそく}6までに{決|き}めた{内容|ないよう}と、{実際|じっさい}に{確認|かくにん}した{結果|けっか}を{文書|ぶんしょ}に{残|のこ}すこと。HACCPの{原則|げんそく}7。はかったとき・{確認|かくにん}したときにすぐ{記録|きろく}する。","def_en":"Writing down what was decided in Principles 1 to 6 and the results actually checked. HACCP Principle 7. Record immediately when you measure or check.","page":38,"ch":"第2章 食品衛生"},{"term":"{管理|かんり}{基準|きじゅん}からの{逸脱|いつだつ}","reading":"かんりきじゅんからのいつだつ","en":"Deviation from the critical limit","def":"{決|き}めた{管理|かんり}{基準|きじゅん}が{実際|じっさい}には{守|まも}られていないこと。{知|し}ったときはすぐに{責任者|せきにんしゃ}へ{報告|ほうこく}する。","def_en":"When the set critical limit was not actually kept. Report to the supervisor immediately when you find it.","page":39,"ch":"第2章 食品衛生"},{"term":"{改善|かいぜん}{措置|そち}","reading":"かいぜんそち","en":"Corrective action","def":"{管理|かんり}{基準|きじゅん}から{逸脱|いつだつ}したときに、また{同|おな}じ{逸脱|いつだつ}をしないようにすることと、それまでに{作|つく}った{食品|しょくひん}を{捨|す}てるのか{作|つく}り{直|なお}すのかを{決|き}めることの2つの{措置|そち}。HACCPの{原則|げんそく}5。","def_en":"Two actions after a deviation: preventing the same deviation again, and deciding whether to discard or remake the food already produced. HACCP Principle 5.","page":40,"ch":"第2章 食品衛生"},{"term":"{未熟練|みじゅくれん}{作業者|さぎょうしゃ}","reading":"みじゅくれんさぎょうしゃ","en":"Inexperienced worker","def":"{経験|けいけん}が3{年|ねん}{未満|みまん}の{作業者|さぎょうしゃ}。{食料品|しょくりょうひん}{製造業|せいぞうぎょう}で{起|お}こる{労働|ろうどう}{災害|さいがい}に{占|し}める{割合|わりあい}は{約半分|やくはんぶん}。","def_en":"A worker with less than 3 years of experience. About half of workplace accidents in food manufacturing involve such workers.","page":43,"ch":"第3章 労働安全"},{"term":"{転倒|てんとう}{災害|さいがい}","reading":"てんとうさいがい","en":"slip / trip and fall accident","def":"{走|はし}ってすべったり、{物|もの}につまずいたり、{荷物|にもつ}を{持|も}っていてまっすぐ{歩|ある}けなかったりして{起|お}こる{災害|さいがい}。{頭|あたま}や{背中|せなか}を{打|う}ったり、{手|て}をついて{手|て}の{骨|ほね}を{折|お}ったりする。{食品製造工場|しょくひんせいぞうこうじょう}で{最|もっと}も{多|おお}い。","def_en":"An accident caused by slipping while running, tripping over something, or not walking straight while carrying a load. You may hit your head or back, or break a bone in your hand. It is the most common accident in food factories.","page":44,"ch":"第3章 労働安全"},{"term":"はさまれ・{巻|ま}き{込|こ}まれ{災害|さいがい}","reading":"はさまれ・まきこまれさいがい","en":"caught-in / pulled-into accident","def":"{機械|きかい}に{手|て}を{入|い}れるときやコンベアのギアを{掃除|そうじ}しているときなどに{起|お}こる{災害|さいがい}。{指|ゆび}や{腕|うで}の{骨|ほね}がつぶれたり、{体|からだ}がはさまって{死|し}んだりすることがある。","def_en":"An accident that happens when you put your hand into a machine or clean a conveyor gear. It can crush fingers or arms, or trap and kill a person.","page":44,"ch":"第3章 労働安全"},{"term":"{熱中症|ねっちゅうしょう}","reading":"ねっちゅうしょう","en":"heat stroke","def":"{気温|きおん}や{湿度|しつど}が{高|たか}い{場所|ばしょ}で{長|なが}い{時間|じかん}{作業|さぎょう}したときに{起|お}こる。{体温|たいおん}が{上|あ}がって{体内|たいない}の{水分|すいぶん}や{塩分|えんぶん}のバランスが{崩|くず}れ、{体温調節|たいおんちょうせつ}ができなくなり、{死|し}ぬこともある。","def_en":"Happens after working a long time in a hot, humid place. Body temperature rises, the balance of water and salt breaks down, the body cannot control its temperature, and it can be fatal.","page":45,"ch":"第3章 労働安全"},{"term":"{激突|げきとつ}{災害|さいがい}","reading":"げきとつさいがい","en":"collision accident","def":"{作業者|さぎょうしゃ}が{移動中|いどうちゅう}にフォークリフトとぶつかったりして{起|お}こる{災害|さいがい}。{速|はや}く{動|うご}いているフォークリフトにぶつかると{死|し}ぬこともある。","def_en":"An accident where a moving worker is hit by a forklift or similar. Being hit by a fast-moving forklift can be fatal.","page":45,"ch":"第3章 労働安全"},{"term":"5S","reading":"ごえす","en":"5S (sort, set in order, clean, cleanliness, discipline)","def":"{整理|せいり}・{整頓|せいとん}・{清掃|せいそう}・{清潔|せいけつ}・{習慣付|しゅうかんづ}け（しつけ）の5つ。{作業場|さぎょうじょう}をいつも{同|おな}じ{状態|じょうたい}に{保|たも}ち、{労働災害|ろうどうさいがい}を{防|ふせ}ぐために{大切|たいせつ}な{活動|かつどう}。","def_en":"Sort, set in order, clean, cleanliness, and discipline. It keeps the workplace always in the same condition and is an important activity for preventing accidents.","page":45,"ch":"第3章 労働安全"},{"term":"{動線|どうせん}","reading":"どうせん","en":"flow line (movement path)","def":"{道具|どうぐ}や{原材料|げんざいりょう}を{置|お}く{場所|ばしょ}を{決|き}めることで、すべての{人|ひと}が{同|おな}じ{動|うご}き{方|かた}をすること。5Sの「{整頓|せいとん}」でつくられ、{作業|さぎょう}がしやすくなり{転倒災害|てんとうさいがい}の{危険|きけん}が{減|へ}る。","def_en":"When places for tools and materials are decided, everyone moves in the same way. Made by \"seiton\" in 5S; work becomes easier and the risk of falls goes down.","page":46,"ch":"第3章 労働安全"},{"term":"{安全保護具|あんぜんほごぐ}","reading":"あんぜんほごぐ","en":"personal protective equipment (PPE)","def":"ヘルメット、{保護|ほご}メガネ、{手袋|てぶくろ}、{耳栓|みみせん}、{耐熱|たいねつ}エプロン、{安全靴|あんぜんぐつ}など、ケガを{防|ふせ}ぐために{身|み}につけるもの。{着用|ちゃくよう}するように{指示|しじ}されている{場合|ばあい}は、{正|ただ}しく{着用|ちゃくよう}しなければいけない。","def_en":"Helmets, goggles, gloves, earplugs, heat-resistant aprons, safety shoes, etc., worn to prevent injury. When you are told to wear them, you must wear them correctly.","page":47,"ch":"第3章 労働安全"},{"term":"{高所作業|こうしょさぎょう}","reading":"こうしょさぎょう","en":"work at height","def":"{高|たか}さが2メートル{以上|いじょう}のところで{作業|さぎょう}すること。{頭傷防止|とうしょうぼうし}のためヘルメットを{着用|ちゃくよう}する。","def_en":"Working at a height of 2 meters or more. A helmet is worn to protect the head.","page":47,"ch":"第3章 労働安全"},{"term":"{耐切創手袋|たいせっそうてぶくろ}","reading":"たいせっそうてぶくろ","en":"cut-resistant gloves","def":"{指|ゆび}の{切傷|せっしょう}{防止|ぼうし}のための{手袋|てぶくろ}。ステンレス{鋼|こう}の{網|あみ}でつくられた「くさり{手袋|てぶくろ}」や、{切|き}れにくい{繊維|せんい}で{編|あ}んだ「メクセル{手袋|てぶくろ}」がある。","def_en":"Gloves that prevent cuts to the fingers. Types include \"chain gloves\" made of stainless steel mesh and \"Mexcel gloves\" knitted from cut-resistant fiber.","page":47,"ch":"第3章 労働安全"},{"term":"{安全靴|あんぜんぐつ}","reading":"あんぜんぐつ","en":"safety shoes","def":"つま{先|さき}・かかとに{鋼板|こうはん}やプラスチック{板|ばん}を{装着|そうちゃく}してあり、つま{先|さき}・かかとのケガ（{足|あし}の{圧傷|あっしょう}）を{防|ふせ}ぐ{靴|くつ}。","def_en":"Shoes with steel or plastic plates in the toe and heel that prevent crush injuries to the toes and heels.","page":47,"ch":"第3章 労働安全"},{"term":"{指差呼称|しさこしょう}","reading":"しさこしょう","en":"pointing and calling","def":"{信号|しんごう}、{標識|ひょうしき}、{器具|きぐ}、{作業対象|さぎょうたいしょう}などを{指|ゆび}で{指|さ}しながら、その{名称|めいしょう}や{状態|じょうたい}を{声|こえ}に{出|だ}して{言|い}うこと。{危険|きけん}の{予防|よぼう}や{安全|あんぜん}の{確認|かくにん}のためにおこなう。","def_en":"Pointing at signals, signs, tools or work items and saying their name and condition out loud. It is done to prevent danger and confirm safety.","page":49,"ch":"第3章 労働安全"},{"term":"{安全標識|あんぜんひょうしき}","reading":"あんぜんひょうしき","en":"safety sign","def":"{作業者|さぎょうしゃ}が{仕事中|しごとちゅう}にケガをしないように、しなければならないことや{注意|ちゅうい}しなければならないことを、{見|み}やすく{分|わ}かりやすく{示|しめ}したもの。","def_en":"A sign that clearly shows what must be done and what must be watched out for, so that workers do not get hurt during work.","page":49,"ch":"第3章 労働安全"},{"term":"{始業前点検|しぎょうまえてんけん}","reading":"しぎょうまえてんけん","en":"pre-start inspection","def":"{設備|せつび}・{機械|きかい}を{使|つか}う{作業|さぎょう}を{始|はじ}める{前|まえ}に、{汚|よご}れやはさまり、{変|へん}な{臭|にお}い、{音|おと}や{振動|しんどう}、{刃|は}のかけ、{足|た}りない{部品|ぶひん}、{安全装置|あんぜんそうち}やランプなどに{異常|いじょう}がないことを{確認|かくにん}する{作業|さぎょう}。","def_en":"Checking before starting work with equipment that there is nothing abnormal: dirt or jams, strange smells, sounds or vibration, chipped blades, missing parts, safety devices and lamps.","page":49,"ch":"第3章 労働安全"},{"term":"{非常停止|ひじょうていし}ボタン","reading":"ひじょうていしぼたん","en":"emergency stop button","def":"{操作盤|そうさばん}についているボタンで、{押|お}すとすぐに{機械|きかい}が{止|と}まる。{異常|いじょう}なことが{起|お}こったときに{一番|いちばん}{大切|たいせつ}なことは「まず{機械|きかい}を{止|と}める」こと。","def_en":"A button on the control panel that stops the machine immediately. When something abnormal happens, the most important thing is to stop the machine first.","page":50,"ch":"第3章 労働安全"},{"term":"フェールセーフ（fail safe）","reading":"ふぇーるせーふ","en":"fail safe","def":"{部品|ぶひん}が{壊|こわ}れたり{製品|せいひん}がつまったりしたときに、{機械|きかい}が{自動的|じどうてき}に{止|と}まる{仕組|しく}み。{扉|とびら}を{開|あ}けると{機械|きかい}が{止|と}まる{安全装置|あんぜんそうち}もこの{仕組|しく}み。","def_en":"A design where the machine stops automatically when a part breaks or a product jams. A safety device that stops the machine when a door is opened is also fail safe.","page":51,"ch":"第3章 労働安全"},{"term":"フールプルーフ（fool proof）","reading":"ふーるぷるーふ","en":"fool proof","def":"{人|ひと}がうっかりしたり{思|おも}い{違|ちが}いをしたりしても{災害|さいがい}にならないように{工夫|くふう}された{仕組|しく}み。コンベアの{安全|あんぜん}カバーは、{手|て}が{入|はい}らないようにするフールプルーフの{仕組|しく}み。","def_en":"A design that prevents an accident even if a person is careless or misunderstands. The safety cover on a conveyor is fool proof because it stops hands from entering.","page":51,"ch":"第3章 労働安全"},{"term":"{塩素|えんそ}ガス","reading":"えんそがす","en":"chlorine gas","def":"{塩素系|えんそけい}の{洗剤|せんざい}と{酸性洗剤|さんせいせんざい}を{混|ま}ぜて{同時|どうじ}に{使|つか}うと{発生|はっせい}する{有毒|ゆうどく}なガス。とても{危険|きけん}なので、{洗剤|せんざい}を{使|つか}うルールを{守|まも}る。","def_en":"A poisonous gas made when chlorine-based and acidic cleaners are mixed and used together. It is very dangerous, so follow the rules for using cleaners.","page":52,"ch":"第3章 労働安全"},{"term":"{二次災害|にじさいがい}","reading":"にじさいがい","en":"secondary accident","def":"{労働災害|ろうどうさいがい}が{起|お}こったとき、{助|たす}けようとした{人|ひと}も{労働災害|ろうどうさいがい}にあってしまうこと。だから、あわてて{近|ちか}づいてはいけない。","def_en":"When an accident happens and the person who tries to help is also injured. This is why you must not rush over.","page":53,"ch":"第3章 労働安全"},{"term":"ヒヤリ・ハット","reading":"ひやり・はっと","en":"near-miss (hiyari-hatto)","def":"{作業|さぎょう}をしていて、もう{少|すこ}しでケガをするところだった、ということ。「ヒヤリとした」「ハッとした」から{名前|なまえ}がついた。","def_en":"A situation where you almost got injured during work. The name comes from the Japanese words for a sudden scare.","page":54,"ch":"第3章 労働安全"},{"term":"ハインリッヒの{法則|ほうそく}","reading":"はいんりっひのほうそく","en":"Heinrich's Law","def":"1つの{大|おお}きな{労働災害|ろうどうさいがい}が{起|お}こるまでに、{同|おな}じ{原因|げんいん}で{軽|かる}いケガや{小|ちい}さな{災害|さいがい}が29{件|けん}、ヒヤリ・ハットが300{件|けん}{起|お}こっているという{法則|ほうそく}。","def_en":"A rule saying that before one serious accident there are 29 minor injuries and 300 near-misses from the same cause.","page":54,"ch":"第3章 労働安全"},{"term":"ヒヤリ・ハット{活動|かつどう}","reading":"ひやり・はっとかつどう","en":"near-miss reporting activity","def":"{自分|じぶん}が{体験|たいけん}したヒヤリ・ハットを{報告|ほうこく}し{合|あ}って{記録|きろく}し、{工場内|こうじょうない}の{全員|ぜんいん}で{共有|きょうゆう}して、{原因|げんいん}とその{対策|たいさく}を{全員|ぜんいん}で{考|かんが}え、{工場内|こうじょうない}を{良|よ}くしていく{活動|かつどう}。","def_en":"An activity where workers report their own near-misses, record them, share them with everyone in the factory, and think together about causes and countermeasures to improve the factory.","page":55,"ch":"第3章 労働安全"},{"term":"{危険予知訓練|きけんよちくんれん}（KYT）","reading":"きけんよちくんれん","en":"Kiken Yochi Training (hazard prediction training)","def":"{実際|じっさい}に{体験|たいけん}しなくても、{作業場|さぎょうじょう}や{作業|さぎょう}のどこにどのような{危険|きけん}（{潜在的|せんざいてき}な{危険|きけん}）がかくれているかに{気|き}がつき、その{危険|きけん}から{起|お}こる{労働災害|ろうどうさいがい}を{防|ふせ}ぐ{方法|ほうほう}を{考|かんが}える{力|ちから}をつける{訓練|くんれん}。Kiken Yochi Trainingの{初|はじ}めの{文字|もじ}をとってKYTという。","def_en":"Training to notice hidden (potential) dangers in the workplace without experiencing them, and to think about how to prevent accidents from them. KYT comes from the first letters of Kiken Yochi Training.","page":55,"ch":"第3章 労働安全"},{"term":"{潜在的|せんざいてき}な{危険|きけん}","reading":"せんざいてきなきけん","en":"hidden (potential) danger","def":"{作業場|さぎょうじょう}や{作業|さぎょう}にかくれている{危険|きけん}。{仕事|しごと}を{始|はじ}める{前|まえ}や{新|あたら}しい{作業|さぎょう}を{学|まな}ぶときに、どのような{危険|きけん}がかくれているかを{考|かんが}える。","def_en":"Danger hidden in the workplace or in a task. Before starting work or learning a new task, think about what dangers may be hidden.","page":55,"ch":"第3章 労働安全"},{"term":"{転倒|てんとう}","reading":"てんとう","en":"Slip / trip and fall","def":"{濡|ぬ}れた{床|ゆか}で{滑|すべ}ったり、{通路|つうろ}の{物|もの}につまずいたりして{倒|たお}れること。{床|ゆか}の{水|みず}をふき{取|と}る、{通路|つうろ}に{物|もの}を{置|お}かないことが{対策|たいさく}。","def_en":"Falling over after slipping on a wet floor or tripping on objects in a passage. Wipe up floor water and keep passages clear.","page":56,"ch":"第3章 労働安全"},{"term":"はさまれ・{巻|ま}き{込|こ}まれ","reading":"はさまれ・まきこまれ","en":"Caught in / entangled by machinery","def":"{機械|きかい}のカバーの{中|なか}やベルトコンベアなどに{手|て}や{体|からだ}がはさまれたり{巻|ま}き{込|こ}まれたりする{災害|さいがい}。","def_en":"An accident where the hand or body is caught or pulled into a machine, for example inside a cover or by a belt conveyor.","page":57,"ch":"第3章 労働安全"},{"term":"{停止|ていし}ボタン","reading":"ていしぼたん","en":"Stop button","def":"{機械|きかい}を{止|と}めるためのボタン。{清掃|せいそう}・{異物|いぶつ}の{除去|じょきょ}・{検査|けんさ}・{修理|しゅうり}の{前|まえ}に{押|お}し、{確実|かくじつ}に{止|と}まったか{確認|かくにん}する。","def_en":"The button that stops a machine. Press it before cleaning, removing foreign objects, inspection or repair, and confirm the machine has really stopped.","page":58,"ch":"第3章 労働安全"},{"term":"{安全|あんぜん}{装置|そうち}","reading":"あんぜんそうち","en":"Safety device","def":"{危険|きけん}を{防|ふせ}ぐために{機械|きかい}に{付|つ}ける{装置|そうち}。{例|れい}：カバーを{開|あ}けると{機械|きかい}が{自動的|じどうてき}に{止|と}まる{装置|そうち}。","def_en":"A device fitted to a machine to prevent danger, for example one that stops the machine automatically when the cover is opened.","page":58,"ch":"第3章 労働安全"},{"term":"ベルトコンベア","reading":"べるとこんべあ","en":"Belt conveyor","def":"{製品|せいひん}を{運|はこ}ぶベルト{式|しき}の{装置|そうち}。{止|と}めないで{清掃|せいそう}すると、ぞうきんが{引|ひ}っ{掛|か}かって{手|て}が{巻|ま}き{込|こ}まれる{危険|きけん}がある。","def_en":"A belt device that moves products. Cleaning it without stopping it can catch the cloth and pull your hand in.","page":58,"ch":"第3章 労働安全"},{"term":"{押|お}し{板|いた}","reading":"おしいた","en":"Pusher board","def":"スライサーで{食|しょく}パンなどを{切|き}るとき、{手|て}を{使|つか}わずに{材料|ざいりょう}を{押|お}し{出|だ}すための{板|いた}。","def_en":"A board used to push food into a slicer so that your hands do not go near the blade.","page":59,"ch":"第3章 労働安全"},{"term":"{脚立|きゃたつ}","reading":"きゃたつ","en":"Stepladder","def":"{高|たか}い{棚|たな}の{作業|さぎょう}に{使|つか}う{折|お}りたたみ{式|しき}のはしご。{開|ひら}き{止|ど}め{金具|かなぐ}をセットして{使|つか}う。","def_en":"A folding ladder used for work on high shelves. Always use it with the spreader lock set.","page":59,"ch":"第3章 労働安全"},{"term":"{開|ひら}き{止|ど}め{金具|かなぐ}","reading":"ひらきどめかなぐ","en":"Spreader lock (opening stopper) of a stepladder","def":"{脚立|きゃたつ}が{開|ひら}きすぎて{動|うご}かないように{固定|こてい}する{金具|かなぐ}。セットしないと{脚立|きゃたつ}が{動|うご}いて{落|お}ちる{危険|きけん}がある。","def_en":"The metal fitting that locks a stepladder open so it cannot move. Without it the ladder can shift and you may fall.","page":59,"ch":"第3章 労働安全"},{"term":"{保護|ほご}{手袋|てぶくろ}","reading":"ほごてぶくろ","en":"Protective (heat-resistant) glove","def":"{鉄板|てっぱん}、{鍋|なべ}、{釜|かま}などの{高温|こうおん}の{物|もの}を{持|も}って{運|はこ}ぶときに{着用|ちゃくよう}する{手袋|てぶくろ}。","def_en":"Gloves worn when carrying hot items such as oven trays, pots and kettles.","page":60,"ch":"第3章 労働安全"},{"term":"{腰痛|ようつう}","reading":"ようつう","en":"Back pain / lower back injury","def":"{不安定|ふあんてい}な{姿勢|しせい}で{重|おも}い{物|もの}を{持|も}ち{上|あ}げたときなどに{腰|こし}に{起|お}こる{痛|いた}み。{膝|ひざ}を{曲|ま}げた{正|ただ}しい{姿勢|しせい}で{防|ふせ}ぐ。","def_en":"Pain in the lower back caused for example by lifting heavy objects in an unstable posture. Prevent it by bending the knees.","page":61,"ch":"第3章 労働安全"},{"term":"{台車|だいしゃ}","reading":"だいしゃ","en":"Hand cart / trolley","def":"{重|おも}い{物|もの}を{運|はこ}ぶときに{使|つか}う{車|くるま}のついた{道具|どうぐ}。{腰痛|ようつう}を{防|ふせ}ぐためにできるだけ{使用|しよう}する。","def_en":"A wheeled cart used to move heavy items. Use it whenever possible to prevent back injury.","page":61,"ch":"第3章 労働安全"},{"term":"{塩分|えんぶん}","reading":"えんぶん","en":"Salt (in drinks)","def":"{汗|あせ}と{一緒|いっしょ}に{体|からだ}から{出|で}ていくため、{暑|あつ}い{場所|ばしょ}の{作業|さぎょう}では{水分|すいぶん}とともにとる{必要|ひつよう}がある。","def_en":"Salt leaves the body with sweat, so it must be taken together with water when working in hot places.","page":61,"ch":"第3章 労働安全"},{"term":"{安静|あんせい}","reading":"あんせい","en":"Rest quietly","def":"{体|からだ}を{動|うご}かさずに{休|やす}むこと。{熱中症|ねっちゅうしょう}のような{症状|しょうじょう}が{出|で}たら{涼|すず}しいところで{安静|あんせい}にする。","def_en":"Resting without moving. If heat illness symptoms appear, rest quietly in a cool place.","page":62,"ch":"第3章 労働安全"},{"term":"{激突|げきとつ}","reading":"げきとつ","en":"Collision (hitting or being hit)","def":"フォークリフトや{物|もの}に{人|ひと}がぶつかる{災害|さいがい}。{一時|いちじ}{停止|ていし}と{安全|あんぜん}{確認|かくにん}で{防|ふせ}ぐ。","def_en":"An accident where a person collides with a forklift or an object. Prevented by stopping and checking safety.","page":62,"ch":"第3章 労働安全"},{"term":"{非常口|ひじょうぐち}","reading":"ひじょうぐち","en":"Emergency exit","def":"{火事|かじ}や{地震|じしん}のときに{避難|ひなん}するための{出口|でぐち}。{緑色|みどりいろ}の{標識|ひょうしき}で{場所|ばしょ}を{知|し}らせる。","def_en":"The exit used to escape in a fire or earthquake. Its location is shown by a green sign.","page":65,"ch":"第3章 労働安全"},{"term":"{消火器|しょうかき}","reading":"しょうかき","en":"Fire extinguisher","def":"{火|ひ}を{消|け}すための{道具|どうぐ}。{赤|あか}い{標識|ひょうしき}で{置|お}いてある{場所|ばしょ}を{知|し}らせる。","def_en":"Equipment used to put out fires. A red sign shows where it is kept.","page":65,"ch":"第3章 労働安全"}],"signs":[{"name_ja":"{立入禁止|たちいりきんし}","name_en":"Do not enter","kind":"{禁止|きんし}（{赤|あか}）","desc_ja":"{入|はい}ることを{禁止|きんし}する{標識|ひょうしき}。{危険|きけん}な{場所|ばしょ}や{許可|きょか}のない{人|ひと}が{入|はい}れない{場所|ばしょ}に{掲示|けいじ}する。","desc_en":"A sign that forbids entry. It is posted at dangerous places or places where only authorised people may enter."},{"name_ja":"{走|はし}ることを{禁止|きんし}する{標識|ひょうしき}","name_en":"No running","kind":"{禁止|きんし}（{赤|あか}）","desc_ja":"{作業場|さぎょうじょう}で{走|はし}ることを{禁止|きんし}する{標識|ひょうしき}。{転倒|てんとう}や{激突|げきとつ}を{防|ふせ}ぐ。","desc_en":"A sign forbidding running in the workplace. It prevents falls and collisions."},{"name_ja":"{開放|かいほう}{厳禁|げんきん}","name_en":"Opening strictly prohibited","kind":"{禁止|きんし}（{赤|あか}）","desc_ja":"{扉|とびら}をあけっ{放|ぱな}しにすることを{禁止|きんし}する{標識|ひょうしき}。","desc_en":"A sign that forbids leaving the door open."},{"name_ja":"{手|て}をふれるな","name_en":"Do not touch","kind":"{禁止|きんし}（{赤|あか}）","desc_ja":"{手|て}で{触|ふ}れることを{禁止|きんし}する{標識|ひょうしき}。「{危険|きけん} {手|て}をふれるな」などと{表示|ひょうじ}する。","desc_en":"A sign that forbids touching with the hand, for example \"DANGER! DO NOT TOUCH\"."},{"name_ja":"{点検中|てんけんちゅう} スイッチを{入|い}れるな","name_en":"During inspection: do not turn switch on","kind":"{禁止|きんし}（{赤|あか}）","desc_ja":"{点検|てんけん}や{修理|しゅうり}の{間|あいだ}に{機械|きかい}のスイッチを{入|い}れることを{禁止|きんし}する{標識|ひょうしき}。","desc_en":"A sign forbidding anyone from switching the machine on while it is being inspected or repaired."},{"name_ja":"はさまれ{注意|ちゅうい}","name_en":"Watch your hands / caution: pinch point","kind":"{注意|ちゅうい}（{黄|き}）","desc_ja":"{手|て /* ============ ruby ============ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function rb(s){
  if(s==null) return "";
  return esc(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,(m,k,y)=>`<ruby>${k}<rt>${y}</rt></ruby>`);
}
function plain(s){ return String(s||"").replace(/\{([^|{}]+)\|([^|{}]+)\}/g,"$1"); }
function en(t){ return t ? `<div class="en">${esc(t)}</div>` : ""; }

/* ============ storage (safe) ============ */
const KEY="tk1_v1";
let mem=null;
function load(){
  const def={ans:{}, days:[], mocks:[], known:{}, furi:true, showen:false,
             user:"", devId:"", queue:[], gasUrl:"", lastSync:""};
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return Object.assign(def, JSON.parse(raw));
  }catch(e){}
  if(mem) return Object.assign(def, mem);
  return def;
}

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ============ time (Asia/Tokyo, strings only) ============ */
function jstStr(){ return new Date(Date.now()+9*3600000).toISOString().slice(0,19).replace("T"," "); }
function jstDate(){ return new Date(Date.now()+9*3600000).toISOString().slice(0,10); }
function jstShift(n){ return new Date(Date.now()+9*3600000-n*86400000).toISOString().slice(0,10); }

/* ============ sync (GAS + Google Sheets) ============ */
let syncing=false, syncMsg="";
function endpoint(){ return (S.gasUrl||GAS_URL||"").trim(); }
let flushTimer=null;
function enq(row){
  row.t=jstStr(); S.queue.push(row);
  if(S.queue.length>3000) S.queue=S.queue.slice(-3000);
  clearTimeout(flushTimer); flushTimer=setTimeout(()=>flush(true), 4000);
}
function dot(){
  const el=document.getElementById("dot"); if(!el) return;
  if(!endpoint()){ el.textContent="○"; el.title="未設定"; el.style.color="#8A94A2"; }
  else if(syncing){ el.textContent="◍"; el.style.color="#F5A524"; }
  else if(S.queue.length){ el.textContent="●"; el.style.color="#F5A524"; el.title=S.queue.length+"件 未送信"; }
  else { el.textContent="●"; el.style.color="#1FA97C"; el.title="送信ずみ"; }
}
async function flush(silent){
  const url=endpoint();
  if(!url || syncing || !S.queue.length){ dot(); return false; }
  syncing=true; dot();
  const batch=S.queue.slice(0,300);
  try{
    const res=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({user:S.user||"（名前なし）", dev:S.devId, rows:batch})
    });
    const j=await res.json();
    if(j && j.ok){
      S.queue=S.queue.slice(batch.length);
      S.lastSync=jstStr(); syncMsg=""; save();
      syncing=false; dot();
      if(S.queue.length) return flush(true);
      return true;
    }
    syncMsg = (j && j.error) ? String(j.error) : "サーバーがエラーを返しました";
  }catch(e){
    syncMsg = "つうしんできません（オフライン／URLがちがう可能性）";
  }
  syncing=false; dot();
  if(!silent) alert("送信できませんでした：\n"+syncMsg+"\n\n記録はスマホの中に残っています。あとでもう一度おためしください。");
  return false;
}

/* ============ helpers ============ */
const Q = DATA.questions, T = DATA.terms, SIGNS = DATA.signs;
const byId = {}; Q.forEach(q=>byId[q.id]=q);
const GAKKA = Q.filter(q=>q.type==="gakka"), JITSU = Q.filter(q=>q.type==="jitsugi");
const CHAPTERS = [...new Set(Q.map(q=>q.chapter))];
const today = jstDate;

function rec(id){ return S.ans[id] || {c:0,w:0}; }
function mark(id, ok, pick, mode){
  const r = S.ans[id] || {c:0,w:0};
  ok ? r.c++ : r.w++;
  r.last = today();
  S.ans[id]=r;
  const d=today();
  if(S.days[S.days.length-1]!==d) S.days.push(d);
  const q=byId[id];
  enq({kind:"ans", qid:id, ch:q.chapter, topic:q.topic, type:q.type,
       ok:ok?1:0, pick:(pick==null?"":pick+1), mode:mode||"drill"});
  save();
}
function mastered(id){ const r=rec(id); return r.c>0 && r.c>r.w; }
function weak(id){ const r=rec(id); return r.w>0 && r.c<=r.w; }
function seen(id){ const r=rec(id); return r.c+r.w>0; }

function streak(){
  if(!S.days.length) return 0;
  const set=new Set(S.days); let n=0, k=0;
  if(!set.has(jstShift(0))) k=1;
  while(set.has(jstShift(k))){ n++; k++; }
  return n;
}
function shuffle(a,seed){
  a=a.slice();
  let r = seed==null ? Math.random : mulberry(seed);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function topicStats(){
  const m={};
  Q.forEach(q=>{
    const k=q.topic; m[k]=m[k]||{ch:q.chapter,n:0,ok:0,seen:0,ids:[]};
    m[k].n++; m[k].ids.push(q.id);
    const r=rec(q.id); if(r.c+r.w>0){ m[k].seen++; if(mastered(q.id)) m[k].ok++; }
  });
  return m;
}

/* ============ quiz session ============ */
let session=null, timerId=null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function startQuiz(ids, opts){
  opts=opts||{};
  session={
    ids, i:0, picks:new Array(ids.length).fill(null), live:true,
    mode: opts.mode||"drill", title: opts.title||"練習",
    revealed:false, endAt: opts.minutes? Date.now()+opts.minutes*60000 : null
  };
  if(session.endAt){
    stopTimer();
    timerId=setInterval(()=>{
      const el=document.getElementById("timer"); if(!el) return;
      const ms=session.endAt-Date.now();
      if(ms<=0){ stopTimer(); finishQuiz(); return; }
      const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000);
      el.textContent = m+":"+String(s).padStart(2,"0");
      el.classList.toggle("hot", ms<5*60000);
    },500);
  }
  go("quiz");
}

function pick(k){
  const s=session;
  if(s.mode==="mock"){ s.picks[s.i]=k; render(); return; }
  if(s.revealed) return;
  s.picks[s.i]=k; s.revealed=true;
  mark(s.ids[s.i], k===byId[s.ids[s.i]].answer, k, s.title==="復習"?"復習":"練習");
  render();
}
function nextQ(){
  const s=session;
  if(s.i < s.ids.length-1){ s.i++; s.revealed=false; render(); window.scrollTo(0,0); }
  else finishQuiz();
}
function finishQuiz(){
  const s=session; s.live=false; stopTimer();
  if(s.mode==="mock"){
    s.ids.forEach((id,i)=>{ if(s.picks[i]!=null) mark(id, s.picks[i]===byId[id].answer, s.picks[i], "模試"); });
    let g=0,j=0;
    s.ids.forEach((id,i)=>{ const q=byId[id]; if(s.picks[i]===q.answer){ q.type==="gakka"?g++:j++; } });
    const gn=s.ids.filter(id=>byId[id].type==="gakka").length||1;
    const jn=s.ids.filter(id=>byId[id].type==="jitsugi").length||1;
    const pt = Math.round(g*(100/gn) + j*(50/jn));
    S.mocks.push({d:today(), pt, g, j, gn, jn, pass:pt>=98});
    enq({kind:"mock", pt, pass:pt>=98?"合格ライン":"不合格", g, gn, j, jn});
    save();
    s.result={pt,g,j,gn,jn};
  }
  go("result", {s});
  flush(true);
}

function vDrill(){

    ${CHAPTERS.map(ch=>{
      const list=Object.entries(ts).filter(([,v])=>v.ch===ch);
      const n=list.reduce((s,[,v])=>s+v.n,0), o=list.reduce((s,[,v])=>s+v.ok,0);

      return `<div class="card"><h2>${esc(ch)} <span class="tag">${o}/${n}</span></h2>
        <div class="bar" style="margin-bottom:10px"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div>

          <button class="row" data-go="topic" data-ctx='${JSON.stringify({topic:k}).replace(/'/g,"&#39;")}'>

}

/* ---- quiz ---- */
function vQuiz(){
  const s=session;
  if(!s) return vHome();
  const q=byId[s.ids[s.i]], picked=s.picks[s.i];
  const rev = s.mode!=="mock" && s.revealed;
  const answered = s.picks.filter(x=>x!=null).length;
  return `
  <div class="qbar">
    <span>${s.i+1} / ${s.ids.length}</span>
    <span class="prog"><i style="width:${(s.i+ (rev||picked!=null?1:0))/s.ids.length*100}%"></i></span>
    ${s.endAt? `<span class="timer" id="timer">70:00</span>` : `<span class="chip ${q.type==="gakka"?"g":"j"}">${q.type==="gakka"?"学科":"実技"}</span>`}
  </div>
  <div class="card">
    <div style="font-size:11px;color:var(--ink-3);font-weight:700">${esc(q.chapter)} ・ ${esc(q.topic)}</div>
    <div class="qtext">${rb(q.q)}</div>
    ${en(q.q_en)}
    <div class="sp"></div>
    ${q.choices.map((c,k)=>{
      let cls="opt";
      if(rev){ if(k===q.answer) cls+=" ok"; else if(k===picked) cls+=" ng"; }
      else if(picked===k) cls+=" sel";
      return `<button class="${cls}" data-act="pick" data-k="${k}">
        <span class="num">${k+1}</span>${rb(c)}${en(q.choices_en&&q.choices_en[k])}</button>`;
    }).join("")}
    ${rev? `<div class="fb ${picked===q.answer?"ok":"ng"}">
        <div class="hd">${picked===q.answer?"◎ せいかい！ / Correct":"✗ ざんねん… / Incorrect"}</div>
        ${rb(q.explain)}${en(q.explain_en)}
        <div class="src">テキスト p.${q.page}</div>
      </div>` : ""}
  </div>
  ${s.mode==="mock"
    ? `<div class="two">
        <button class="btn ghost" data-act="prev" ${s.i===0?"disabled":""}>← まえ</button>
        ${s.i===s.ids.length-1
          ? `<button class="btn warn" data-act="submit">こたえ合わせ (${answered}/${s.ids.length})</button>`
          : `<button class="btn" data-act="next">つぎ →</button>`}
       </div>
       <button class="btn ghost" data-act="submit">とちゅうで しゅうりょうする (${answered}/${s.ids.length})</button>`
    : (rev? `<button class="btn" data-act="next">${s.i===s.ids.length-1?"けっかを見る":"つぎの問題 →"}</button>`
          : `<div class="muted center">こたえを 1つ えらんでください</div>`)}
  `;
}

/* ---- result ---- */
function vResult(){
  const s=ctx.s||session; if(!s) return vHome();
  const n=s.ids.length, ok=s.ids.filter((id,i)=>s.picks[i]===byId[id].answer).length;
  const wrong=s.ids.filter((id,i)=>s.picks[i]!==byId[id].answer);
  let head;
  if(s.mode==="mock"){
    const r=s.result, pass=r.pt>=98;
    const chb={};
    s.ids.forEach((id,i)=>{const q=byId[id];chb[q.chapter]=chb[q.chapter]||{n:0,o:0};chb[q.chapter].n++;if(s.picks[i]===q.answer)chb[q.chapter].o++;});
    head=`<div class="card"><div class="score">
      <div class="pt">${r.pt}<small> / 150</small></div>
      <div class="verdict ${pass?"pass":"fail"}">${pass?"合格ライン クリア！":"あと "+(98-r.pt)+" 点"}</div>
      <div class="muted" style="margin-top:10px">学科 ${r.g}/${r.gn}問 ・ 実技 ${r.j}/${r.jn}問</div>
    </div>
    <div style="margin-top:6px">${Object.entries(chb).map(([c,v])=>{const p=Math.round(v.o/v.n*100);
      return `<div class="row"><div class="t"><b>${esc(c)}</b>
      <div class="bar"><i class="${p<50?'low':p<65?'mid':''}" style="width:${p}%"></i></div></div>
      <span class="n">${v.o}/${v.n}</span></div>`;}).join("")}</div></div>`;
  }else{
    head=`<div class="card"><div class="score">
      <div class="pt">${ok}<small> / ${n}</small></div>
      <div class="verdict ${ok/n>=0.65?"pass":"fail"}">正答率 ${Math.round(ok/n*100)}%</div>
    </div></div>`;
  }
  return head + `
  ${wrong.length? `<div class="card"><h2><span class="ic">🔁</span>まちがえた問題（${wrong.length}）</h2>
    ${wrong.map(id=>{const q=byId[id];const i=s.ids.indexOf(id);
      return `<div style="border-bottom:1px solid var(--line);padding:12px 0">
        <div style="font-size:11px;color:var(--ink-3);font-weight:700">${esc(q.topic)} ・ p.${q.page}</div>
        <div style="font-weight:600;line-height:1.95;margin:4px 0">${rb(q.q)}</div>${en(q.q_en)}
        <div style="color:var(--red);font-size:14px">あなたの答え：${s.picks[i]==null?"むかいとう":rb(q.choices[s.picks[i]])}</div>
        <div style="color:var(--green);font-size:14px;font-weight:600">正解：${rb(q.choices[q.answer])}</div>
        <div class="fb ok" style="margin-top:8px">${rb(q.explain)}${en(q.explain_en)}</div>
      </div>`;}).join("")}
    <button class="btn warn" data-act="redowrong">この${wrong.length}問を もう一度</button>
  </div>`:`<div class="card center"><div style="font-size:40px">🎉</div><b>ぜんぶ せいかい！</b></div>`}
  <button class="btn ghost" data-go="home">ホームへ もどる</button>`;
}

/* ============ actions ============ */
const ACT={
  pick:b=>pick(+b.dataset.k),
  next:()=>nextQ(),
  prev:()=>{ session.i--; render(); window.scrollTo(0,0); },
  submit:()=>{ if(confirm("こたえ合わせをしますか？")) finishQuiz(); },
  daily:()=>{
    const seedStr=today().replace(/-/g,""); const seed=parseInt(seedStr,10);
    const pri=[...Q.filter(q=>weak(q.id)), ...shuffle(Q.filter(q=>!seen(q.id)),seed), ...shuffle(Q.filter(q=>mastered(q.id)),seed)];
    startQuiz(pri.slice(0,10).map(q=>q.id),{title:"今日の10問"});
  },
  weakdrill:()=>{
    const w=Q.filter(q=>weak(q.id));
    if(!w.length){ alert("にがてな問題はありません。まず練習してみましょう！"); return; }
    startQuiz(shuffle(w).slice(0,20).map(q=>q.id),{title:"復習"});
  },
  chdrill:b=>{ const ch=b.dataset.ch; startQuiz(shuffle(Q.filter(q=>q.chapter===ch)).slice(0,10).map(q=>q.id),{title:ch}); },
  topicdrill:b=>{ const t=b.dataset.t; startQuiz(shuffle(Q.filter(q=>q.topic===t)).map(q=>q.id),{title:t}); },
  startmock:()=>{
    if(!confirm("70分の模擬試験をはじめます。じゅんびはいいですか？")) return;
    const ids=[...shuffle(GAKKA).slice(0,30), ...shuffle(JITSU).slice(0,10)].map(q=>q.id);
    startQuiz(shuffle(ids),{mode:"mock",minutes:70,title:"模擬試験"});
  },
  redowrong:()=>{ const s=ctx.s||session; const w=s.ids.filter((id,i)=>s.picks[i]!==byId[id].answer); startQuiz(w,{title:"復習"}); },
  flip:()=>{ flip=!flip; render(); },
  fnext:()=>{ const l=fList(); fi=(fi+1)%l.length; flip=false; render(); },
  fprev:()=>{ const l=fList(); fi=(fi-1+l.length)%l.length; flip=false; render(); },
  fchap:b=>{ fFilter=b.dataset.c; fi=0; flip=false; render(); },
  fknown:()=>{ const l=fList(); const k=plain(l[fi].term); S.known[k]=!S.known[k]; save(); render(); },
  sync:()=>flush(false),
  savename:()=>{
    const v=(document.getElementById("nameIn").value||"").trim();
    if(!v){ alert("なまえを入れてください"); return; }
    S.user=v; if(!S.devId) S.devId=newDev(); save(); go("home"); flush(true);
  },
  rename:()=>{ const v=prompt("なまえ / Your name", S.user||""); if(v!=null && v.trim()){ S.user=v.trim(); save(); render(); } },
  seturl:()=>{
    const v=prompt("GASのウェブアプリURL（.../exec）を貼りつけてください", S.gasUrl||GAS_URL||"");
    if(v==null) return;
    S.gasUrl=v.trim(); save();
    if(S.gasUrl) flush(false).then(ok=>{ if(ok) alert("せつぞく できました ✓"); render(); }); else render();
  },
  reset:()=>{ if(confirm("このスマホの記録を消します。スプレッドシートに送ったぶんは残ります。よろしいですか？")){
    S=Object.assign(S,{ans:{},days:[],mocks:[],known:{},queue:[]}); save(); go("home"); } }
};
function newDev(){ return "D"+Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ============ init ============ */
applyToggles();
if(!S.devId){ S.devId=newDev(); save(); }
go(S.user ? "home" : "setup");
flush(true);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) flush(true); });
window.addEventListener("online",()=>flush(true));

/* オフライン対応（httpsで配信したときだけ有効。ファイルを直接開いた場合は何もしない） */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
